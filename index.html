    selectField("mins_current_antithrombotic","Current antithrombotic therapy",["None","VTE prophylaxis only","Aspirin","Dual antiplatelet therapy","Therapeutic anticoagulation","Antiplatelet plus therapeutic anticoagulation","Held because of surgery/bleeding","Unknown"],"Clarify the indication before adding or intensifying therapy.")+
    '</div>'+

    '<h4>Treatment and follow-up</h4>'+
    '<details class="miniStep"><summary>Optional: document reversible contributors and cardiovascular actions</summary>'+
    '<label>Correct reversible contributors</label>'+
    checks("mins_trigger_plan",[
      "No trigger-specific treatment selected",
      "Correct hypotension / optimize perfusion and volume status",
      "Treat bleeding or clinically important anemia",
      "Correct hypoxemia / treat respiratory failure",
      "Control sustained tachyarrhythmia",
      "Treat sepsis or infection",
      "Use dedicated PE pathway",
      "Treat acute heart failure",
      "Improve analgesia and reduce physiologic stress"
    ])+
    '<label>Cardiovascular management</label>'+
    checks("mins_cv_plan",[
      "No cardiovascular action selected",
      "Continue or initiate statin when appropriate",
      "Review aspirin only after indication and bleeding safety assessment",
      "Continue chronic beta blocker if hemodynamically appropriate; do not start reflexively for troponin alone",
      "Optimize blood pressure, diabetes, renal function, and other ASCVD risks after stabilization",
      "Cardiology / GIM / perioperative medicine assessment",
      "Targeted echocardiography",
      "Consider ischemia/anatomic evaluation after recovery if it will change management",
      "Document MINS/MI in discharge diagnosis and communicate to primary/specialty care"
    ])+'</details>'+
    '<div class="grid2">'+
    selectField("mins_antithrombotic_plan","Antithrombotic strategy",["No automatic antithrombotic escalation; complete classification and bleeding review","Urgent postoperative ACS/STEMI pathway with cardiology and surgical bleeding-risk coordination","Consider aspirin after confirming ischemic indication and acceptable bleeding risk","Consider MANAGE-style dabigatran 110 mg twice daily only after specialist eligibility/hemostasis review","Not a candidate for antithrombotic intensification because bleeding risk dominates","Already has another indication for therapeutic anticoagulation — reconcile rather than duplicate","Decision deferred pending hemostasis, renal function, or diagnostic clarification"],"Antithrombotic therapy for MINS is individualized; MANAGE supports consideration, not automatic treatment.")+
    selectField("mins_followup","Follow-up plan",["Before discharge and within 1-2 weeks after discharge","Before discharge and within 2-4 weeks after discharge","Urgent cardiology follow-up ≤7 days","Routine cardiovascular follow-up within 4-6 weeks","Continue inpatient management; follow-up timing pending","No follow-up plan documented"],"Ensure explicit ownership, medication reconciliation, and review of pending investigations.")+
    inputField("mins_plan_note","Additional management / ownership note","e.g. surgical team confirms hemostasis; cardiology to review before discharge; repeat hs-cTnT tomorrow")+
    '</div>'+

    '<h4>Output</h4>'+
    '<div class="grid2">'+
    selectField("mins_output_mode","Output mode",["Formal consultant letter","Concise perioperative note","Counseling / teaching note"],"")+
    '</div>'+
    '</div></details>'+
    '<div class="toolbar"><button class="primary" id="minsGenerate">Generate perioperative cardiac pathway</button><button id="minsCopy">Copy output</button><button id="minsReset">Reset pathway</button></div><div id="mins_out" class="output hidden"></div>'+

    '<details class="pathStep"><summary>Evidence and protocol notes</summary><div class="pathStepBody"><p><b>VISION general-surgery substudy:</b> among 7,950 patients, MINS occurred in 12.3%, was detected at a median of postoperative day 2, and was associated with 8.78% versus 2.21% 30-day mortality, adjusted HR 2.00, and an attributable fraction of 14.4%. Major bleeding and sepsis were also leading mortality-associated complications. These are cohort associations, not an individual risk calculator.</p><p class="hint">Primary anchors: Park et al., Annals of Surgery 2025 (VISION substudy); 2024 AHA/ACC perioperative cardiovascular guideline; 2017 Canadian Cardiovascular Society perioperative guideline; Fourth Universal Definition of MI; MANAGE randomized trial. Version 1 should be locally reviewed before use as an institutional protocol.</p></div></details>'+
    '</section>');
    document.getElementById("minsGenerate").addEventListener("click", calcPostopMINS);
    document.getElementById("minsCopy").addEventListener("click", function(){ copyOut("mins_out"); });
    document.getElementById("minsReset").addEventListener("click", resetPostopMINS);
    document.getElementById("mins_entry").addEventListener("change", updateMinsSteps);
    updateMinsSteps();
  }

  function updateMinsSteps(){
    var entry = val("mins_entry");
    var preop = document.getElementById("mins_step_preop");
    var postop = document.getElementById("mins_step_postop");
    var management = document.getElementById("mins_step_management");
    if(!preop || !postop || !management) return;
    preop.open = entry.indexOf("Screening")>=0;
    postop.open = entry.indexOf("Interpret")>=0 || entry.indexOf("Established")>=0;
    management.open = entry.indexOf("Established")>=0 || entry.indexOf("Follow-up")>=0;
  }

  function resetPostopMINS(){
    var out = document.getElementById("mins_out");
    var card = out ? out.closest("section.card") : document;
    if(!card) card = document;
    card.querySelectorAll("input").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio") el.checked = false;
      else el.value = "";
    });
    card.querySelectorAll("select").forEach(function(el){ el.selectedIndex = 0; });
    if(out){ out.textContent = ""; out.className = "output hidden"; }
    card.querySelectorAll(".miniStep").forEach(function(el){ el.open = false; });
    updateMinsSteps();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function minsHas(arr, text){
    return arr.some(function(x){ return x.indexOf(text)>=0; });
  }

  function minsNum(id){
    var raw = val(id);
    if(raw === "") return null;
    var n = Number(raw);
    return Number.isFinite(n) ? n : null;
  }

  function minsMeaningful(arr, noneText){
    return arr.filter(function(x){ return x.indexOf(noneText)<0; });
  }

  function calcPostopMINS(){
    var entry = val("mins_entry");
    var danger = val("mins_danger");
    var redAll = danger ? [danger] : [];
    var redFlags = danger.indexOf("No immediate")>=0 ? [] : redAll;
    var rcriItems = minsMeaningful(checked("mins_rcri"),"No RCRI");
    var ischemiaChoice = val("mins_ischemia_one");
    var triggerChoice = val("mins_trigger_one");
    var nonischemicChoice = val("mins_nonischemic_one");
    var ischemia = ischemiaChoice.indexOf("No ischemic")>=0 ? [] : [ischemiaChoice];
    var triggers = triggerChoice.indexOf("No clear")>=0 ? [] : [triggerChoice];
    var nonischemic = nonischemicChoice.indexOf("No competing")>=0 ? [] : [nonischemicChoice];
    var workup = checked("mins_workup");
    var triggerPlan = minsMeaningful(checked("mins_trigger_plan"),"No trigger");
    var cvPlan = minsMeaningful(checked("mins_cv_plan"),"No cardiovascular");
    var mode = val("mins_output_mode");

    var rcriScore = rcriItems.length;
    var age = val("mins_age");
    var surgeryRisk = val("mins_surgery_risk");
    var cvContext = val("mins_cv_context");
    var bnp = val("mins_bnp");
    var elevatedSurgery = surgeryRisk.indexOf("Elevated")>=0;
    var lowSurgery = surgeryRisk.indexOf("Low-risk")>=0;
    var age65 = age.indexOf("≥65")>=0;
    var age45to64 = age.indexOf("45-64")>=0;
    var knownCVD = cvContext.indexOf("Known")>=0;
    var cvSymptoms = cvContext.indexOf("Symptoms")>=0;
    var cvRiskFactors = cvContext.indexOf("risk factors")>=0 && cvContext.indexOf("No known")<0;
    var bnpHigh = bnp.indexOf("≥300")>=0 || bnp.indexOf("≥92")>=0;
    var accCandidate = elevatedSurgery && (knownCVD || cvSymptoms || (age65 && cvRiskFactors));
    var ccsCandidate = bnpHigh || rcriScore>=1 || age65 || (age45to64 && knownCVD);

    var surveillance = "";
    if(redFlags.length || cvSymptoms){
      surveillance = "This is no longer routine surveillance alone: obtain immediate diagnostic ECG/troponin and bedside assessment according to the clinical presentation.";
    } else if(lowSurgery){
      surveillance = "Routine postoperative troponin surveillance is not indicated for asymptomatic low-risk surgery; use symptom- or deterioration-triggered testing.";
    } else if(accCandidate){
      surveillance = "Higher-risk surveillance is reasonable. Website protocol: use a preoperative/baseline troponin when feasible and measure troponin at approximately 24 and 48 hours; add a 72-hour value if abnormal/rising or concern persists.";
    } else if(elevatedSurgery && ccsCandidate){
      surveillance = "Surveillance is supported by Canadian higher-risk criteria. Website protocol: baseline when feasible, then approximately 24 and 48 hours; consider 72 hours if still hospitalized or if any value is abnormal/rising.";
    } else if(elevatedSurgery){
      surveillance = "Routine surveillance is not automatically triggered by the selected data. Recheck age, CVD context, BNP/NT-proBNP, RCRI, and local policy; test immediately if symptoms or deterioration occur.";
    } else {
      surveillance = "Surgery risk is not yet classified, so surveillance eligibility cannot be finalized.";
    }

    var assay = val("mins_assay");
    var units = val("mins_units");
    var url = minsNum("mins_url");
    var t0 = minsNum("mins_t0");
    var t1 = minsNum("mins_t1");
    var t2 = minsNum("mins_t2");
    var t3 = minsNum("mins_t3");
    var postopValues = [t1,t2,t3].filter(function(x){ return x !== null; });
    var sequence = [t0,t1,t2,t3].filter(function(x){ return x !== null; });
    var maxPost = postopValues.length ? Math.max.apply(null,postopValues) : null;
    var maxDelta = null;
    if(sequence.length>=2){
      maxDelta = 0;
      for(var i=1;i<sequence.length;i++) maxDelta = Math.max(maxDelta,Math.abs(sequence[i]-sequence[i-1]));
    }
    var aboveUrl = maxPost !== null && url !== null && maxPost > url;
    var visionAssay = assay.indexOf("Roche")>=0;
    var visionMet = false;
    if(visionAssay && maxPost !== null){
      visionMet = maxPost>=65 || (maxPost>=20 && maxPost<65 && maxDelta !== null && maxDelta>=5);
    }
    var pattern = val("mins_pattern");
    var acutePattern = pattern.indexOf("Definite")>=0;
    var stablePattern = pattern.indexOf("stable")>=0;
    if(pattern.indexOf("Auto-assess")>=0){
      if(t0 !== null && url !== null && t0<=url && maxPost !== null && maxPost>url) acutePattern = true;
      if(visionAssay && maxPost !== null && maxPost>=20 && maxPost<65 && maxDelta !== null && maxDelta>=5) acutePattern = true;
      if(visionAssay && t0 !== null && maxPost !== null && maxPost>=65 && Math.abs(maxPost-t0)>=5) acutePattern = true;
    }
    var injuryPresent = aboveUrl || visionMet;
    var chronicPattern = injuryPresent && stablePattern;
    var acuteUncertain = injuryPresent && !acutePattern && !chronicPattern;

    var valueText = "Baseline " + (t0===null ? "not available" : t0+" "+units) +
      "; postoperative values " + (postopValues.length ? postopValues.join(", ")+" "+units : "not entered") +
      "; local 99th-percentile URL " + (url===null ? "not entered" : url+" "+units) + ".";
    var deltaText = maxDelta===null ? "No calculable serial absolute change." : "Largest consecutive absolute change entered: "+maxDelta+" "+units+".";
    var visionText = visionAssay ? (visionMet ? "The VISION hs-cTnT biomarker threshold is met; ischemic adjudication is still required." : "The entered values do not currently meet the VISION hs-cTnT biomarker threshold, or serial change is insufficient.") : "VISION hs-cTnT numeric thresholds are not applied to the selected assay.";

    var ecg = val("mins_ecg");
    var echo = val("mins_echo");
    var hasIschemiaEvidence = ischemia.length>0 || ecg.indexOf("ST depression")>=0 || ecg.indexOf("ST elevation")>=0 || ecg.indexOf("pathologic Q")>=0 || echo.indexOf("regional wall")>=0;
    var hasClearNonischemic = nonischemic.length>0 && !(nonischemic.length===1 && minsHas(nonischemic,"Chronic kidney"));
    var hasSupplyDemand = triggers.length>0;
    var clinicianClass = val("mins_final_class");
    var classification = "";
    if(clinicianClass.indexOf("Auto-suggest")<0){
      classification = clinicianClass;
    } else if(!injuryPresent && postopValues.length && url !== null){
      classification = "No myocardial injury detected from the entered assay-specific URL.";
    } else if(!postopValues.length || url === null){
      classification = "Indeterminate — postoperative value and assay-specific URL are required.";
    } else if(chronicPattern || (stablePattern && minsHas(nonischemic,"Chronic kidney"))){
      classification = "Chronic myocardial injury is favored; reassess if symptoms, ECG change, or a new rise/fall develops.";
    } else if(injuryPresent && hasClearNonischemic && !hasIschemiaEvidence){
      classification = "Nonischemic acute myocardial injury is favored; treat and document the underlying diagnosis rather than labeling this MINS automatically.";
    } else if(injuryPresent && acutePattern && ecg.indexOf("ST elevation")>=0){
      classification = "Postoperative STEMI — urgent cardiology/reperfusion pathway with surgical bleeding-risk coordination.";
    } else if(injuryPresent && acutePattern && hasIschemiaEvidence && hasSupplyDemand){
      classification = "Perioperative type 2 MI / ischemic supply–demand injury is favored; type 1 MI must still be excluded when clinically plausible.";
    } else if(injuryPresent && acutePattern && hasIschemiaEvidence){
      classification = "Perioperative myocardial infarction criteria are likely met; determine STEMI/NSTEMI and type 1 versus type 2 mechanism.";
    } else if(injuryPresent && acutePattern && !hasClearNonischemic){
      classification = "Probable MINS without formal MI criteria, pending final clinical adjudication.";
    } else if(acuteUncertain){
      classification = "Myocardial injury is present, but acute versus chronic pattern and MINS etiology remain indeterminate.";
    } else {
      classification = "Classification remains indeterminate; verify serial pattern, ischemic evidence, and competing diagnoses.";
    }

    var urgentClass = classification.indexOf("STEMI")>=0 || classification.indexOf("myocardial infarction criteria")>=0;
    var urgent = redFlags.length>0 || urgentClass;
    var bleeding = val("mins_bleeding");
    var platelets = val("mins_platelets");
    var renal = val("mins_renal");
    var neuraxial = val("mins_neuraxial");
    var bleedingProhibitive = bleeding.indexOf("Active")>=0 || bleeding.indexOf("Ongoing")>=0 || platelets.indexOf("<50")>=0 || neuraxial.indexOf("Epidural")>=0 || neuraxial.indexOf("Urgent reoperation")>=0;
    var bleedingUncertain = bleeding.indexOf("uncertain")>=0 || bleeding.indexOf("Very high")>=0 || renal.indexOf("AKI")>=0 || renal.indexOf("Unknown")>=0 || platelets.indexOf("unknown")>=0 || neuraxial.indexOf("unclear")>=0;

    var antithromboticPlan = val("mins_antithrombotic_plan");
    var antithromboticSafety = "Selected strategy: " + antithromboticPlan + ".";
    if(bleedingProhibitive){
      antithromboticSafety += " Active/prohibitive bleeding or procedural risk is present: do not initiate or intensify antithrombotic therapy from this tool; obtain immediate multidisciplinary review.";
    } else if(bleedingUncertain){
      antithromboticSafety += " Hemostasis, renal function, platelet count, or procedure timing remains uncertain and must be clarified before escalation.";
    } else {
      antithromboticSafety += " Hemostasis appears acceptable from the selected fields, but the ischemic indication and surgical-team agreement still require confirmation.";
    }
    if(antithromboticPlan.indexOf("MANAGE")>=0){
      antithromboticSafety += " MANAGE-style dabigatran is a selective post-MINS consideration—not routine acute ACS treatment—and requires acceptable hemostasis, renal eligibility, no conflicting anticoagulation indication, interaction review, and shared specialist decision.";
    }

    var immediateActions = [];
    if(urgent) immediateActions.push("Immediate bedside escalation; obtain/review ECG and serial troponin, stabilize airway/breathing/circulation, and involve the appropriate cardiology, surgery, anesthesia, GIM, or critical-care team.");
    if(classification.indexOf("STEMI")>=0) immediateActions.push("Activate the postoperative STEMI pathway; reperfusion and antithrombotic decisions must balance ischemic severity against operative bleeding risk.");
    if(classification.indexOf("Nonischemic")>=0) immediateActions.push("Treat the identified nonischemic process and reassess the troponin trajectory and cardiac status.");
    if(classification.indexOf("MINS")>=0 || classification.indexOf("type 2")>=0) immediateActions.push("Correct reversible supply–demand contributors and complete the bleeding-safe cardiovascular plan.");
    if(acuteUncertain) immediateActions.push("Repeat troponin with the same assay and establish the rise/fall pattern before final labeling.");
    if(!immediateActions.length) immediateActions.push("Complete the selected surveillance/evaluation plan and reassess if symptoms or clinical deterioration develop.");

    var completed = [];
    var missing = [];
    var preopOnly = entry.indexOf("Screening")>=0;
    function scoreItem(name, ok){ if(ok) completed.push(name); else missing.push(name); }
    scoreItem("Operative context documented", val("mins_procedure") && val("mins_surgery_risk") && val("mins_urgency"));
    scoreItem("Danger screen reviewed", !!danger);
    scoreItem("Surveillance risk assessed", val("mins_age") && val("mins_cv_context") && checked("mins_rcri").length>0 && val("mins_bnp"));
    if(!preopOnly){
      scoreItem("Assay and local URL documented", assay && units && url !== null);
      scoreItem("Postoperative troponin values/timing documented", postopValues.length>0 && (val("mins_time1") || val("mins_time2") || val("mins_time3")));
      scoreItem("Serial pattern assessed", pattern && pattern.indexOf("unclear")<0);
      scoreItem("Ischemia and competing causes assessed", ecg && ischemiaChoice && nonischemicChoice);
      scoreItem("Minimum evaluation documented", workup.length>=5);
      scoreItem("Bleeding/renal/procedural safety assessed", bleeding && platelets && renal && neuraxial && val("mins_current_antithrombotic"));
      scoreItem("Treatment, ownership, and follow-up documented", (triggerPlan.length || cvPlan.length) && antithromboticPlan && val("mins_followup"));
    }
    var totalItems = completed.length + missing.length;
    var completionPct = totalItems ? completed.length / totalItems : 0;
    var score = completed.length + "/" + totalItems;
    var scoreLabel = completionPct>=0.9 ? "Complete" : (completionPct>=0.7 ? "Mostly complete" : "Gaps remain");

    var evidence =
      "Evidence anchors: 2024 AHA/ACC perioperative cardiovascular guideline; 2017 Canadian Cardiovascular Society perioperative guideline; Fourth Universal Definition of MI; MANAGE randomized trial; Park et al. VISION general-surgery substudy, Annals of Surgery 2025. In VISION general surgery, MINS occurred in 12.3%, median day 2, and was associated with 8.78% versus 2.21% 30-day mortality and adjusted HR 2.00. These observational data do not provide an individual causal risk estimate.";

    var formal =
      "Dear Colleague,\n\n" +
      "Thank you for asking me to assess this patient using the Perioperative Cardiac Risk & MINS Pathway. The entry question is: " + entry + ". Operative context: " + (val("mins_procedure") || "not entered") + "; urgency: " + val("mins_urgency") + "; surgery risk: " + val("mins_surgery_risk") + "; postoperative day: " + (val("mins_pod") || "not entered") + ".\n\n" +
      "Danger-first assessment:\n" +
      (redFlags.length ? "Immediate concerns selected: " + redFlags.join("; ") + ". " + immediateActions.join(" ") : "No immediate danger feature was selected. " + immediateActions.join(" ")) + "\n\n" +
      "Surveillance assessment:\n" +
      "RCRI = " + rcriScore + ". Age: " + age + "; cardiovascular context: " + cvContext + "; natriuretic peptide: " + bnp + ". " + surveillance + "\n\n" +
      "Troponin interpretation:\n" +
      "Assay: " + assay + ". " + valueText + " " + deltaText + " " + visionText + " Serial-pattern assessment: " + pattern + ".\n\n" +
      "Clinical classification:\n" +
      classification + " ECG: " + ecg + ". Imaging: " + echo + ". Ischemic evidence: " + (ischemia.length ? ischemia.join("; ") : "none selected") + ". Supply–demand contributors: " + (triggers.length ? triggers.join("; ") : "none selected") + ". Competing nonischemic diagnoses: " + (nonischemic.length ? nonischemic.join("; ") : "none selected") + ". " + (val("mins_cause_note") ? "Clinical etiology note: " + val("mins_cause_note") + "." : "") + "\n\n" +
      "Minimum evaluation:\n" +
      (workup.length ? workup.map(function(x){return "- "+x;}).join("\n") : "- No evaluation items documented") + "\n\n" +
      "Bleeding and antithrombotic safety:\n" +
      "Hemostasis: " + bleeding + "; hemoglobin/trend: " + (val("mins_hb") || "not entered") + "; platelets: " + platelets + "; renal function: " + renal + "; procedural/neuraxial context: " + neuraxial + "; current therapy: " + val("mins_current_antithrombotic") + ". " + antithromboticSafety + "\n\n" +
      "Plan:\n" +
      "- Reversible contributors: " + (triggerPlan.length ? triggerPlan.join("; ") : "none selected") + ".\n" +
      "- Cardiovascular plan: " + (cvPlan.length ? cvPlan.join("; ") : "none selected") + ".\n" +
      "- Follow-up: " + val("mins_followup") + ".\n" +
      (val("mins_plan_note") ? "- Ownership/additional plan: " + val("mins_plan_note") + ".\n" : "") +
      "\nCare standard completion: " + score + " — " + scoreLabel + (missing.length ? ". Remaining gaps: " + missing.join(", ") + "." : ". No major pathway gaps identified.") + "\n\n" +
      evidence + "\n\n" +
      "Sincerely,\nGeneral Internal Medicine / Perioperative Medicine";

    var concise =
      "Perioperative Cardiac Risk / MINS Assessment\n\n" +
      "Context: " + (val("mins_procedure") || "not entered") + "; " + val("mins_urgency") + "; " + val("mins_surgery_risk") + "; POD " + (val("mins_pod") || "?") + ".\n" +
      "Danger screen: " + (redFlags.length ? redFlags.join("; ") : "no immediate danger feature selected") + ".\n" +
      "Surveillance: RCRI " + rcriScore + "; " + surveillance + "\n\n" +
      "Troponin: " + assay + ". " + valueText + " " + deltaText + " " + visionText + "\n" +
      "ECG/imaging: " + ecg + "; " + echo + ".\n" +
      "Classification: " + classification + "\n" +
      "Potential triggers: " + (triggers.length ? triggers.join("; ") : "none selected") + ".\n" +
      "Competing diagnoses: " + (nonischemic.length ? nonischemic.join("; ") : "none selected") + ".\n\n" +
      "Plan:\n" +
      "- " + immediateActions.join(" ") + "\n" +
      "- Evaluation: " + (workup.length ? workup.join("; ") : "not documented") + ".\n" +
      "- Correct contributors: " + (triggerPlan.length ? triggerPlan.join("; ") : "none selected") + ".\n" +
      "- Cardiovascular: " + (cvPlan.length ? cvPlan.join("; ") : "none selected") + ".\n" +
      "- Antithrombotic safety: " + antithromboticSafety + "\n" +
      "- Follow-up: " + val("mins_followup") + ".\n" +
      "- Care standard: " + score + " — " + scoreLabel + "; missing: " + (missing.length ? missing.join(", ") : "none") + ".";

    var teaching =
      "Clinician teaching note\n\n" +
      "1. Troponin above the assay-specific 99th-percentile URL means myocardial injury. A rise/fall supports acute injury. Acute MI additionally requires evidence of ischemia.\n" +
      "2. MINS is postoperative myocardial injury judged ischemic, whether or not symptoms are present. Sepsis, PE, acute heart failure, stroke, myocarditis, and chronic stable elevation should not be mislabeled as MINS automatically.\n" +
      "3. In this case: " + valueText + " " + deltaText + " " + visionText + "\n" +
      "4. Working classification: " + classification + "\n" +
      "5. The first bedside question is not only whether troponin is elevated, but whether the patient is unstable, has ischemic evidence, has a correctable supply–demand trigger, or has a stronger nonischemic diagnosis.\n" +
      "6. The operative bleeding context changes ACS and antithrombotic decisions. " + antithromboticSafety + "\n\n" +
      "Why this matters:\n" +
      "The VISION general-surgery substudy found MINS in 12.3% of patients, usually early (median postoperative day 2), with approximately twice the adjusted hazard of 30-day mortality. Major bleeding and sepsis were also leading mortality-associated complications, supporting a combined ischemia–bleeding–sepsis assessment rather than a troponin-only response.\n\n" +
      "Patient explanation:\n" +
      "A troponin rise means there may have been stress or injury to the heart muscle around the time of surgery. It does not automatically mean a classic heart attack. We compare repeated levels, the ECG, symptoms, blood pressure, oxygen level, bleeding, infection, heart rhythm, kidney function, and other findings to identify the cause and choose treatment that is safe after surgery.\n\n" +
      "Care standard: " + score + " — " + scoreLabel + (missing.length ? ". Remaining gaps: " + missing.join(", ") + "." : ".");

    var preopFormal =
      "Dear Colleague,\n\n" +
      "Thank you for asking me to complete a preoperative cardiac-risk assessment using the Perioperative Cardiac Risk & MINS Pathway. The planned procedure/context is: " + (val("mins_procedure") || "not entered") + ". Surgical urgency: " + val("mins_urgency") + "; procedural risk: " + val("mins_surgery_risk") + ".\n\n" +
      "The patient is " + age + ", with cardiovascular context: " + cvContext + ". RCRI is " + rcriScore + " based on the selected items. Preoperative natriuretic peptide: " + bnp + ". Immediate danger screen: " + danger + ".\n\n" +
      "Postoperative surveillance plan:\n" +
      surveillance + "\n\n" +
      "This assessment determines surveillance intensity; it does not provide a validated percentage probability of MINS. A baseline troponin improves interpretation when surveillance is planned, particularly in CKD or structural heart disease.\n\n" +
      "Preoperative care-standard completion: " + score + " — " + scoreLabel + (missing.length ? ". Remaining gaps: " + missing.join(", ") + "." : ". No major pathway gaps identified.") + "\n\n" +
      evidence + "\n\n" +
      "Sincerely,\nGeneral Internal Medicine / Perioperative Medicine";

    var preopConcise =
      "Preoperative Cardiac Risk / MINS Surveillance Plan\n\n" +
      "Procedure: " + (val("mins_procedure") || "not entered") + "; " + val("mins_urgency") + "; " + val("mins_surgery_risk") + ".\n" +
      "Risk profile: " + age + "; " + cvContext + "; RCRI " + rcriScore + "; " + bnp + ".\n" +
      "Danger screen: " + danger + ".\n" +
      "Plan: " + surveillance + "\n" +
      "Care standard: " + score + " — " + scoreLabel + "; missing: " + (missing.length ? missing.join(", ") : "none") + ".";

    var preopTeaching =
      "Preoperative teaching note\n\n" +
      "- RCRI, age, known cardiovascular disease, operative risk, and BNP/NT-proBNP help identify who benefits from postoperative surveillance.\n" +
      "- This patient’s RCRI is " + rcriScore + "; age/CVD context: " + age + " / " + cvContext + "; natriuretic peptide: " + bnp + ".\n" +
      "- Recommended surveillance: " + surveillance + "\n" +
      "- Routine troponin screening is not indicated after asymptomatic low-risk surgery. When higher-risk surveillance is selected, baseline plus approximately 24- and 48-hour measurements improve detection and interpretation.\n" +
      "- This is a surveillance decision, not a numerical MINS probability estimate.\n\n" +
      "Care standard: " + score + " — " + scoreLabel + (missing.length ? ". Remaining gaps: " + missing.join(", ") + "." : ".");

    var finalText = formal;
    if(mode === "Concise perioperative note") finalText = concise;
    if(mode === "Counseling / teaching note") finalText = teaching;
    if(preopOnly){
      finalText = preopFormal;
      if(mode === "Concise perioperative note") finalText = preopConcise;
      if(mode === "Counseling / teaching note") finalText = preopTeaching;
    }

    var out = document.getElementById("mins_out");
    out.className = "output " + (urgent ? "red" : ((missing.length || acuteUncertain || bleedingProhibitive || bleedingUncertain) ? "amber" : "green"));
    out.textContent = finalText;
    out.classList.remove("hidden");
  }


  function copyOut(id){
    var el = document.getElementById(id);
    if(!el || el.classList.contains("hidden")){ alert("Generate the output first."); return; }
    navigator.clipboard.writeText(el.textContent).then(function(){ alert("Copied"); });
  }

  function yesAddress(v, bad){
    if(!v) return false;
    if(bad && v.indexOf(bad)>=0) return false;
    if(v.indexOf("Not yet addressed")>=0) return false;
    if(v.indexOf("Unknown")>=0) return false;
    return true;
  }

  function cpadList(name){
    return checked(name);
  }


  function resetConfirmedPAD(){
    var out = document.getElementById("cpad_out");
    var card = out ? out.closest("section.card") : document;
    if(!card) card = document;
    card.querySelectorAll("input").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio") el.checked = false;
      else el.value = "";
    });
    card.querySelectorAll("select").forEach(function(el){
      el.selectedIndex = 0;
    });
    if(out){
      out.textContent = "";
      out.className = "output hidden";
    }
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function calcConfirmedPAD(){
    var visit = val("cpad_visit");
    var followedArr = checked("cpad_followed");
    var followed = followedArr.length ? followedArr.join("; ") : "not specified";
    var pheno = checked("cpad_pheno");
    var limb = checked("cpad_limb");
    var card = cpadList("cpad_card");
    var hf = cpadList("cpad_hf");
    var neuro = cpadList("cpad_neuro");
    var aorta = cpadList("cpad_aorta");
    var quickPoly = cpadList("cpad_poly_quick");
    var bleed = cpadList("cpad_bleed_short");
    var whyNoRevasc = cpadList("cpad_why_no_revasc");
    var whyNoExercise = cpadList("cpad_why_no_exercise");
    var outputMode = val("cpad_output_mode");

    var acute = limb.some(function(x){return x.indexOf("Acute limb ischemia")>=0 || x.indexOf("motor")>=0;});
    var infected = limb.some(function(x){return x.indexOf("Infection")>=0;}) || val("cpad_clti_module").indexOf("Infected")>=0;
    var clti = pheno.some(function(x){return x.indexOf("Rest pain")>=0 || x.indexOf("Wound")>=0 || x.indexOf("Infected")>=0;}) ||
               limb.some(function(x){return x.indexOf("rest pain")>=0 || x.indexOf("wound")>=0 || x.indexOf("Gangrene")>=0;}) ||
               val("cpad_clti_module").indexOf("Not applicable")<0;
    var lifestyleLimiting = pheno.some(function(x){return x.indexOf("Lifestyle-limiting")>=0;}) ||
                    val("cpad_rutherford").indexOf("3")===0 ||
                    val("cpad_exercise").indexOf("Inadequate")>=0;
    var post = pheno.some(function(x){return x.indexOf("Post-revascularization")>=0 || x.indexOf("Recurrent symptoms")>=0;}) ||
               val("cpad_post_module").indexOf("Not applicable")<0 || visit.indexOf("Post-revascularization")>=0;

    var cardiacUrgent = card.some(function(x){return x.indexOf("rest")>=0 || x.indexOf("unstable")>=0;});
    var cardiacReview = card.some(function(x){return x.indexOf("Exertional")>=0 || x.indexOf("dyspnea")>=0 || x.indexOf("Reduced")>=0 || x.indexOf("Known CAD")>=0 || x.indexOf("review")>=0;});
    var hfFlag = hf.some(function(x){return x.indexOf("Known heart failure")>=0 || x.indexOf("reduced EF")>=0 || x.indexOf("HF present")>=0;});
    var neuroUrgent = neuro.some(function(x){return x.indexOf("Transient weakness")>=0 || x.indexOf("Speech")>=0 || x.indexOf("monocular")>=0 || x.indexOf("Facial")>=0;});
    var neuroPoly = neuro.some(function(x){return x.indexOf("Prior")>=0 || x.indexOf("carotid")>=0 || x.indexOf("Carotid")>=0;});
    var aorticUrgent = aorta.some(function(x){return x.indexOf("New severe")>=0 || x.indexOf("Pulsatile")>=0;});
    var aaa = aorta.some(function(x){return x.indexOf("AAA")>=0 || x.indexOf("aortic repair")>=0 || x.indexOf("aortic")>=0;});
    var mesenteric = aorta.some(function(x){return x.indexOf("Post-prandial")>=0 || x.indexOf("mesenteric")>=0;});
    var renalVascular = aorta.some(function(x){return x.indexOf("Resistant")>=0 || x.indexOf("worsening BP")>=0 || x.indexOf("kidney")>=0 || x.indexOf("flash")>=0 || x.indexOf("renal artery")>=0;});
    var highBleed = bleed.some(function(x){return x.indexOf("No major")<0;});

    var phenotype = "Stable confirmed PAD.";
    if(acute) phenotype = "Possible acute limb ischemia — emergency phenotype.";
    else if(infected) phenotype = "Infected ischemic foot concern.";
    else if(clti) phenotype = "CLTI/rest pain/wound-risk phenotype.";
    else if(lifestyleLimiting) phenotype = "Lifestyle-limiting claudication phenotype.";
    else if(post) phenotype = "Post-revascularization follow-up phenotype.";
    else if(pheno.some(function(x){return x.indexOf("Asymptomatic")>=0;})) phenotype = "Asymptomatic confirmed PAD / systemic ASCVD-risk phenotype.";

    var urgentTriggers = [];
    if(acute) urgentTriggers.push("possible acute limb ischemia");
    if(infected) urgentTriggers.push("infected ischemic foot");
    if(cardiacUrgent) urgentTriggers.push("chest pain at rest/unstable cardiac symptoms");
    if(neuroUrgent) urgentTriggers.push("possible TIA/stroke symptoms");
    if(aorticUrgent) urgentTriggers.push("possible urgent aortic symptom");

    var escalation = "Routine PAD follow-up.";
    if(acute) escalation = "Same-day ED/vascular surgery assessment. Do not delay for outpatient testing.";
    else if(infected) escalation = "Same-day or urgent infected ischemic foot pathway with vascular/wound/ID/ED coordination depending severity.";
    else if(clti) escalation = "Urgent vascular surgery/wound pathway; assess wound, infection, perfusion, offloading, and revascularization feasibility.";
    else if(lifestyleLimiting && val("cpad_exercise").indexOf("Inadequate")>=0) escalation = "Consider anatomic imaging and revascularization assessment because symptoms remain lifestyle-limiting despite GDMT/exercise.";
    else if(lifestyleLimiting) escalation = "Optimize GDMT and structured/supervised exercise; reassess response before revascularization unless anatomy/clinical context requires earlier review.";
    else if(post && (val("cpad_post_module").indexOf("Recurrent")>=0 || val("cpad_post_module").indexOf("Abnormal")>=0 || val("cpad_post_module").indexOf("not healing")>=0)) escalation = "Vascular lab/surgeon review for restenosis, graft failure, or progression concern.";
    else if(post) escalation = "Continue post-revascularization surveillance per vascular lab/surgeon protocol.";

    if(followed.indexOf("following")>=0){
      escalation += " Since patient is already followed by " + followed + ", coordinate/confirm follow-up rather than duplicating referral.";
    }

    var poly = [];
    if(quickPoly.length){
      poly.push("Quick negative screen selected: no active cardiac/neuro/aortic/mesenteric/renovascular symptoms today.");
    } else {
      if(cardiacUrgent) poly.push("Cardiac: chest pain at rest/unstable pattern selected — urgent cardiac assessment, not routine PAD-only follow-up.");
      else if(cardiacReview) poly.push("Cardiac: exertional chest pain/dyspnea/CAD signal — consider CAD review before intensifying walking therapy if symptoms are concerning.");
      else poly.push("Cardiac: no major cardiac symptom signal selected.");
      if(hfFlag) poly.push("HF/cardiopulmonary: HF/reduced EF selected — avoid/caution cilostazol and distinguish dyspnea from claudication limitation.");
      else if(hf.some(function(x){return x.indexOf("Shortness")>=0 || x.indexOf("Orthopnea")>=0 || x.indexOf("Edema")>=0 || x.indexOf("Syncope")>=0 || x.indexOf("Palpitations")>=0;})) poly.push("HF/cardiopulmonary: symptoms selected — evaluate cardiopulmonary limitation before attributing all walking limitation to PAD.");
      else poly.push("HF/cardiopulmonary: no major HF/cardiopulmonary signal selected.");
      if(neuroUrgent) poly.push("Neuro/carotid: possible TIA/stroke symptom selected — urgent stroke/TIA pathway if new/recent.");
      else if(neuroPoly) poly.push("Neuro/carotid: prior stroke/TIA or carotid disease selected — polyvascular disease; intensify ASCVD-risk management.");
      else poly.push("Neuro/carotid: no major neuro/carotid signal selected.");
      if(aorticUrgent) poly.push("Aortic: pulsatile mass or new severe abdominal/back/flank pain selected — urgent aortic evaluation if clinically compatible.");
      else if(aaa) poly.push("Aortic: AAA/aortic history or screening concern selected — ensure surveillance/screening is not missed.");
      else poly.push("Aortic: no major aortic signal selected.");
      if(mesenteric) poly.push("Mesenteric: post-prandial pain/food fear/weight loss or known mesenteric stenosis — consider chronic mesenteric ischemia evaluation.");
      if(renalVascular) poly.push("Renovascular: resistant HTN, renal decline, flash pulmonary edema, or known renal artery stenosis selected — consider renovascular evaluation in context.");
    }

    var antith = [];
    var ant = val("cpad_antith");
    if(ant.indexOf("Full-dose")>=0){
      antith.push("Full-dose anticoagulation for another indication: " + (val("cpad_fullac_reason") || "not entered") + ".");
      antith.push("Do not automatically add SAPT or dual-pathway inhibition on top of full-dose anticoagulation unless there is a clear indication and bleeding risk is acceptable.");
    } else if(ant.indexOf("COMPASS")>=0){
      antith.push("COMPASS regimen selected: rivaroxaban 2.5 mg BID + aspirin for stable symptomatic PAD/polyvascular risk if bleeding risk acceptable.");
      antith.push("COMPASS trial one-liner: reduced major cardiovascular and limb events compared with aspirin alone, with increased major bleeding risk.");
      if(val("cpad_riva25")!=="Available") antith.push("Formulary/access issue: rivaroxaban 2.5 mg is " + val("cpad_riva25") + "; document clinical consideration and consider formulary/access pathway or alternative strategy.");
      if(highBleed) antith.push("Bleeding shortcut flags present; dual-pathway inhibition requires careful individualized review.");
    } else if(ant.indexOf("VOYAGER")>=0){
      antith.push("VOYAGER-PAD regimen selected: rivaroxaban 2.5 mg BID + aspirin after lower-extremity revascularization if bleeding risk acceptable.");
      antith.push("VOYAGER-PAD trial one-liner: after revascularization, reduced acute limb ischemia, major amputation, MI, stroke, or cardiovascular death, with increased bleeding risk.");
      if(val("cpad_riva25")!=="Available") antith.push("Formulary/access issue: rivaroxaban 2.5 mg is " + val("cpad_riva25") + "; document clinical consideration and consider formulary/access pathway or alternative strategy.");
      if(highBleed) antith.push("Bleeding shortcut flags present; VOYAGER-style therapy requires careful individualized review.");
    } else if(ant.indexOf("Single")>=0){
      antith.push("Single antiplatelet therapy selected: " + val("cpad_sapt") + ".");
      antith.push("Reason for not using COMPASS/VOYAGER or stronger strategy: " + val("cpad_not_dual") + ".");
    } else {
      antith.push("Antithrombotic deferred/contraindicated/needs review. Details: " + (val("cpad_defer_reason") || "not entered") + ".");
      antith.push("Reason for not using COMPASS/VOYAGER: " + val("cpad_not_dual") + ".");
    }
    if(bleed.length) antith.push("Bleeding-risk shortcut: " + bleed.join("; ") + ".");

    var htn = [];
    htn.push(val("cpad_htn") + ". " + (val("cpad_bp") || "No BP details entered") + ".");
    if(val("cpad_htn").indexOf("Uncontrolled")>=0) htn.push("BP optimization is part of PAD ASCVD-risk reduction.");

    var dm = [];
    dm.push(val("cpad_dm") + ". " + (val("cpad_a1c") || "No A1c/DM details entered") + ".");
    if(val("cpad_dm").indexOf("Uncontrolled")>=0) dm.push("Uncontrolled diabetes increases foot and wound risk; coordinate glycemic management and foot protection.");

    var lipid = [];
    lipid.push(val("cpad_lipid") + ".");
    lipid.push("LDL-C " + (val("cpad_ldl") ? val("cpad_ldl")+" "+val("cpad_ldl_unit") : "NA") +
               "; Non-HDL-C " + (val("cpad_nonhdl") ? val("cpad_nonhdl")+" "+val("cpad_nonhdl_unit") : "NA") +
               "; Lp(a) " + (val("cpad_lpa") ? val("cpad_lpa")+" "+val("cpad_lpa_unit") : "NA") + ".");
    if(val("cpad_lipid").indexOf("Needs high")>=0) lipid.push("High-intensity statin is the default lipid backbone in PAD if tolerated.");

    var level = urgentTriggers.length ? "red" : (clti || lifestyleLimiting || missing.length ? "amber" : "green");
    var out = document.getElementById("cpad_out");
    out.className = "output " + level;
    out.textContent = finalText;
    out.classList.remove("hidden");
  }

  render();
})();
</script>
</body>
</html>
