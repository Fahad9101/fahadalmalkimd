    selectField("ats_owner","Primary coordination/consultation",["General Internal Medicine / primary team","Hematology / thrombosis","Cardiology","Surgery / procedural service","Critical care","Transfusion medicine / pharmacy","Multidisciplinary review"],"")+
    selectField("ats_output_mode","Output mode",["Formal consultant letter","Concise clinical note","Counseling / teaching note"],"")+
    inputField("ats_plan_note","Additional plan / ownership note","e.g. pharmacy checking andexanet availability; hematology to review PF4 result")+
    '</div>'+
    '<div class="toolbar"><button class="primary" id="atsGenerate">Generate antithrombotic safety assessment</button><button id="atsCopy">Copy output</button><button id="atsReset">Reset pathway</button></div><div id="ats_out" class="output hidden"></div>'+

    '<details class="pathStep"><summary>Evidence and protocol notes</summary><div class="pathStepBody"><p><b>Version 1 anchors:</b> ASH HIT guideline and 4Ts diagnostic pathway; ACC anticoagulant-related bleeding pathway; ASH VTE/cancer guidance for recurrent thrombosis; ISTH guidance for DOAC special populations and reversal. Obesity alone is not treated as a universal DOAC exclusion. Reversal and empiric alternative anticoagulation require assessment of bleeding and thrombosis risk.</p><p class="hint">This assistant deliberately routes full AF stroke-benefit decisions, VTE-duration decisions, and peri-procedural interruption schedules to their dedicated pathways.</p></div></details>'+
    '</section>');
    document.getElementById("atsGenerate").addEventListener("click", calcAntithromboticSafety);
    document.getElementById("atsCopy").addEventListener("click", function(){ copyOut("ats_out"); });
    document.getElementById("atsReset").addEventListener("click", resetAntithromboticSafety);
    document.getElementById("ats_scenario").addEventListener("change", updateATSScenario);
    updateATSScenario();
  }

  function updateATSScenario(){
    var map = {
      "Bleeding or urgent reversal":"ats_bleed_panel",
      "Thrombocytopenia / suspected HIT or PF4 syndrome":"ats_hit_panel",
      "New thrombosis despite antithrombotic treatment":"ats_failure_panel",
      "DOAC or anticoagulant danger-zone check":"ats_doac_panel",
      "Heparin resistance / anti-Xa / antithrombin problem":"ats_heparin_panel",
      "Anticoagulant–antiplatelet overlap":"ats_overlap_panel"
    };
    document.querySelectorAll(".scenarioPanel").forEach(function(el){ el.classList.add("hidden"); });
    var target = document.getElementById(map[val("ats_scenario")]);
    if(target) target.classList.remove("hidden");
  }

  function resetAntithromboticSafety(){
    var out = document.getElementById("ats_out");
    var card = out ? out.closest("section.card") : document;
    card.querySelectorAll("input").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio") el.checked = false;
      else el.value = "";
    });
    card.querySelectorAll("select").forEach(function(el){ el.selectedIndex = 0; });
    if(out){ out.textContent = ""; out.className = "output hidden"; }
    updateATSScenario();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function atsScoreValue(id){
    var n = parseInt(val(id),10);
    return Number.isFinite(n) ? n : 0;
  }

  function atsBullets(items){
    return items.length ? items.map(function(x){ return "- " + x; }).join("\n") : "- None generated";
  }

  function calcAntithromboticSafety(){
    var scenario = val("ats_scenario");
    var agent = val("ats_agent");
    var indication = val("ats_indication");
    var danger = val("ats_danger");
    var level = danger.indexOf("No immediate")>=0 ? "green" : "red";
    var safety = level === "red" ? "RED — immediate/high-risk safety issue" : "GREEN — no immediate danger identified";
    var phenotype = scenario;
    var actions = [];
    var avoid = [];
    var tests = [];
    var strategy = [];
    var monitoring = [];
    var teaching = "";
    var hitScore = null;

    function makeAmber(){
      if(level !== "red"){
        level = "amber";
        safety = "AMBER — significant concern, missing data, or specialist review needed";
      }
    }
    function makeRed(){
      level = "red";
      safety = "RED — immediate/high-risk safety issue";
    }
    function addCommonTests(){
      tests.push("Verify the exact drug, dose, indication, last dose, adherence, renal function, liver context, platelet count, hemoglobin, and interacting medicines.");
    }

    if(level === "red") actions.push("Escalate immediately to the bedside clinical team and the appropriate emergency/specialty pathway; do not wait for this note.");

    if(scenario === "Bleeding or urgent reversal"){
      var severity = val("ats_bleed_severity");
      phenotype = severity + " while receiving " + agent;
      addCommonTests();
      tests.push("Assess bleeding source, hemodynamics, CBC/hemoglobin trend, creatinine, coagulation context, type and screen/crossmatch, and time since last dose.");
      if(severity.indexOf("Major")>=0 || severity.indexOf("Life-threatening")>=0 || severity.indexOf("Critical-site")>=0){
        makeRed();
        actions.push("Hold the antithrombotic agent, control the source, provide supportive resuscitation, and contact pharmacy/transfusion medicine plus the responsible procedural team.");
        if(agent.indexOf("Warfarin")>=0) strategy.push("For major VKA-associated bleeding, use the local 4-factor PCC plus intravenous vitamin K pathway; use plasma only when PCC is unavailable or otherwise indicated.");
        else if(agent === "Dabigatran") strategy.push("For life-threatening/uncontrolled dabigatran effect or emergency surgery, use the idarucizumab pathway when clinically relevant drug is present.");
        else if(agent === "Apixaban" || agent === "Rivaroxaban" || agent === "Edoxaban") strategy.push("For clinically relevant factor Xa inhibitor effect, use the local andexanet pathway when appropriate/available for apixaban or rivaroxaban; 4-factor PCC is an alternative strategy. Edoxaban requires local specialist guidance.");
        else if(agent.indexOf("Unfractionated")>=0) strategy.push("Use the local protamine reversal pathway for UFH after confirming recent exposure.");
        else if(agent === "LMWH") strategy.push("Protamine provides partial LMWH reversal; base the local pathway on agent, dose, timing, renal function, and bleeding severity.");
        else if(agent === "Fondaparinux") strategy.push("Fondaparinux has no specific antidote; use supportive/hemostatic specialist management and consider PCC-based options only through local expert guidance.");
        else strategy.push("Confirm the agent before choosing reversal; do not use a nonspecific reversal product reflexively.");
      } else if(severity.indexOf("Minor")>=0){
        makeAmber();
        actions.push("Use local measures, review the need for temporary interruption, correct reversible factors, and reassess.");
        avoid.push("Avoid routine reversal for most nonmajor bleeding.");
      } else if(severity.indexOf("urgent procedure")>=0 || val("ats_urgent_procedure").indexOf("Urgent")>=0 || val("ats_urgent_procedure").indexOf("Emergency")>=0){
        makeAmber();
        actions.push("Confirm procedure urgency, last dose, renal clearance, and whether the procedure can safely wait for drug clearance.");
        strategy.push("Use agent-specific urgent-procedure guidance; reversal is justified only when the procedure cannot wait and clinically relevant anticoagulant effect is likely.");
      } else makeAmber();
      avoid.push("Avoid assuming PT/INR or aPTT reliably excludes clinically relevant DOAC effect.");
      monitoring.push("Reassess bleeding control, hemoglobin, organ function, thrombosis risk, and when/if antithrombotic therapy should resume.");
      teaching = "Reversal is for life-threatening/major bleeding or genuinely urgent procedures when relevant drug effect is likely—not for most minor bleeding.";
    }

    if(scenario === "Thrombocytopenia / suspected HIT or PF4 syndrome"){
      hitScore = atsScoreValue("ats_hit_platelet") + atsScoreValue("ats_hit_timing") + atsScoreValue("ats_hit_thrombosis") + atsScoreValue("ats_hit_other");
      var hitProb = hitScore<=3 ? "low-probability HIT" : (hitScore<=5 ? "intermediate-probability HIT" : "high-probability HIT");
      phenotype = hitProb + " (4Ts " + hitScore + "/8)";
      tests.push("Reconstruct every heparin exposure and platelet count, including flushes, dialysis, procedures, and outside-hospital treatment.");
      if(hitScore<=3){
        actions.push("HIT is unlikely from the selected 4Ts data; evaluate alternative thrombocytopenia causes.");
        avoid.push("Avoid routine PF4 testing when the 4Ts score is reliably low, because false-positive labeling can cause harm.");
        strategy.push("Heparin may generally continue or resume if otherwise indicated and no separate contraindication exists.");
      } else {
        makeRed();
        actions.push("Stop all heparin products and heparin flushes; assess bleeding risk and begin an appropriate non-heparin anticoagulant unless contraindicated.");
        tests.push("Send a PF4 immunoassay; if positive and available, use a functional assay to clarify the diagnosis.");
        strategy.push("Choose argatroban, bivalirudin, fondaparinux, or a DOAC according to clinical stability, organ function, bleeding/procedure context, and local expertise.");
        avoid.push("Avoid starting warfarin during acute HIT; if recently started, obtain urgent specialist advice regarding vitamin K reversal.");
        avoid.push("Avoid routine platelet transfusion unless active bleeding or a high-risk procedure warrants it.");
        monitoring.push("Trend platelets and assess for thrombosis; in isolated acute HIT, screen appropriate limbs for clinically silent proximal DVT according to the exposure context.");
      }
      if(val("ats_pf4_special").indexOf("No VITT")<0){
        makeRed();
        tests.push("For a possible VITT/autoimmune PF4 syndrome, urgently assess CBC, D-dimer, fibrinogen, PF4 ELISA, and thrombosis at symptom-directed sites.");
        strategy.push("Use urgent hematology guidance for IVIG and non-heparin anticoagulation when the syndrome is clinically suspected.");
      }
      monitoring.push("Reassess when immunoassay/functional testing returns; a negative immunoassay usually redirects away from HIT.");
      teaching = "The 4Ts score comes before PF4 testing. The core acute HIT actions are to avoid heparin and provide appropriate non-heparin anticoagulation.";
    }

    if(scenario === "New thrombosis despite antithrombotic treatment"){
      var confirmation = val("ats_fail_confirm");
      phenotype = confirmation.indexOf("confirmed")>=0 ? "Objectively confirmed thrombosis despite treatment" : "Possible anticoagulant failure — recurrence not yet fully confirmed";
      addCommonTests();
      tests.push("Compare current and prior imaging to distinguish new thrombosis/extension from chronic clot or post-thrombotic symptoms.");
      tests.push("Review adherence, interruptions, dose, INR where relevant, renal function, interactions, absorption, weight, cancer, APS, HIT, and anatomic/device drivers.");
      if(confirmation.indexOf("confirmed")>=0){
        makeRed();
        actions.push("Treat this as a clinically important recurrent event while simultaneously identifying why therapeutic exposure failed.");
      } else {
        makeAmber();
        actions.push("Obtain objective confirmation before labeling treatment failure or escalating intensity.");
      }
      if(val("ats_fail_adherence").indexOf("missed")>=0 || val("ats_fail_adherence").indexOf("interruption")>=0 || val("ats_fail_dose").indexOf("subtherapeutic")>=0 || val("ats_fail_dose").indexOf("Inappropriate")>=0){
        strategy.push("Correct the identified underexposure problem; this may represent inadequate exposure rather than biological anticoagulant failure.");
      }
      strategy.push(val("ats_fail_action") + ".");
      if(val("ats_fail_action").indexOf("LMWH")>=0) strategy.push("A switch to therapeutic LMWH or review of LMWH intensity should occur only after confirmation, bleeding assessment, and specialist review.");
      if(val("ats_fail_type").indexOf("Arterial")>=0 || val("ats_fail_type").indexOf("Cardioembolic")>=0) strategy.push("Route the event to the indication-specific arterial/AF/valve/APS pathway; simply increasing a DOAC may be inappropriate.");
      avoid.push("Avoid reflexively adding antiplatelet therapy or increasing anticoagulation without defining the event and mechanism.");
      monitoring.push("Document the confirmed baseline imaging comparison and arrange thrombosis/hematology ownership for reassessment.");
      teaching = "Most apparent anticoagulant failure is first a verification problem: confirm a new clot, then check exposure, indication, and persistent drivers.";
    }

    if(scenario === "DOAC or anticoagulant danger-zone check"){
      var dangers = checked("ats_doac_dangers");
      var hardDanger = dangers.some(function(x){ return x.indexOf("Mechanical")>=0 || x.indexOf("mitral")>=0 || x.indexOf("APS")>=0 || x.indexOf("Pregnancy")>=0; });
      var cautionDanger = dangers.some(function(x){ return x.indexOf("renal")>=0 || x.indexOf("liver")>=0 || x.indexOf("interaction")>=0 || x.indexOf("bariatric")>=0 || x.indexOf("adherence")>=0 || x.indexOf("Duplicate")>=0; });
      phenotype = hardDanger ? "Likely inappropriate/high-risk anticoagulant context" : (cautionDanger ? "Anticoagulant safety concern requiring correction" : "No major danger zone identified from selected data");
      addCommonTests();
      if(hardDanger){
        makeRed();
        actions.push("Do not assume routine DOAC eligibility; verify the indication and use the appropriate warfarin, pregnancy, APS, or specialist pathway.");
      } else if(cautionDanger || val("ats_dose_safety").indexOf("appropriate")<0){
        makeAmber();
        actions.push("Clarify the correct agent and dose before continuing unchanged.");
      }
      if(dangers.some(function(x){return x.indexOf("Duplicate")>=0;})) actions.push("Stop unintended duplicate anticoagulation after immediate medication reconciliation.");
      if(dangers.some(function(x){return x.indexOf("AKI")>=0;})) strategy.push("Avoid fixed-dose assumptions during AKI; use a short-acting/monitorable strategy when clinically appropriate until renal function stabilizes.");
      if(dangers.some(function(x){return x.indexOf("bariatric")>=0;})) strategy.push("Review postoperative timing, absorption, indication, and whether a monitorable/parenteral strategy is preferred.");
      if(dangers.some(function(x){return x.indexOf("Extreme")>=0;})) strategy.push("Extreme weight is not a universal DOAC exclusion; make an agent- and indication-specific decision.");
      strategy.push("Dose assessment: " + val("ats_dose_safety") + ". Interaction assessment: " + val("ats_interaction") + ".");
      avoid.push("Avoid transferring one DOAC’s renal, weight, or dose-reduction criteria to another agent.");
      monitoring.push("Document Cockcroft–Gault CrCl, weight, liver status, interaction review, and follow-up laboratory timing.");
      teaching = "A DOAC danger-zone check is about the right drug, indication, dose, organ function, interactions, absorption, and adherence—not a single creatinine or weight cutoff.";
    }

    if(scenario === "Heparin resistance / anti-Xa / antithrombin problem"){
      phenotype = val("ats_heparin_issue") + " on " + val("ats_heparin_agent");
      makeAmber();
      tests.push("Confirm the administered dose, weight, infusion delivery, sample timing, assay calibration, and whether a DOAC or coagulopathy interferes.");
      tests.push("Compare aPTT and anti-Xa when UFH response is discordant; review factor VIII/fibrinogen, lupus anticoagulant, DIC, liver disease, and antithrombin.");
      if(val("ats_heparin_thrombosis").indexOf("confirmed")>=0){
        makeRed();
        actions.push("Treat confirmed thrombosis as clinical anticoagulant failure while urgently clarifying heparin delivery, HIT, antithrombin, and assay interpretation.");
      }
      if(val("ats_at_level").indexOf("reduced")>=0){
        strategy.push("Low antithrombin can reduce UFH/LMWH effect; interpret the level in the acute clinical context and confirm whether the anti-Xa assay adds exogenous antithrombin.");
        strategy.push("Argatroban and bivalirudin are direct thrombin inhibitors and do not depend on antithrombin.");
      }
      if(val("ats_inflammation").indexOf("factor VIII")>=0) strategy.push("A low aPTT despite therapeutic anti-Xa may reflect high factor VIII/fibrinogen rather than inadequate UFH effect.");
      if(val("ats_assay").indexOf("unclear")>=0 || val("ats_assay").indexOf("unknown")>=0) actions.push("Contact the coagulation laboratory before acting on the anti-Xa result.");
      avoid.push("Avoid interpreting a UFH-, LMWH-, or DOAC-calibrated anti-Xa result as interchangeable.");
      avoid.push("Avoid escalating heparin solely to normalize an aPTT when anti-Xa and the clinical picture suggest adequate effect.");
      monitoring.push("Repeat the correctly timed/calibrated test after delivery and assay issues are resolved; follow clinical thrombosis and bleeding endpoints.");
      teaching = "Heparin resistance is a clinic–laboratory problem. Delivery, timing, assay calibration, inflammation, antithrombin, and true thrombosis all matter.";
    }

    if(scenario === "Anticoagulant–antiplatelet overlap"){
      phenotype = val("ats_overlap_regimen") + " for " + val("ats_overlap_indication");
      makeAmber();
      tests.push("Reconcile the indication and intended stop date for every anticoagulant, antiplatelet, and NSAID.");
      if(val("ats_overlap_regimen").indexOf("Triple")>=0 || val("ats_overlap_bleed").indexOf("Active")>=0){
        makeRed();
        actions.push("Obtain urgent cardiology/primary-team review of the combined regimen and bleeding status.");
      }
      if(val("ats_overlap_indication").indexOf("Recent")>=0) strategy.push("Use the dedicated ACS/PCI antithrombotic pathway; minimize triple-therapy exposure and document the planned transition.");
      if(val("ats_overlap_indication").indexOf("Stable CAD")>=0 || val("ats_overlap_indication").indexOf("Primary")>=0 || val("ats_overlap_indication").indexOf("No clear")>=0) strategy.push("Review whether aspirin provides a current net benefit when therapeutic anticoagulation is already required.");
      if(val("ats_nsaid").indexOf("NSAID")>=0) avoid.push("Avoid NSAIDs where possible because they add bleeding risk without antithrombotic benefit.");
      strategy.push("Selected conclusion: " + val("ats_overlap_plan") + ".");
      avoid.push("Avoid indefinite triple therapy or anticoagulant–aspirin overlap without a documented indication and stop date.");
      monitoring.push("Document the owner, planned duration, gastroprotection when indicated, and bleeding review.");
      teaching = "Every antithrombotic drug needs its own current indication and planned duration. Unnecessary aspirin and NSAIDs are common correctable hazards.";
    }

    var completed = [], missing = [];
    function scoreItem(name, ok){ if(ok) completed.push(name); else missing.push(name); }
    scoreItem("Clinical scenario summarized", !!val("ats_summary"));
    scoreItem("Indication documented", indication && indication.indexOf("unclear")<0);
    scoreItem("Agent and dose documented", agent && agent.indexOf("unclear")<0 && !!val("ats_dose"));
    scoreItem("Last dose/adherence documented", val("ats_lastdose") && val("ats_lastdose")!=="Unknown");
    scoreItem("Renal/liver safety assessed", val("ats_renal")!=="Unknown" && val("ats_liver")!=="Unknown");
    scoreItem("Immediate danger screen reviewed", !!danger);
    if(scenario.indexOf("HIT")>=0) scoreItem("4Ts elements completed", val("ats_hit_platelet").indexOf("Unknown")<0 && val("ats_hit_timing").indexOf("Unknown")<0 && val("ats_hit_thrombosis")!=="Unknown" && val("ats_hit_other")!=="Unknown");
    else if(scenario.indexOf("Bleeding")>=0) scoreItem("Bleeding severity/timing assessed", val("ats_bleed_severity").indexOf("unclear")<0 && !!val("ats_lastdose"));
    else if(scenario.indexOf("thrombosis")>=0) scoreItem("Recurrence objectively assessed", val("ats_fail_confirm")!=="No objective assessment");
    else if(scenario.indexOf("danger-zone")>=0) scoreItem("Danger zones and dose reviewed", checked("ats_doac_dangers").length>0 && !!val("ats_dose_safety"));
    else if(scenario.indexOf("Heparin")>=0) scoreItem("Assay and timing reviewed", val("ats_assay")!=="Assay unknown" && val("ats_sample_time")!=="Timing unknown");
    else scoreItem("Overlap indication and duration assessed", !!val("ats_overlap_indication") && val("ats_pci_timing")!=="Unknown");
    scoreItem("Ownership/follow-up documented", !!val("ats_owner"));
    var total = completed.length + missing.length;
    var pct = total ? completed.length/total : 0;
    var careScore = completed.length + "/" + total;
    var careLabel = pct>=0.9 ? "Complete" : (pct>=0.7 ? "Mostly complete" : "Gaps remain");

    if(!actions.length) actions.push("No immediate emergency action generated; complete the selected safety review and reassess if the clinical situation changes.");
    if(!tests.length) addCommonTests();
    if(!strategy.length) strategy.push("Use an individualized antithrombotic plan after indication, exposure, bleeding risk, and organ function are verified.");
    if(!monitoring.length) monitoring.push("Reassess clinical response, bleeding, thrombosis, CBC, and organ function according to the active problem.");
    if(!avoid.length) avoid.push("Avoid changing therapy without confirming the drug, indication, dose, exposure, and active safety problem.");

    var core =
      "Safety status: " + safety + "\n" +
      "Working phenotype: " + phenotype + "\n" +
      (hitScore===null ? "" : "4Ts score: " + hitScore + "/8\n") +
      "Immediate actions:\n" + atsBullets(actions) + "\n\n" +
      "Hold/avoid:\n" + atsBullets(avoid) + "\n\n" +
      "Minimum investigations:\n" + atsBullets(tests) + "\n\n" +
      "Agent-specific strategy:\n" + atsBullets(strategy) + "\n\n" +
      "Monitoring/reassessment:\n" + atsBullets(monitoring) + "\n\n" +
      "Primary ownership: " + val("ats_owner") + ".\n" +
      (val("ats_plan_note") ? "Additional plan: " + val("ats_plan_note") + ".\n" : "") +
      "Care standard: " + careScore + " — " + careLabel + (missing.length ? ". Remaining gaps: " + missing.join(", ") + "." : ".");

    var formal =
      "Dear Colleague,\n\n" +
      "Thank you for asking me to review antithrombotic safety. The primary scenario is " + scenario + ". " + (val("ats_summary") ? "In brief: " + val("ats_summary") + "." : "A one-line case summary was not entered.") + "\n\n" +
      "The current indication is " + indication + ". Therapy: " + agent + ", " + (val("ats_dose") || "dose not entered") + "; last-dose/adherence status: " + val("ats_lastdose") + "; antiplatelet exposure: " + val("ats_antiplatelet") + ". Renal context: " + val("ats_renal") + "; liver context: " + val("ats_liver") + ".\n\n" +
      core + "\n\n" +
      "Teaching line: " + teaching + "\n\n" +
      "Evidence anchors: ASH HIT and VTE guidance; ACC anticoagulant-related bleeding pathway; ISTH guidance on DOAC reversal and special populations. This Version 1 output requires clinical and local-protocol verification.\n\n" +
      "Sincerely,\nVascular Medicine / General Internal Medicine";

    var concise = "Antithrombotic Safety Assessment\n\n" + core;

    var counseling =
      "Clinician teaching note\n\n" +
      teaching + "\n\n" +
      core + "\n\n" +
      "Patient explanation:\nBlood-thinning medicines reduce clotting risk but can become unsafe when there is bleeding, a new clot, a major platelet fall, kidney/liver change, an interaction, or unnecessary overlap with another blood-thinning medicine. The safest plan depends on confirming the exact medicine, why it is being used, the last dose, current laboratory results, and the cause of the new problem.";

    var finalText = formal;
    if(val("ats_output_mode")==="Concise clinical note") finalText = concise;
    if(val("ats_output_mode")==="Counseling / teaching note") finalText = counseling;
    var out = document.getElementById("ats_out");
    out.className = "output " + level;
    out.textContent = finalText;
    out.classList.remove("hidden");
  }

    '<div class="scenarioPanel hidden" id="diarr_infectious_panel"><h3>Acute or inflammatory exposure screen</h3><span class="hint">A single focused exposure is more useful than an indiscriminate stool panel.</span><div class="grid2">'+
    selectField("diarr_exposure","Dominant exposure",["No specific exposure","Sick contact or institutional outbreak","Travel or unsafe food/water","Undercooked meat, unpasteurized food, or animal exposure","Seafood / salt-water exposure","Daycare or healthcare-associated exposure","Sexual exposure relevant to enteric infection","Exposure uncertain"],"")+

    '<div class="scenarioPanel hidden" id="diarr_chronic_panel"><h3>Chronic-diarrhea screen</h3><span class="hint">Alarm features move the plan toward gastroenterology assessment and endoscopy rather than a functional diagnosis.</span><div class="grid2">'+
    selectField("diarr_alarm","Chronic alarm features",["No alarm feature identified","Unintentional weight loss or nutritional decline","Iron-deficiency anemia or unexplained anemia","Persistent visible blood","Hypoalbuminemia or objective inflammation","Family history of IBD, celiac disease, or colorectal cancer","New onset at older age","Multiple alarm features","Not assessed"],"")+
    selectField("diarr_chronic_clue","Dominant chronic clue",["No dominant clue","Celiac disease / malabsorption concern","Bile-acid diarrhea risk","Microscopic colitis risk","Inflammatory bowel disease concern","Functional diarrhea / IBS-D pattern after exclusions","Endocrine/systemic cause concern","Immunocompromised chronic infection concern","Unclear"],"")+
    selectField("diarr_surgery","Relevant surgery / anatomy",["No relevant surgery","Cholecystectomy","Ileal disease or resection","Bariatric surgery","Pancreatic surgery or chronic pancreatitis","Short bowel / extensive resection","Other GI surgery","Anatomy uncertain"],"")+
    '</div></div>'+

    '<div class="scenarioPanel hidden" id="diarr_fatty_panel"><h3>Fatty / malabsorptive screen</h3><div class="grid2">'+
    selectField("diarr_pancreas","Pancreatic context",["No pancreatic risk identified","Chronic pancreatitis","Pancreatic surgery","Pancreatic cancer / duct obstruction concern","Longstanding diabetes with possible pancreatic dysfunction","Risk uncertain"],"")+
    selectField("diarr_nutrition","Nutritional impact",["No objective nutritional impact known","Weight loss","Low albumin or micronutrient deficiency","Both weight loss and laboratory deficiency","Not assessed"],"")+
    '</div></div>'+
    '</div></details>'+

    '<details class="pathStep" id="diarr_step_testing"><summary>3. Testing and supportive management</summary><div class="pathStepBody">'+
    '<div class="grid2">'+
    selectField("diarr_basic_labs","Basic laboratory status",["Not yet assessed","Electrolytes and kidney function reassuring","Electrolyte abnormality","AKI / kidney-function decline","Anemia, leukocytosis, or inflammatory signal","Multiple abnormalities"],"")+
    selectField("diarr_stool_status","Stool-testing status",["No stool testing yet","Multiplex enteric panel / culture pending","C. difficile test pending","Giardia / parasite testing pending","Fecal calprotectin or lactoferrin pending","Prior stool testing negative","Positive result available — interpret clinically"],"")+
    selectField("diarr_support","Current hydration plan",["No plan documented","Oral rehydration solution","Oral fluids without structured replacement","IV isotonic crystalloid","Combined oral and IV replacement","Fluid plan requires comorbidity-specific adjustment"],"")+
    selectField("diarr_antimotility","Antimotility / symptomatic therapy",["Not being used","Considering only if non-inflammatory diarrhea is confirmed","Currently receiving loperamide or similar","Avoiding due to inflammatory, C. difficile, STEC, ileus, or toxic-colitis concern","Medication plan uncertain"],"")+
    selectField("diarr_owner","Primary ownership",["General Internal Medicine / primary team","Emergency medicine","Critical care","Gastroenterology","Infectious diseases","Surgery","Multidisciplinary plan"],"")+
    inputField("diarr_plan_note","Additional plan or local-protocol note","e.g. contact precautions started; repeat creatinine tomorrow")+
    '</div>'+
    '</div></details>'+

    '<details class="pathStep"><summary>4. Output</summary><div class="pathStepBody"><div class="grid2">'+
    selectField("diarr_output_mode","Output mode",["Concise clinical note","Formal consultant letter","Counseling / teaching note"],"")+
    '</div></div></details>'+
    '<div class="toolbar"><button class="primary" id="diarrGenerate">Generate diarrhea assessment</button><button id="diarrCopy">Copy output</button><button id="diarrReset">Reset pathway</button></div><div id="diarr_out" class="output hidden"></div>'+
    '<details class="pathStep"><summary>Evidence and protocol notes</summary><div class="pathStepBody"><p><b>Version 1 anchors:</b> IDSA infectious-diarrhea guideline; CDC C. difficile clinical overview and testing stewardship; AGA laboratory evaluation of chronic watery diarrhea; ACG adult acute-diarrhea guidance.</p><p class="hint">Interpret multiplex panels in the clinical context because nucleic-acid detection may not prove active disease. Apply local laboratory acceptance criteria, infection-control policy, antimicrobial stewardship, and public-health reporting requirements.</p></div></details>'+
    '</section>');

    ["diarr_duration","diarr_phenotype"].forEach(function(id){ document.getElementById(id).addEventListener("change", updateDiarrheaPanels); });
    document.getElementById("diarrGenerate").addEventListener("click", calcDiarrhea);
    document.getElementById("diarrCopy").addEventListener("click", function(){ copyOut("diarr_out"); });

  function updateDiarrheaPanels(){
    var duration = val("diarr_duration");
    var phenotype = val("diarr_phenotype");
    var infectious = duration.indexOf("Acute")===0 || duration.indexOf("Persistent")===0 || phenotype.indexOf("Inflammatory")===0;
    var chronic = duration.indexOf("Chronic")===0;
    var fatty = phenotype.indexOf("Fatty")===0;
    var p1=document.getElementById("diarr_infectious_panel"); if(p1) p1.classList.toggle("hidden",!infectious);
    var p2=document.getElementById("diarr_chronic_panel"); if(p2) p2.classList.toggle("hidden",!chronic);
    var p3=document.getElementById("diarr_fatty_panel"); if(p3) p3.classList.toggle("hidden",!fatty);
  }

  function resetDiarrhea(){
    var out=document.getElementById("diarr_out");
    var card=out ? out.closest("section.card") : document;
    card.querySelectorAll("input").forEach(function(el){ if(el.type==="checkbox" || el.type==="radio") el.checked=false; else el.value=""; });
    card.querySelectorAll("select").forEach(function(el){ el.selectedIndex=0; });
    card.querySelectorAll(".pathStep").forEach(function(el,i){ el.open=i===0; });
    if(out){ out.textContent=""; out.className="output hidden"; }
    updateDiarrheaPanels();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function calcDiarrhea(){
    var duration=val("diarr_duration"), phenotype=val("diarr_phenotype"), danger=val("diarr_danger");
    var hydration=val("diarr_hydration"), oral=val("diarr_oral"), host=val("diarr_host");
    var inflammatory=val("diarr_inflammatory"), alarm=val("diarr_alarm"), course=val("diarr_course");
    var cdiRisk=val("diarr_cdi_risk"), laxative=val("diarr_laxative"), frequency=val("diarr_frequency");
    var red=danger!=="Not assessed" && danger!=="No immediate danger feature";
    var dehydrationConcern=hydration.indexOf("Moderate")===0 || hydration.indexOf("Severe")===0 || oral.indexOf("Unable")===0 || oral.indexOf("Aspiration")===0;
    var highHost=host!=="Standard adult risk" && host!=="Risk context uncertain";
    var inflammatorySyndrome=phenotype.indexOf("Inflammatory")===0 || (inflammatory && inflammatory!=="None identified" && inflammatory!=="Unable to assess");
    var unformed3=frequency.indexOf("3-5")===0 || frequency.indexOf("6 or more")===0;
    var meaningfulCdiExposure=cdiRisk!=="No major exposure identified" && cdiRisk!=="Exposure history uncertain";
    var laxativeExplains=laxative.indexOf("within the last 48")>=0;
    var laxativeEligibilityKnown=laxative.indexOf("No laxative")===0 || laxative.indexOf("stopped more than 48")>=0;
    var cdiEligible=unformed3 && meaningfulCdiExposure && laxativeEligibilityKnown;
    var level=red?"red":((dehydrationConcern || highHost || inflammatorySyndrome || cdiEligible || danger==="Not assessed")?"amber":"green");
    var safety=red?"RED — immediate bedside escalation required":(level==="amber"?"AMBER — higher-risk features require active review":"GREEN — no immediate danger feature selected");
    var immediate=[], tests=[], avoid=[], support=[], follow=[];

    if(red){
      immediate.push("Escalate now for monitored assessment and resuscitation; do not wait for outpatient stool results.");
      tests.push("Obtain urgent CBC, electrolytes, creatinine, glucose, and additional perfusion/sepsis testing guided by the presentation.");
      if(danger.indexOf("Peritonitis")>=0 || danger.indexOf("distension")>=0 || danger.indexOf("ischemia")>=0) immediate.push("Obtain urgent abdominal imaging and surgical/critical-care review as clinically indicated.");
      if(danger.indexOf("Sepsis")>=0) tests.push("Obtain blood cultures and targeted source evaluation before antimicrobials when feasible without delaying treatment.");
    } else if(danger==="Not assessed"){
      immediate.push("Complete the danger screen before relying on this output.");
    } else {
      immediate.push("No emergency trigger selected; continue focused assessment and reassess if perfusion, pain, mental status, or stool output worsens.");
    }

    if(hydration.indexOf("Severe")===0 || oral.indexOf("Unable")===0 || oral.indexOf("Aspiration")===0){
      support.push("Use monitored isotonic IV crystalloid resuscitation with comorbidity-specific reassessment of perfusion, urine output, electrolytes, and kidney function.");
    } else if(hydration.indexOf("Mild")===0 || hydration.indexOf("Moderate")===0 || oral.indexOf("Reduced")===0){
      support.push("Use oral rehydration solution in frequent small volumes when safe; add IV isotonic crystalloid if oral replacement is inadequate.");
    } else {
      support.push("Encourage oral rehydration solution and continued nutrition as tolerated; replace ongoing losses and monitor for dehydration.");
    }
    if(val("diarr_basic_labs").indexOf("Electrolyte abnormality")===0 || val("diarr_basic_labs").indexOf("AKI")===0 || val("diarr_basic_labs").indexOf("Multiple")===0) support.push("Correct electrolyte and kidney-function abnormalities with serial reassessment rather than a fixed fluid plan.");

    var classification="Indeterminate diarrhea syndrome";
    if(duration.indexOf("Acute")===0 && phenotype.indexOf("Watery")===0) classification="Acute watery diarrhea";
    else if(duration.indexOf("Persistent")===0 && phenotype.indexOf("Watery")===0) classification="Persistent watery diarrhea";
    else if(duration.indexOf("Chronic")===0 && phenotype.indexOf("Watery")===0) classification="Chronic watery diarrhea";
    else if(phenotype.indexOf("Inflammatory")===0) classification=(duration.indexOf("Chronic")===0?"Chronic inflammatory diarrhea":"Acute/persistent inflammatory diarrhea");
    else if(phenotype.indexOf("Fatty")===0) classification="Fatty / malabsorptive diarrhea";

    var physiology="Not applicable or not established";
    if(duration.indexOf("Chronic")===0 && phenotype.indexOf("Watery")===0 && course.indexOf("continues despite fasting")>=0){
      physiology="Secretory physiology favored by nocturnal/fasting persistence";
    } else if(duration.indexOf("Chronic")===0 && phenotype.indexOf("Watery")===0 && course.indexOf("Improves substantially")===0){
      physiology="Osmotic physiology favored by improvement with fasting";
    }

    if(duration.indexOf("Acute")===0){
      if(inflammatorySyndrome || red || highHost){
        tests.push("Use selective bacterial stool testing guided by local availability; include Shiga-toxin/STEC detection when blood, severe cramping, tenderness, fever, or sepsis raises concern.");
      } else {
        avoid.push("Do not order a broad stool panel routinely for short, uncomplicated watery diarrhea without inflammatory or high-risk features.");
      }
    }
    if(duration.indexOf("Persistent")===0){
      tests.push("Reassess the exposure timeline and use targeted testing for Giardia and other pathogens/parasites based on travel, water, outbreak, immune, and public-health context.");
    }
    if(inflammatorySyndrome){
      tests.push("Evaluate for invasive infection and inflammatory colitis; use CBC, renal/electrolyte assessment, stool pathogen testing, and gastroenterology evaluation according to severity and duration.");
      avoid.push("Avoid antimotility drugs when inflammatory diarrhea, STEC, C. difficile, ileus, or toxic colitis is suspected.");
      avoid.push("Do not generate automatic empiric antibiotics; first consider STEC and use local infectious-diseases and antimicrobial-stewardship guidance.");
    } else if(val("diarr_antimotility").indexOf("Currently receiving")===0){
      support.push("Reconfirm that there is no fever, blood, inflammatory colitis, C. difficile, STEC, ileus, or toxic-colitis concern before continuing antimotility therapy.");
    }

    if(cdiEligible){
      immediate.push("Start contact precautions now for suspected C. difficile according to local infection-control policy.");
      tests.push("Send an unformed stool specimen using the local C. difficile testing algorithm; interpret a positive result only in the compatible clinical syndrome.");
      avoid.push("Do not repeat C. difficile testing to document cure after symptoms resolve.");
    } else if(laxativeExplains && !red){
      avoid.push("A laxative or bowel regimen may explain the diarrhea: stop it when appropriate and reassess after at least 48 hours before C. difficile testing if symptoms persist.");
    } else if(frequency.indexOf("No current")===0){
      avoid.push("Do not send C. difficile testing on formed stool or in the absence of a compatible diarrheal syndrome.");
    }

    if(duration.indexOf("Chronic")===0){
      tests.push("For chronic watery diarrhea, consider fecal calprotectin or lactoferrin, Giardia testing, celiac serology with tTG-IgA plus an IgA-deficiency strategy, and assessment for bile-acid diarrhea.");
      avoid.push("Without relevant travel, immigration, or immune risk, avoid routine broad ova-and-parasite testing beyond Giardia.");
      if(alarm && alarm!=="No alarm feature identified" && alarm!=="Not assessed"){
        follow.push("Alarm features are present: arrange gastroenterology assessment and endoscopic evaluation rather than assigning a functional diagnosis.");
      } else if(val("diarr_chronic_clue").indexOf("Microscopic")===0){
        follow.push("Request colonoscopy with colonic biopsies when evaluating possible microscopic colitis; the mucosa may appear normal.");
      } else {
        follow.push("If initial chronic-diarrhea evaluation is unrevealing, reassess medication, bile-acid, microscopic-colitis, malabsorption, endocrine, and functional causes before labeling IBS-D.");
      }
    }
    if(phenotype.indexOf("Fatty")===0){
      tests.push("Assess nutritional status and malabsorption; consider celiac testing and fecal elastase with pancreatic imaging or specialist review when pancreatic insufficiency is plausible.");
      follow.push("Refer for gastroenterology/nutrition assessment when weight loss, deficiencies, pancreatic disease, or altered anatomy is present.");
    }
    if(val("diarr_medication")!=="No likely medication culprit identified" && val("diarr_medication")!=="Medication review incomplete"){
      follow.push("Review timing and necessity of the suspected medication or feeding trigger; adjust safely and document whether symptoms improve.");
    } else if(val("diarr_medication")==="Medication review incomplete"){
      follow.push("Complete medication reconciliation, including laxatives, magnesium, metformin, antibiotics, colchicine, PPIs, NSAIDs, SSRIs, immunosuppressants, and enteral feeds.");
    }
    if(!tests.length) tests.push("No automatic stool test is generated; choose testing only after duration, phenotype, host risk, and exposures are established.");
    if(!avoid.length) avoid.push("Avoid reflex broad panels and treatment escalation without a compatible syndrome and interpretable specimen.");
    if(!follow.length) follow.push("Reassess within the clinical timeframe appropriate to hydration, host risk, stool frequency, and symptom trajectory.");

    var completed=[],missing=[];
    function scoreItem(name,ok){ if(ok) completed.push(name); else missing.push(name); }
    scoreItem("Danger and hydration assessed",danger!=="Not assessed" && hydration!=="Not assessed" && oral!=="Not assessed");
    scoreItem("Duration and frequency classified",duration!=="Not yet classified" && frequency!=="Not documented");
    scoreItem("Phenotype characterized",phenotype!=="Unclear / mixed");
    scoreItem("C. difficile eligibility reviewed",cdiRisk!=="Exposure history uncertain" && laxative!=="Medication history uncertain");
    scoreItem("Medication cause reviewed",val("diarr_medication")!=="Medication review incomplete");
    scoreItem("Laboratory and hydration plan documented",val("diarr_basic_labs")!=="Not yet assessed" && val("diarr_support")!=="No plan documented");
    scoreItem("Ownership documented",!!val("diarr_owner"));
    var total=completed.length+missing.length, pct=completed.length/total;
    var careLabel=pct>=0.9?"Complete":(pct>=0.7?"Mostly complete":"Gaps remain");

    var core=
      "Safety status: "+safety+"\n"+
      "Syndrome: "+classification+". Duration: "+duration+". Frequency: "+frequency+".\n"+
      "Physiology: "+physiology+".\n"+
      "C. difficile testing eligibility: "+(cdiEligible?"Eligible based on entered stool frequency, exposure, and laxative context":"Not established from the entered data")+".\n\n"+
      "Immediate triage / infection control:\n"+atsBullets(immediate)+"\n\n"+
      "Testing now or next:\n"+atsBullets(tests)+"\n\n"+
      "Supportive management:\n"+atsBullets(support)+"\n\n"+
      "Avoid / safety cautions:\n"+atsBullets(avoid)+"\n\n"+
      "Follow-up and escalation:\n"+atsBullets(follow)+"\n\n"+
      "Ownership: "+val("diarr_owner")+".\n"+
      (val("diarr_plan_note")?"Additional plan: "+val("diarr_plan_note")+".\n":"")+
      "Care standard: "+completed.length+"/"+total+" — "+careLabel+(missing.length?". Remaining gaps: "+missing.join(", ")+".":".");

    var concise="Adult Diarrhea Assessment\n\n"+core;
    var formal="Dear Colleague,\n\nThank you for asking me to assess this adult with diarrhea. "+(val("diarr_summary")?"In brief: "+val("diarr_summary")+". ":"")+"The presentation is classified as "+classification.toLowerCase()+".\n\n"+core+"\n\nEvidence anchors: IDSA infectious-diarrhea guidance; CDC C. difficile testing and infection-control guidance; AGA chronic watery-diarrhea laboratory guidance; ACG acute-diarrhea guidance.\n\nSincerely,\nGeneral Internal Medicine";
    var teaching="Clinician teaching note\n\nThe safe sequence is: triage perfusion and abdominal danger, classify duration and stool phenotype, decide whether C. difficile or selective pathogen testing is justified, replace fluid and electrolytes, review medications, and escalate chronic alarm or malabsorptive features.\n\n"+core+"\n\nPatient explanation:\nMost short episodes improve with careful fluid replacement, but some patterns need stool testing or urgent assessment. Seek prompt reassessment for inability to drink, fainting, worsening severe pain, blood in stool, confusion, reduced urine output, or rapid clinical deterioration.";
    var finalText=concise;
    if(val("diarr_output_mode")==="Formal consultant letter") finalText=formal;
    if(val("diarr_output_mode")==="Counseling / teaching note") finalText=teaching;
    var out=document.getElementById("diarr_out");
    out.className="output "+level;
    out.textContent=finalText;
    out.classList.remove("hidden");
  }


  function renderHyponatremia(){

    '<section class="card">'+

    '</div>'+
    '<div class="subtlebox"><b>Emergency rule:</b> severe or moderately severe symptoms plausibly caused by hyponatremia require immediate monitored treatment with a local 3% saline bolus protocol. Aim for an initial rise of approximately 4–6 mmol/L or symptom improvement—not normalization.</div>'+

    selectField("hypo_context","Dominant clinical context",["No dominant cause selected","Vomiting/diarrhea or poor intake","Primary polydipsia","Low-solute intake","Pain, nausea, postoperative state, or pulmonary/CNS trigger","Heart failure","Cirrhosis/portal hypertension","Nephrotic syndrome","Adrenal insufficiency","Severe hypothyroidism","Renal failure","Reset osmostat possible","Mixed causes"],"")+

    selectField("hypo_owner","Primary ownership",["General Internal Medicine / primary team","Critical care","Nephrology","Endocrinology","Emergency medicine","Multidisciplinary plan"],"")+
    inputField("hypo_plan_note","Additional plan / cause note","e.g. stop hydrochlorothiazide; repeat Na and urine output in 2 hours")+
    '</div>'+
    '<div class="subtlebox"><b>Correction guardrail:</b> generally target a controlled rise of 4–6 mmol/L. In high-risk patients, do not exceed 8 mmol/L in any 24 hours. In standard-risk chronic/unknown-duration hyponatremia, avoid >10 mmol/L in the first 24 hours and >8 mmol/L in each subsequent 24 hours; a conservative ≤8 mmol/L target is reasonable when uncertainty exists.</div>'+
    '</div></details>'+

    '<details class="pathStep"><summary>4. Output</summary><div class="pathStepBody">'+

    selectField("hypo_output_mode","Output mode",["Formal consultant letter","Concise clinical note","Counseling / teaching note"],"")+

    '<details class="pathStep"><summary>Evidence and protocol notes</summary><div class="pathStepBody"><p><b>Version 1 anchors:</b> European Society of Endocrinology hyponatremia guideline; Society for Endocrinology emergency guidance for symptomatic hyponatremia; Hyponatraemia Treatment Standard 2024; US/Irish correction-limit recommendations; Endocrine Society adrenal-insufficiency guidance.</p><p class="hint">Symptoms may have another cause. Hypertonic saline and overcorrection rescue require a monitored setting and institution-specific prescribing. Formulas cannot replace serial sodium and urine-output assessment.</p></div></details>'+
    '</section>');
    document.getElementById("hypoGenerate").addEventListener("click", calcHyponatremia);
    document.getElementById("hypoCopy").addEventListener("click", function(){ copyOut("hypo_out"); });
    document.getElementById("hypoReset").addEventListener("click", resetHyponatremia);
  }

  function resetHyponatremia(){
    var out = document.getElementById("hypo_out");
    var card = out ? out.closest("section.card") : document;
    card.querySelectorAll("input").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio") el.checked = false;
      else el.value = "";
    });
    card.querySelectorAll("select").forEach(function(el){ el.selectedIndex = 0; });
    card.querySelectorAll(".pathStep").forEach(function(el,i){ el.open = i===0; });
    if(out){ out.textContent = ""; out.className = "output hidden"; }
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function hypoNum(id){
    var raw = val(id);
    if(raw==="") return null;
    var n = Number(raw);
    return Number.isFinite(n) ? n : null;
  }

  function calcHyponatremia(){
    var na = hypoNum("hypo_na");
    var glucose = hypoNum("hypo_glucose");
    var correctedNa = na;
    if(na!==null && glucose!==null){
      if(val("hypo_glucose_unit")==="mg/dL" && glucose>100) correctedNa = na + 1.6*((glucose-100)/100);
      if(val("hypo_glucose_unit")==="mmol/L" && glucose>5.6) correctedNa = na + 1.6*((glucose-5.6)/5.6);
    }
    var osm = hypoNum("hypo_osm");
    var uosm = hypoNum("hypo_uosm");
    var una = hypoNum("hypo_una");
    var k = hypoNum("hypo_k");
    var symptoms = val("hypo_symptoms");
    var severe = symptoms.indexOf("Severe symptoms")>=0;
    var moderate = symptoms.indexOf("Moderately severe")>=0;
    var level = severe || moderate ? "red" : "green";
    var safety = level==="red" ? "RED — symptomatic hyponatremia requiring immediate monitored treatment" : "GREEN — no severe symptom trigger selected";
    var actions = [], tests = [], treatment = [], monitoring = [], cautions = [];

    var tonicity = "Tonicity not established";
    if(osm!==null){
      if(osm<275) tonicity = "Hypotonic hyponatremia";
      else if(osm<=295) tonicity = "Isotonic range — evaluate pseudohyponatremia/laboratory method";
      else tonicity = "Hypertonic/translocational hyponatremia";
    } else if(val("hypo_pseudo").indexOf("Marked hyperglycemia")>=0 || val("hypo_pseudo").indexOf("effective osmole")>=0){
      tonicity = "Hypertonic/translocational hyponatremia is likely";
    } else if(val("hypo_pseudo").indexOf("hyperlipidemia")>=0){
      tonicity = "Pseudohyponatremia is possible";
    } else if(correctedNa!==null && correctedNa>=135 && glucose!==null){
      tonicity = "Glucose-corrected sodium is not hyponatremic; translocational hyponatremia is favored";
    }

    var phenotype = "";
    var override = val("hypo_override");
    if(override.indexOf("Auto-suggest")<0){
      phenotype = override;
    } else if(tonicity.indexOf("Hypertonic")>=0 || tonicity.indexOf("translocational")>=0){
      phenotype = "Hypertonic/translocational hyponatremia";
    } else if(tonicity.indexOf("Pseudo")>=0 || val("hypo_pseudo").indexOf("hyperlipidemia")>=0){
      phenotype = "Pseudohyponatremia";
    } else if(val("hypo_adrenal").indexOf("possible")>=0 || val("hypo_adrenal").indexOf("crisis")>=0 || val("hypo_context")==="Adrenal insufficiency"){
      phenotype = "Adrenal-insufficiency-associated hyponatremia";
    } else if(val("hypo_renal").indexOf("Advanced")>=0 || val("hypo_renal")==="Dialysis" || val("hypo_context")==="Renal failure"){
      phenotype = "Renal-failure-associated hyponatremia";
    } else if(uosm!==null && uosm<=100){
      phenotype = val("hypo_context")==="Low-solute intake" ? "Low-solute hypotonic hyponatremia with suppressed ADH" : "Primary polydipsia/low-solute hypotonic hyponatremia";
    } else if(uosm!==null && uosm>100 && una!==null && una<=30){
      phenotype = val("hypo_volume").indexOf("Edema")>=0 ? "Hypervolemic hypotonic hyponatremia with low effective arterial volume" : "Hypovolemic/low-effective-arterial-volume hypotonic hyponatremia";
    } else if(uosm!==null && uosm>100 && una!==null && una>30){
      if(val("hypo_volume").indexOf("euvolemic")>=0 && val("hypo_diuretic").indexOf("No diuretic")>=0 && val("hypo_adrenal").indexOf("unlikely")>=0 && val("hypo_thyroid").indexOf("unlikely")>=0) phenotype = "SIADH/euvolemic hypotonic hyponatremia";
      else if(val("hypo_diuretic").indexOf("Thiazide")>=0) phenotype = "Thiazide-associated hypotonic hyponatremia";
      else phenotype = "ADH-active hypotonic hyponatremia with urine sodium >30 — cause remains mixed/indeterminate";
    } else {
      phenotype = "Hyponatremia phenotype remains indeterminate";
    }

    if(severe || moderate){
      actions.push("Begin immediate monitored treatment using the local 3% hypertonic-saline bolus protocol, regardless of the final cause, when symptoms are plausibly due to hyponatremia.");
      treatment.push("Aim for symptom improvement or an initial sodium increase of approximately 4–6 mmol/L; stop repeated boluses once the clinical target is achieved.");
      monitoring.push("Check serum sodium frequently during active treatment, commonly every 2–4 hours, with continuous clinical reassessment.");
      cautions.push("Investigate other causes of neurologic symptoms, especially if sodium is >130 mmol/L or symptoms do not improve after an appropriate initial rise.");
    }

    tests.push("Repeat serum sodium and glucose; obtain measured serum osmolality when tonicity is not established.");
    tests.push("For true hypotonic hyponatremia, obtain urine osmolality and urine sodium ideally before major therapy when this will not delay emergency treatment.");
    tests.push("Review medications, renal function, potassium, volume/effective arterial-volume context, cortisol/adrenal risk, and thyroid status.");

    if(phenotype.indexOf("Hypertonic")>=0){
      treatment.push("Treat hyperglycemia or the effective osmole and monitor the measured sodium as water shifts reverse.");
      cautions.push("Do not treat translocational hyponatremia as hypotonic SIADH.");
    } else if(phenotype.indexOf("Pseudo")>=0){
      treatment.push("Confirm the sodium using direct ion-selective electrode methodology and address the lipid/paraprotein context.");
      cautions.push("Do not give sodium-directed therapy for pseudohyponatremia.");
    } else if(phenotype.indexOf("Hypovolemic")>=0){
      treatment.push("Restore effective circulating volume with isotonic crystalloid and treat ongoing sodium/fluid losses.");
      monitoring.push("Watch closely for sudden water diuresis and rapid correction after volume restoration.");
    } else if(phenotype.indexOf("Hypervolemic")>=0){
      treatment.push("Treat the underlying heart failure/cirrhosis/nephrotic state; use individualized fluid/sodium restriction and loop-diuretic strategy.");
    } else if(phenotype.indexOf("SIADH")>=0){
      treatment.push("Remove reversible triggers/medications and use an individualized fluid restriction; consider solute/urea or loop-based strategies through local specialist guidance when restriction is ineffective.");
      cautions.push("Confirm adrenal sufficiency and exclude major thyroid/renal confounders before calling this SIADH.");
    } else if(phenotype.indexOf("Thiazide")>=0){
      treatment.push("Stop the thiazide, correct potassium/volume abnormalities, and avoid future rechallenge when causality is convincing.");
      monitoring.push("Thiazide withdrawal can trigger rapid water diuresis and overcorrection.");
    } else if(phenotype.indexOf("polydipsia")>=0 || phenotype.indexOf("Low-solute")>=0){
      treatment.push("Limit excess free water and reintroduce dietary solute/protein in a controlled manner.");
      monitoring.push("Low-solute states can autocorrect rapidly after solute is restored; monitor sodium and urine output closely.");
    } else if(phenotype.indexOf("Adrenal")>=0){
      treatment.push("Draw cortisol/ACTH when feasible without delaying care; if adrenal crisis is suspected, begin the emergency glucocorticoid and volume-resuscitation pathway immediately.");
      monitoring.push("Glucocorticoid replacement can produce brisk water diuresis and rapid sodium correction.");
    } else if(phenotype.indexOf("Renal")>=0){
      treatment.push("Individualize fluid, solute, diuretic, and dialysis strategy with nephrology based on residual kidney function and volume status.");
    }

    if(val("hypo_diuretic").indexOf("SIADH-associated")>=0 || val("hypo_diuretic").indexOf("Desmopressin")>=0) treatment.push("Review and stop the culprit medication when safe; anticipate water diuresis after withdrawal.");
    if(k!==null && k<3.5){
      treatment.push("Correct hypokalemia and count its effect toward the total sodium correction.");
      cautions.push("Potassium replacement can materially raise serum sodium.");
    }

    var ods = checked("hypo_ods").filter(function(x){return x.indexOf("No high-risk")<0;});
    var highODS = ods.length>0 || (na!==null && na<=105);
    var ceiling = highODS ? "Target approximately 4–6 mmol/L and do not exceed 8 mmol/L in any 24-hour period." : "Target approximately 4–6 mmol/L; avoid >10 mmol/L in the first 24 hours and >8 mmol/L in each subsequent 24 hours. Use a conservative ≤8 mmol/L target when uncertainty exists.";
    monitoring.push(ceiling);

    var startNa = hypoNum("hypo_start_na");
    var latestNa = hypoNum("hypo_latest_na");
    var hours = hypoNum("hypo_hours");
    var correctionText = "Correction trajectory not calculable.";
    var overcorrect = false;
    if(startNa!==null && latestNa!==null && hours!==null && hours>0){
      var delta = latestNa-startNa;
      var rate = delta/hours;
      var projected = rate*24;
      correctionText = "Sodium changed by " + delta.toFixed(1) + " mmol/L over " + hours.toFixed(1) + " hours (" + rate.toFixed(2) + " mmol/L/h; linear 24-hour projection " + projected.toFixed(1) + " mmol/L).";
      var allowed = highODS ? 8 : 10;
      if((hours<=24 && delta>=allowed) || projected>allowed) overcorrect = true;
    }
    if(val("hypo_urine_output").indexOf("Increasing")>=0 || val("hypo_urine_output").indexOf("Marked")>=0) overcorrect = true;
    if(overcorrect){
      level = "red";
      safety = "RED — overcorrection or rapid-aquaresis risk";
      actions.push("Stop ongoing corrective drivers and obtain urgent expert review for a desmopressin/electrolyte-free-water strategy to halt or relower correction according to the local protocol.");
      monitoring.push("Measure sodium and urine output at short intervals until the trajectory is controlled.");
    } else if(highODS && level!=="red"){
      level = "amber";
      safety = "AMBER — high risk for osmotic demyelination/overcorrection";
    } else if(phenotype.indexOf("indeterminate")>=0 && level!=="red"){
      level = "amber";
      safety = "AMBER — diagnostic phenotype incomplete";
    }

    var completed=[], missing=[];
    function scoreItem(name,ok){if(ok)completed.push(name);else missing.push(name);}
    scoreItem("Symptoms and duration assessed", symptoms!=="Unable to assess" && !!val("hypo_duration"));
    scoreItem("Sodium/glucose documented", na!==null && glucose!==null);
    scoreItem("Tonicity assessed", osm!==null || val("hypo_pseudo")!=="Context unclear");
    scoreItem("Urine ADH physiology assessed", uosm!==null);
    scoreItem("Urine sodium/caveats assessed", una!==null && !!val("hypo_diuretic") && !!val("hypo_renal"));
    scoreItem("Adrenal/thyroid mimics reviewed", val("hypo_adrenal")!=="Unknown" && val("hypo_thyroid")!=="Unknown");
    scoreItem("ODS risk and correction plan assessed", checked("hypo_ods").length>0 && !!val("hypo_treatment"));
    scoreItem("Monitoring and ownership documented", val("hypo_monitoring")!=="Monitoring plan not documented" && !!val("hypo_owner"));
    var total=completed.length+missing.length,pct=total?completed.length/total:0;
    var careScore=completed.length+"/"+total;
    var careLabel=pct>=0.9?"Complete":(pct>=0.7?"Mostly complete":"Gaps remain");

    if(!actions.length) actions.push("No immediate emergency treatment trigger selected; complete the diagnostic and cause-specific plan.");
    if(!treatment.length) treatment.push("Do not choose definitive therapy until tonicity and the dominant physiology are clarified, unless dangerous symptoms require immediate hypertonic saline.");
    if(!monitoring.length) monitoring.push(val("hypo_monitoring") + ".");
    if(!cautions.length) cautions.push("Avoid rapid correction and reassess whenever urine output or the underlying cause changes.");

    var core =
      "Safety status: " + safety + "\n" +
      "Tonicity: " + tonicity + "\n" +
      "Working phenotype: " + phenotype + "\n" +
      "Measured sodium: " + (na===null?"not entered":na.toFixed(1)) + " mmol/L; estimated glucose-corrected sodium: " + (correctedNa===null?"not calculable":correctedNa.toFixed(1)) + " mmol/L.\n" +
      "Urine physiology: Uosm " + (uosm===null?"not entered":uosm) + " mOsm/kg; urine Na " + (una===null?"not entered":una) + " mmol/L.\n" +
      "Correction trajectory: " + correctionText + "\n\n" +
      "Immediate actions:\n" + atsBullets(actions) + "\n\n" +
      "Minimum evaluation:\n" + atsBullets(tests) + "\n\n" +
      "Treatment:\n" + atsBullets(treatment) + "\n\n" +
      "Correction/monitoring:\n" + atsBullets(monitoring) + "\n\n" +
      "Avoid/cautions:\n" + atsBullets(cautions) + "\n\n" +
      "Ownership: " + val("hypo_owner") + ".\n" +
      (val("hypo_plan_note")?"Additional plan: "+val("hypo_plan_note")+".\n":"") +
      "Care standard: " + careScore + " — " + careLabel + (missing.length?". Remaining gaps: "+missing.join(", ")+".":".");

    var formal =
      "Dear Colleague,\n\nThank you for asking me to assess hyponatremia. " +
      (val("hypo_summary")?"In brief: "+val("hypo_summary")+". ":"") +
      "The duration is " + val("hypo_duration") + " and symptoms are classified as: " + symptoms + ".\n\n" +
      core + "\n\nEvidence anchors: European Society of Endocrinology diagnostic/treatment guideline; Society for Endocrinology emergency guidance; Hyponatraemia Treatment Standard 2024; US/Irish correction-limit recommendations; Endocrine Society adrenal-insufficiency guidance.\n\nSincerely,\nGeneral Internal Medicine";
    var concise = "Hyponatremia Assessment\n\n" + core;
    var teaching =
      "Clinician teaching note\n\n" +
      "The safe sequence is: symptoms first, confirm tonicity, ask whether ADH is suppressed using urine osmolality, interpret urine sodium with diuretic/CKD/volume caveats, exclude adrenal disease, then treat the cause while controlling correction.\n\n" +
      core + "\n\nPatient explanation:\nA low sodium result can come from excess water, loss of salt and fluid, medicines, hormone problems, heart/liver/kidney disease, or high glucose. Treatment depends on the cause and how quickly the sodium changed. Repeated blood tests are important because sodium can rise quickly after treatment begins.";
    var finalText=formal;
    if(val("hypo_output_mode")==="Concise clinical note") finalText=concise;
    if(val("hypo_output_mode")==="Counseling / teaching note") finalText=teaching;
    var out=document.getElementById("hypo_out");
    out.className="output "+level;
    out.textContent=finalText;
    out.classList.remove("hidden");
  }
