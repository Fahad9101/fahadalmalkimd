<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fahad Almalki, MD</title>
<style>
:root{--ink:#0b2230;--muted:#5b6b78;--line:#d9e5ea;--bg:#f8fbfc;--teal:#0b5964;--teal2:#0d7888;--red:#b42318;--amber:#a15c07;--green:#067647;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:1240px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:850}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#073c47,#0b7888);display:grid;place-items:center;color:white;font-weight:900}
.navlinks{display:flex;gap:9px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:800;border:1px solid transparent;background:transparent;color:#203746;padding:9px 13px;border-radius:999px;cursor:pointer;text-decoration:none}
button:hover,.btn:hover{background:#edf6f8}
.contact{border-color:var(--line);background:#fff}
.hero{max-width:1240px;margin:auto;padding:0 18px 28px}
.heroPanel{min-height:180px;background:linear-gradient(130deg,#073642,#0a5662 70%,#0d7484);display:grid;place-items:center;text-align:center;color:white;padding:38px 18px;box-shadow:0 18px 45px rgba(6,45,55,.14)}
.heroLine{font-size:clamp(18px,2vw,26px);font-weight:850}
main{max-width:1240px;margin:auto;padding:28px 18px 70px}
h2{font-size:clamp(28px,3vw,40px);margin:0 0 12px}
h3{font-size:22px;margin:0 0 10px}
h4{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#086274;margin:22px 0 10px}
p{color:#425563}.lead{font-size:18px;max-width:900px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 16px 32px rgba(4,42,52,.06)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.unitrow{display:grid;grid-template-columns:1fr 120px;gap:8px}.section{margin:36px 0}
small,.eyebrow{display:block;color:#006778;text-transform:uppercase;font-weight:900;letter-spacing:.18em;font-size:12px;margin-bottom:10px}
.primary{background:var(--teal2)!important;color:white!important;border-color:var(--teal2)!important}
.toolList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.toolItem{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;cursor:pointer}
.toolItem:hover{box-shadow:0 16px 32px rgba(4,42,52,.08);border-color:#b8d4dc}
.toolItem b{display:block;font-size:18px;margin-bottom:6px}.toolItem span{display:block;color:var(--muted);font-size:14px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:white}
label{font-weight:800;font-size:14px;display:block;margin-bottom:6px}.field{margin-bottom:14px}
.hint{display:block;font-size:12px;color:#71808a;font-weight:500;margin-top:3px}
.checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.check{display:flex;gap:9px;align-items:flex-start;font-weight:650;color:#213746}.check input{width:auto;margin-top:5px}
.output{border-left:5px solid var(--teal2);background:#f2fbfd;padding:18px;border-radius:14px;margin-top:18px;white-space:pre-wrap}
.output.red{border-color:var(--red);background:#fff5f5}.output.amber{border-color:var(--amber);background:#fff8ed}.output.green{border-color:var(--green);background:#f0fff8}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.breadcrumb{font-size:14px;color:var(--muted);margin-bottom:18px}.lock{max-width:520px;margin:38px auto}
.subtlebox{background:#f6fafb;border:1px dashed var(--line);border-radius:14px;padding:14px;margin-top:10px}.hidden{display:none!important}footer{border-top:1px solid var(--line);padding:28px 18px;text-align:center;color:#657786}
@media(max-width:850px){.grid,.grid2,.toolList,.checkgrid{grid-template-columns:1fr}.heroPanel{min-height:140px}}

.followedbox{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff}
.followedbox label{font-weight:800;color:#042f3b;margin-bottom:8px;display:block}
.followedbox .hint{font-weight:500;color:#5f7480}
.followedchecks{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
.followedchecks .check{display:flex;align-items:flex-start;gap:10px;font-weight:700;color:#0b2f3a}
.followedchecks input{margin-top:3px}

</style>
</head>
<body>

  <div class="nav">
    <div class="brand"><div class="logo">FA</div><span>Fahad Almalki, MD</span></div>

</div>

<main id="app"></main>
<footer>Fahad Almalki, MD · General Internal Medicine · Vascular Medicine</footer>

<script>
(function(){
  var USERNAME = "fahad";
  var PASSWORD = "ChangeThisPassword2026!";
  var authed = sessionStorage.getItem("fa_auth") === "yes";

  var tools = [
    {id:"pad-suspected",cat:"Vascular Medicine Clinic",title:"Suspected PAD Clinic Pathway",desc:"Deep guided vascular clinic pathway: symptoms, pulse exam, limb exam, ABI/TBI logic, diabetes, smoking, Lp(a), mimics, GDMT, referral urgency."},
    {id:"pad-confirmed",cat:"Vascular Medicine Clinic",title:"Confirmed PAD Clinic Pathway",desc:"Phenotype, GDMT, exercise, foot care, antithrombotic decisions, and revascularization triggers."},
    {id:"thrombosis-clinic",cat:"Vascular Medicine Clinic",title:"Thrombosis Clinic Pathway",desc:"New/chronic VTE, arterial thrombosis, duration, anticoagulant safety, APS/MPN/PNH/Lp(a), CTEPH and PTS prompts."},
    {id:"unusual",cat:"Vascular Medicine Clinic",title:"Unusual-Site Thrombosis Workup Tool",desc:"Splanchnic, CVST, renal vein, upper-extremity, young arterial thrombosis; OCP, Lp(a), JAK2/MPN, PNH, APS, cancer, anatomy."},
    {id:"af",cat:"Thrombosis / Antithrombotic Safety",title:"AF Anticoagulation Decision Aid",desc:"CHA2DS2-VASc, bleeding-risk frame, 1/5/10-year risk, DOAC vs warfarin danger zones, and shared decision note."},
    {id:"antithrombotic",cat:"Thrombosis / Antithrombotic Safety",title:"Antithrombotic Safety Assistant",desc:"Thrombosis on anticoagulation, HIT/PF4/VITT, anti-Xa pitfalls, AT deficiency, APS, DOAC danger zones, and vascular red flags."},
    {id:"postop-troponin",cat:"GIM Diagnostic Reasoning",title:"Post-op Troponin Pathway",desc:"Guided MINS pathway: screening, elevated troponin interpretation, RCRI, BNP/NT-proBNP, ECG, symptoms, competing triggers, and follow-up."},
    {id:"diarrhea",cat:"GIM Diagnostic Reasoning",title:"Diarrhea Diagnostic Pathway",desc:"Danger-first diarrhea approach: watery vs inflammatory vs fatty, osmotic vs secretory, medications, bile acid, pancreatic, microscopic colitis."},
    {id:"hyponatremia",cat:"GIM Diagnostic Reasoning",title:"Hyponatremia Diagnostic Engine",desc:"Tonicity-first pathway, ADH-on/off reasoning, urine osm/sodium, SIADH mimics, ODS risk, and correction guardrails."},
    {id:"hypokalemia",cat:"GIM Diagnostic Reasoning",title:"Hypokalemia + Acid–Base Engine",desc:"GI vs renal potassium loss, metabolic acidosis/alkalosis, urine potassium/chloride, RTA, diuretics, mineralocorticoid clues."},
    {id:"cirrhosis-coag",cat:"GIM Diagnostic Reasoning",title:"Coagulation in Cirrhosis",desc:"Rebalanced hemostasis, procedure risk, INR pitfalls, fibrinogen/platelets, TEG/ROTEM, vitamin K, and thrombosis despite high INR."},
    {id:"ctu-daily",cat:"CTU / Rounding Standard",title:"CTU Daily Review Checklist",desc:"Diagnostic clarity, danger overnight, VTE prophylaxis, meds, mobility, pending tests, discharge barriers, and communication."}
  ];

  function app(){ return document.getElementById("app"); }
  function showHero(x){ document.getElementById("hero").style.display = x ? "block" : "none"; }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]; }); }
  function val(id){ var el=document.getElementById(id); return el ? el.value.trim() : ""; }
  function checked(name){ return Array.prototype.slice.call(document.querySelectorAll('input[name="'+name+'"]:checked')).map(function(x){return x.value;}); }
  function checks(name, arr){
    return '<div class="checkgrid">' + arr.map(function(x){
      return '<label class="check"><input type="checkbox" name="'+name+'" value="'+esc(x)+'"><span>'+esc(x)+'</span></label>';
    }).join("") + '</div>';
  }
  function setHash(page,param){ location.hash = param ? page + ":" + param : page; render(); }
  window.setHash = setHash;

  document.addEventListener("click", function(e){
    var p = e.target.closest("[data-page]");
    if(p){ setHash(p.getAttribute("data-page")); }
    var t = e.target.closest("[data-tool]");
    if(t){ setHash("tool", t.getAttribute("data-tool")); }
  });
  window.addEventListener("hashchange", render);

  function render(){
    var raw = location.hash.replace("#","") || "home";
    var parts = raw.split(":");
    var page = parts[0], param = parts[1];
    if(page === "home") return renderHome();
    if(page === "contact") return renderContact();
    if(page === "crft") return renderCrft();
    if(page === "pathways") return authed ? renderPathways() : renderLogin("pathways");
    if(page === "tool") return authed ? renderTool(param) : renderLogin("tool:" + param);
    renderHome();
  }

  function renderHome(){
    showHero(true);
    app().innerHTML = '<section><h2>Clinical pathway system</h2><p class="lead">A structured bedside library designed to standardize safe clinical reasoning, vascular medicine assessment, antithrombotic decisions, and General Internal Medicine diagnostic pathways.</p><div class="grid section"><div class="card"><small>Protected library</small><h3>Clinical Pathways</h3><p>Guided bedside workflows: danger first, phenotype, minimum standard assessment, action plan, and copy-ready notes.</p><button class="primary" data-page="pathways">Open pathways</button></div><div class="card"><small>Education</small><h3>CRFT</h3><p>Clinical reasoning education focused on problem framing, hypothesis generation, data interpretation, management planning, anticipation, and metacognition.</p><button data-page="crft">View CRFT</button></div><div class="card"><small>Contact</small><h3>Professional inquiries</h3><p>For academic, educational, clinical pathway, and quality-improvement communication.</p><button data-page="contact">Contact</button></div></div></section>';
  }

  function renderContact(){
    showHero(false);
    app().innerHTML = '<div class="breadcrumb"><button data-page="home">← Home</button></div><section class="card"><small>Contact</small><h2>Professional inquiries</h2><p><b><a href="mailto:contact@fahadalmalkimd.com">contact@fahadalmalkimd.com</a></b></p><p>Direct professional correspondence: <b><a href="mailto:fahad@fahadalmalkimd.com">fahad@fahadalmalkimd.com</a></b></p></section>';
  }

  function renderCrft(){
    showHero(false);
    app().innerHTML = '<div class="breadcrumb"><button data-page="home">← Home</button></div><section class="card"><small>Clinical reasoning education</small><h2>CRFT</h2><p>Structured framework to make reasoning observable, teachable, and improvable across repeated cases.</p><div class="grid2"><div><h4>Core domains</h4><ul><li>Problem framing</li><li>Hypothesis generation</li><li>Data interpretation</li><li>Management planning</li><li>Anticipation</li><li>Metacognition</li></ul></div><div><h4>Purpose</h4><p>Move bedside teaching from informal impression to explicit reasoning behaviors that can be coached, scored, and improved.</p></div></div></section>';
  }

  function renderLogin(target){
    showHero(false);
    app().innerHTML = '<section class="lock card"><small>Protected library</small><h2>Clinical Pathways Login</h2><div class="field"><label>Username</label><input id="u"></div><div class="field"><label>Password</label><input id="p" type="password"></div><button class="primary" id="loginBtn">Enter</button><p class="hint">Soft access gate only. Real privacy later needs Cloudflare Access or similar.</p></section>';
    document.getElementById("loginBtn").addEventListener("click", function(){
      if(val("u") === USERNAME && val("p") === PASSWORD){
        sessionStorage.setItem("fa_auth","yes");
        authed = true;
        var parts = target.split(":");
        setHash(parts[0], parts[1]);
      } else {
        alert("Incorrect username or password");
      }
    });
  }

  function renderPathways(){
    showHero(false);
    var cats = [];
    tools.forEach(function(t){ if(cats.indexOf(t.cat) < 0) cats.push(t.cat); });
    var html = '<div class="breadcrumb"><button data-page="home">← Home</button></div><section><h2>Clinical Pathway Library</h2><p class="lead">Choose a pathway. Each tool starts with safety, classifies the phenotype, defines minimum assessment, and produces a copy-ready note.</p>';
    cats.forEach(function(cat){
      html += '<div class="section"><h4>'+esc(cat)+'</h4><div class="toolList">';
      tools.filter(function(t){return t.cat===cat;}).forEach(function(t){
        html += '<button class="toolItem" data-tool="'+t.id+'"><b>'+esc(t.title)+'</b><span>'+esc(t.desc)+'</span></button>';
      });
      html += '</div></div>';
    });
    html += '</section>';
    app().innerHTML = html;
  }

  function shell(title, subtitle, body){
    showHero(false);
    app().innerHTML = '<div class="breadcrumb"><button data-page="pathways">← Back to Pathways</button> <button data-page="home">Home</button></div><section><small class="eyebrow">Guided pathway</small><h2>'+esc(title)+'</h2><p class="lead">'+esc(subtitle)+'</p></section>' + body;
  }

  function renderTool(id){
    var t = tools.find(function(x){return x.id===id;});
    if(!t) return renderPathways();
    if(id === "pad-suspected") return renderPAD();
    if(id === "pad-confirmed") return renderConfirmedPAD();
    return shell(t.title, t.desc, '<section class="card"><h3>Guided pathway scaffold</h3><ol><li>Choose clinical scenario</li><li>Danger-first screen</li><li>Classify phenotype</li><li>Minimum standard assessment</li><li>Action plan</li><li>Teaching pearl</li><li>Copy-ready note</li></ol><p class="hint">This pathway is visible and ready for deeper expansion while keeping the site stable.</p></section>');
  }

  function selectField(id,label,options,hint){
    return '<div class="field"><label>'+esc(label)+'</label><select id="'+id+'">'+options.map(function(x){return '<option>'+esc(x)+'</option>';}).join("")+'</select>'+(hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</div>';
  }
  function inputField(id,label,placeholder){
    return '<div class="field"><label>'+esc(label)+'</label><input id="'+id+'" placeholder="'+esc(placeholder||"")+'"></div>';
  }

  function renderPAD(){
    var pulseNames = ["Right femoral","Left femoral","Right popliteal","Left popliteal","Right dorsalis pedis","Left dorsalis pedis","Right posterior tibial","Left posterior tibial"];
    var pulseHtml = pulseNames.map(function(x,i){return selectField("pulse_"+i,x,["Not assessed","Present","Weak","Absent","Doppler only"],"");}).join("");
    shell("Suspected PAD Clinic Pathway","Deep clinic-grade PAD assessment: referral reason, limb-danger triage, structured pulse and limb exam, ABI/TBI logic, diabetes, smoking, Lp(a), mimics, GDMT, urgency, and copy-ready note.",
    '<section class="card">'+
    '<h4>Why is the patient here? <span class="hint">Select all that apply.</span></h4>'+
    checks("pad_reason",["Exertional calf pain","Exertional thigh/buttock pain","Reduced walking distance","Atypical leg pain","Rest pain / nocturnal foot pain","Foot ulcer or non-healing wound","Gangrene / tissue loss","Abnormal or absent pulses","Abnormal ABI/TBI or vascular lab","Diabetic foot risk / poor healing","Pre-op vascular assessment","Cardiovascular risk optimization","Unclear diagnosis / second opinion"])+
    '<div class="grid2">'+
    selectField("pad_pattern","Main symptom phenotype",["Classic claudication: reproducible exertional muscle pain relieved by rest","Atypical exertional leg symptoms","Rest pain: forefoot pain worse lying flat, improved by dependency","Wound/tissue loss phenotype","Sudden severe limb symptoms","Neuropathic/burning symptoms","Back/radicular or joint-type pain","Asymptomatic abnormal test/pulses"],"First split: claudication vs limb threat vs mimic.")+
    selectField("pad_sev","Functional severity",["Asymptomatic","Mild symptoms, not limiting","Lifestyle-limiting exertional symptoms","Limits work/exercise/basic activities","Rest pain or tissue loss","Unclear"],"")+
    inputField("pad_pfd","Pain-free walking distance","e.g. 100 meters, 1 block, unknown")+
    inputField("pad_mwd","Maximum walking distance","e.g. 300 meters, unknown")+
    selectField("pad_rest","Relieved by rest within ~10 minutes?",["Unknown","Yes","No"],"")+
    selectField("pad_incline","Worse with stairs/incline?",["Unknown","Yes","No"],"")+
    '</div>'+
    '<h4>Danger-first limb screen</h4>'+
    checks("pad_red",["Acute limb ischemia clue: sudden pain, pallor, pulselessness, paresthesia, paralysis, poikilothermia","New motor or sensory deficit","Rest pain, especially forefoot pain worse at night/lying flat","Non-healing wound, ulcer, gangrene, or tissue loss","Infected ischemic foot: spreading cellulitis, purulence, wet gangrene, systemic signs","New blue/purple toe or embolic-appearing lesion","Rapidly worsening symptoms","Absent Doppler signals if checked"])+
    '<h4>Pulse exam by side</h4><div class="grid2">'+pulseHtml+'</div>'+
    '<h4>Limb and foot exam</h4><div class="grid2">'+
    selectField("pad_temp","Temperature",["Not assessed","Warm bilaterally","Cool unilateral","Cool bilateral","Cold limb"],"")+
    selectField("pad_color","Color",["Not assessed","Normal","Pale","Dependent rubor","Cyanotic/blue","Mottled"],"")+
    selectField("pad_cap","Capillary refill",["Not assessed","Normal","Delayed","Absent/very poor"],"")+
    selectField("pad_hair","Hair loss",["Not assessed","No significant hair loss","Mild hair loss","Marked hair loss"],"")+
    selectField("pad_skin","Skin/nails",["Not assessed","Normal","Shiny/atrophic skin","Dry/cracked skin","Thickened/dystrophic nails"],"")+
    selectField("pad_edema","Edema",["Not assessed","None","Unilateral","Bilateral"],"")+
    selectField("pad_wound","Wound location",["No wound","Toe","Forefoot","Heel","Ankle/leg","Multiple"],"")+
    selectField("pad_inf","Wound infection",["No infection signs","Cellulitis","Purulence","Wet gangrene","Systemic signs","Not applicable"],"")+
    selectField("pad_neuro","Neuropathy/sensory loss",["Unknown","No","Yes"],"")+
    selectField("pad_motor","Motor deficit",["No","Yes","Not assessed"],"")+
    '</div>'+
    '<h4>ABI / TBI / vascular testing</h4><div class="grid2">'+
    inputField("pad_rabi","Right ABI","e.g. 0.72")+
    inputField("pad_labi","Left ABI","e.g. 1.22")+
    inputField("pad_rtbi","Right TBI","optional")+
    inputField("pad_ltbi","Left TBI","optional")+
    selectField("pad_wave","Waveforms",["Unknown/not done","Triphasic","Biphasic","Monophasic","Absent","Mixed/asymmetric"],"")+
    selectField("pad_exabi","Exercise ABI",["Not done","Normal","Abnormal post-exercise drop"],"")+
    selectField("pad_img","Duplex/CTA/MRA",["Not done","Duplex done","CTA/MRA done","Planned/pending"],"")+
    selectField("pad_calc","Calcified/noncompressible vessels suspected?",["Unknown","No","Yes: diabetes/CKD/noncompressible ABI"],"ABI can be misleading in diabetes/CKD.")+
    '</div>'+
    '<h4>Risk factors and optimization</h4><div class="grid2">'+
    selectField("pad_dm","Diabetes status",["No diabetes","Diabetes controlled","Diabetes uncontrolled","Diabetes control unknown"],"")+
    inputField("pad_a1c","HbA1c if available","e.g. 8.7%, unknown")+
    selectField("pad_smoke","Smoking status",["Never smoker","Active smoker","Recent quitter","Prior smoker","Unknown"],"Active smoking changes urgency of counseling.")+
    inputField("pad_pack","Pack-years / shisha / vaping note","optional")+
    '<div class="field"><label>LDL-C</label><div class="unitrow"><input id="pad_ldl" type="number" step="0.01" placeholder="number only"><select id="pad_ldl_unit"><option>mmol/L</option><option>mg/dL</option></select></div></div>'+
    '<div class="field"><label>Non-HDL-C</label><div class="unitrow"><input id="pad_nonhdl" type="number" step="0.01" placeholder="number only"><select id="pad_nonhdl_unit"><option>mmol/L</option><option>mg/dL</option></select></div><span class="hint">Enter the value only, then choose mmol/L or mg/dL from the dropdown. Useful when TG are elevated or LDL alone underestimates atherogenic burden.</span></div>'+
    '<div class="field"><label>Lp(a) if available</label><div class="unitrow"><input id="pad_lpa" type="number" step="0.01" placeholder="number only"><select id="pad_lpa_unit"><option>nmol/L</option><option>mg/dL</option></select></div><span class="hint">Enter the value only, then choose nmol/L or mg/dL. Lp(a) units are not reliably interchangeable by a fixed conversion; document the lab unit.</span></div>'+
    inputField("pad_egfr","eGFR / CKD","e.g. eGFR 45, CKD3")+
    inputField("pad_bp","BP / hypertension control","e.g. 145/82, controlled/unknown")+
    selectField("pad_statin","Current lipid therapy",["None/unknown","Moderate-intensity statin","High-intensity statin","Statin intolerant"],"")+
    selectField("pad_antith","Current antithrombotic",["None/unknown","Aspirin","Clopidogrel","DAPT","Therapeutic anticoagulation","Vascular-dose rivaroxaban + aspirin"],"")+
    selectField("pad_exercise","Exercise therapy tried?",["No/unknown","Advised only","Structured/supervised program","Unable due to limitation"],"")+
    selectField("pad_hf","Heart failure? Important if considering cilostazol.",["No/unknown","Yes"],"")+
    '</div>'+
    '<h4>Mimics and mixed diagnoses</h4>'+
    checks("pad_mimic",["Spinal stenosis: better leaning forward/sitting, worse standing","Radiculopathy: back pain, dermatomal radiation, neurologic signs","Hip/knee osteoarthritis: joint-localized mechanical pain","Venous claudication/severe venous disease: swelling, bursting pain","Peripheral neuropathy: burning, stocking distribution, not exertional","Chronic exertional compartment syndrome: younger patient, tightness with exercise","Anemia/HF/lung disease/deconditioning: global exercise intolerance"])+
    '<div class="toolbar"><button class="primary" id="padGenerate">Generate detailed PAD pathway</button><button id="padCopy">Copy note</button></div><div id="pad_out" class="output hidden"></div>'+
    '</section>');
    document.getElementById("padGenerate").addEventListener("click", calcPAD);
    document.getElementById("padCopy").addEventListener("click", function(){ copyOut("pad_out"); });
  }

  function abiInterpret(raw){
    if(!raw) return "not entered";
    var n = Number(raw);
    if(isNaN(n)) return "not interpretable";
    if(n <= 0.90) return n.toFixed(2) + " abnormal, supports PAD";
    if(n <= 0.99) return n.toFixed(2) + " borderline";
    if(n <= 1.40) return n.toFixed(2) + " normal range, but exercise ABI may be needed if symptoms persist";
    return n.toFixed(2) + " noncompressible; use TBI/toe pressure/waveforms";
  }

  function calcPAD(){
    var reasons = checked("pad_reason");
    var red = checked("pad_red");
    var mimic = checked("pad_mimic");
    var pattern = val("pad_pattern");
    var sev = val("pad_sev");

    var pulseNames = ["Right femoral","Left femoral","Right popliteal","Left popliteal","Right dorsalis pedis","Left dorsalis pedis","Right posterior tibial","Left posterior tibial"];
    var pulses = pulseNames.map(function(name,i){ return name + ": " + val("pulse_"+i); });

    var rabiText = abiInterpret(val("pad_rabi"));
    var labiText = abiInterpret(val("pad_labi"));
    var wave = val("pad_wave");
    var exabi = val("pad_exabi");
    var calc = val("pad_calc");

    var examSummary = [
      "Temperature: " + val("pad_temp"),
      "Color: " + val("pad_color"),
      "Cap refill: " + val("pad_cap"),
      "Hair loss: " + val("pad_hair"),
      "Skin/nails: " + val("pad_skin"),
      "Edema: " + val("pad_edema"),
      "Wound: " + val("pad_wound"),
      "Infection: " + val("pad_inf"),

    var phenotype = "PAD not yet confirmed.";

    else if(clti) phenotype = "Possible chronic limb-threatening ischemia.";
    else if(classic && abnormalAbi) phenotype = "Likely symptomatic PAD with claudication.";

    if(val("pad_hf")==="Yes") gdmt.push("avoid cilostazol if heart failure");

    var referral = "Routine vascular medicine / vascular lab pathway.";
    if(acute) referral = "Same-day ED/vascular surgery assessment for possible acute limb ischemia; do not delay for outpatient ABI.";
    else if(infection) referral = "Same-day/urgent infected ischemic foot pathway with vascular surgery/wound/ID/ED depending severity.";
    else if(clti) referral = "Urgent vascular surgery / wound pathway for possible CLTI.";
    else if(sev.indexOf("Lifestyle")>=0 || sev.indexOf("Limits")>=0) referral = "Vascular referral if symptoms remain lifestyle-limiting despite GDMT/exercise or anatomy assessment is needed.";


    var management = [];

    } else if(antithChoice.indexOf("COMPASS")>=0){
      antithPlan.push("COMPASS regimen selected: rivaroxaban 2.5 mg BID + aspirin for stable symptomatic PAD/polyvascular risk when bleeding risk is acceptable.");

    } else if(antithChoice.indexOf("VOYAGER")>=0){
      antithPlan.push("VOYAGER-PAD regimen selected: rivaroxaban 2.5 mg BID + aspirin after lower-extremity revascularization when bleeding risk is acceptable.");
      antithPlan.push("VOYAGER one-liner: after revascularization, reduced acute limb ischemia, major amputation, MI, stroke, or cardiovascular death; bleeding risk increases and must be individualized.");
    } else if(antithChoice.indexOf("Single antiplatelet")>=0){

    var dmPlan = [];
    dmPlan.push(val("cpad_m_dm") + ". " + (val("cpad_dm_plan") || "No DM details entered."));
    if(val("cpad_m_dm").indexOf("Uncontrolled")>=0 || val("cpad_dm")==="Diabetes uncontrolled") dmPlan.push("Uncontrolled diabetes increases foot-risk and wound-risk; coordinate glycemic control and foot protection.");

    var lipidPlan = [];

    var text =

"Limb/foot exam:\n" + examSummary.map(function(x){return "- "+x;}).join("\n") + "\n\n" +
"Vascular testing interpretation:\n" +
"- Right ABI: " + rabiText + "\n" +
"- Left ABI: " + labiText + "\n" +
"- Right TBI: " + (val("pad_rtbi") || "not entered") + "\n" +
"- Left TBI: " + (val("pad_ltbi") || "not entered") + "\n" +
"- Waveforms: " + wave + "\n" +
"- Exercise ABI: " + exabi + "\n" +
"- Calcified/noncompressible suspicion: " + calc + "\n\n" +
"Testing plan:\n" + testing.map(function(x){return "- "+x;}).join("\n") + "\n\n" +
"Risk-factor optimization:\n" +
"- Diabetes: " + val("pad_dm") + " ; HbA1c: " + (val("pad_a1c") || "not entered") + "\n" +
"- Smoking: " + val("pad_smoke") + " ; pack-year/shisha/vaping note: " + (val("pad_pack") || "not entered") + "\n" +
"- LDL-C: " + (val("pad_ldl") ? val("pad_ldl") + " " + val("pad_ldl_unit") : "not entered") + "\n" +
"- Non-HDL-C: " + (val("pad_nonhdl") ? val("pad_nonhdl") + " " + val("pad_nonhdl_unit") : "not entered") + "\n" +
"- Lp(a): " + (val("pad_lpa") ? val("pad_lpa") + " " + val("pad_lpa_unit") : "not entered") + "\n" +

(gdmt.length ? gdmt.map(function(x){return "- "+x;}).join("\n") : "- Review statin, antiplatelet indication, smoking, BP/diabetes, exercise therapy, and foot care.") + "\n\n" +
"Mimics / mixed diagnoses:\n" + (mimic.length ? mimic.map(function(x){return "- "+x;}).join("\n") : "- No mimic clues selected.") + "\n\n" +

"1. Document pulses by side and foot exam.\n" +

"3. Separate claudication from CLTI and acute limb ischemia.\n" +
"4. Address smoking, diabetes, LDL/statin, BP, antithrombotic indication, exercise, and foot care.\n" +
"5. Document referral urgency.\n\n" +
"Teaching pearl:\n" +
"PAD clinic reasoning starts with the limb phenotype. Sudden neurologic/cold limb is acute limb ischemia. Rest pain or tissue loss is CLTI. Exertional reproducible muscle pain is claudication. ABI supports the diagnosis, but diabetes/CKD can make ABI falsely reassuring or noncompressible.\n\n" +
"Copy-ready note:\n" +
"Suspected PAD pathway reviewed. Reasons: " + (reasons.length ? reasons.join(", ") : "not specified") + ". Symptoms: " + pattern + "; severity: " + sev + ". PFD " + (val("pad_pfd") || "not entered") + ", MWD " + (val("pad_mwd") || "not entered") + ". Limb danger features: " + (red.length ? red.join(", ") : "none selected") + ". Pulses: " + pulses.join("; ") + ". Limb exam: " + examSummary.join("; ") + ". ABI/TBI: R ABI " + (val("pad_rabi") || "NA") + ", L ABI " + (val("pad_labi") || "NA") + ", R TBI " + (val("pad_rtbi") || "NA") + ", L TBI " + (val("pad_ltbi") || "NA") + ", waveforms " + wave + ". Risk factors: DM " + val("pad_dm") + ", smoking " + val("pad_smoke") + ", LDL " + (val("pad_ldl") || "NA") + ", Lp(a) " + (val("pad_lpa") || "NA") + ", eGFR " + (val("pad_egfr") || "NA") + ". Plan: " + testing.join(" ") + " GDMT: " + (gdmt.length ? gdmt.join(", ") : "review statin/antiplatelet/smoking/diabetes/BP/exercise/foot care") + ". Referral: " + referral;

    var out = document.getElementById("pad_out");
    out.className = "output " + level;
    out.textContent = text;
    out.classList.remove("hidden");
  }

  function copyOut(id){

    '</div>'+

    '<div class="toolbar"><button class="primary" id="cpadGenerate">Generate confirmed PAD pathway</button><button id="cpadCopy">Copy output</button><button id="cpadReset">Reset pathway</button></div><div id="cpad_out" class="output hidden"></div>'+
    '</section>');
    document.getElementById("cpadGenerate").addEventListener("click", calcConfirmedPAD);
    document.getElementById("cpadCopy").addEventListener("click", function(){ copyOut("cpad_out"); });
    document.getElementById("cpadReset").addEventListener("click", resetConfirmedPAD);
  }

  function yesAddress(v, bad){
    if(!v) return false;
    if(bad && v.indexOf(bad)>=0) return false;
    if(v.indexOf("Not yet addressed")>=0) return false;
    if(v.indexOf("Unknown")>=0) return false;
    return true;
  }

  function cpadList(name){
    return checked(name);
  }


  function resetConfirmedPAD(){
    var out = document.getElementById("cpad_out");
    var card = out ? out.closest("section.card") : document;
    if(!card) card = document;
    card.querySelectorAll("input").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio") el.checked = false;
      else el.value = "";
    });
    card.querySelectorAll("select").forEach(function(el){
      el.selectedIndex = 0;
    });
    if(out){
      out.textContent = "";
      out.className = "output hidden";
    }
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function calcConfirmedPAD(){
    var visit = val("cpad_visit");
    var followedArr = checked("cpad_followed");
    var followed = followedArr.length ? followedArr.join("; ") : "not specified";
    var pheno = checked("cpad_pheno");
    var limb = checked("cpad_limb");
    var card = cpadList("cpad_card");
    var hf = cpadList("cpad_hf");
    var neuro = cpadList("cpad_neuro");
    var aorta = cpadList("cpad_aorta");
    var quickPoly = cpadList("cpad_poly_quick");
    var bleed = cpadList("cpad_bleed_short");
    var whyNoRevasc = cpadList("cpad_why_no_revasc");
    var whyNoExercise = cpadList("cpad_why_no_exercise");
    var outputMode = val("cpad_output_mode");

    var acute = limb.some(function(x){return x.indexOf("Acute limb ischemia")>=0 || x.indexOf("motor")>=0;});
    var infected = limb.some(function(x){return x.indexOf("Infection")>=0;}) || val("cpad_clti_module").indexOf("Infected")>=0;
    var clti = pheno.some(function(x){return x.indexOf("Rest pain")>=0 || x.indexOf("Wound")>=0 || x.indexOf("Infected")>=0;}) ||
               limb.some(function(x){return x.indexOf("rest pain")>=0 || x.indexOf("wound")>=0 || x.indexOf("Gangrene")>=0;}) ||
               val("cpad_clti_module").indexOf("Not applicable")<0;
    var lifestyleLimiting = pheno.some(function(x){return x.indexOf("Lifestyle-limiting")>=0;}) ||
                    val("cpad_rutherford").indexOf("3")===0 ||
                    val("cpad_exercise").indexOf("Inadequate")>=0;
    var post = pheno.some(function(x){return x.indexOf("Post-revascularization")>=0 || x.indexOf("Recurrent symptoms")>=0;}) ||
               val("cpad_post_module").indexOf("Not applicable")<0 || visit.indexOf("Post-revascularization")>=0;

    var cardiacUrgent = card.some(function(x){return x.indexOf("rest")>=0 || x.indexOf("unstable")>=0;});
    var cardiacReview = card.some(function(x){return x.indexOf("Exertional")>=0 || x.indexOf("dyspnea")>=0 || x.indexOf("Reduced")>=0 || x.indexOf("Known CAD")>=0 || x.indexOf("review")>=0;});
    var hfFlag = hf.some(function(x){return x.indexOf("Known heart failure")>=0 || x.indexOf("reduced EF")>=0 || x.indexOf("HF present")>=0;});
    var neuroUrgent = neuro.some(function(x){return x.indexOf("Transient weakness")>=0 || x.indexOf("Speech")>=0 || x.indexOf("monocular")>=0 || x.indexOf("Facial")>=0;});
    var neuroPoly = neuro.some(function(x){return x.indexOf("Prior")>=0 || x.indexOf("carotid")>=0 || x.indexOf("Carotid")>=0;});
    var aorticUrgent = aorta.some(function(x){return x.indexOf("New severe")>=0 || x.indexOf("Pulsatile")>=0;});
    var aaa = aorta.some(function(x){return x.indexOf("AAA")>=0 || x.indexOf("aortic repair")>=0 || x.indexOf("aortic")>=0;});
    var mesenteric = aorta.some(function(x){return x.indexOf("Post-prandial")>=0 || x.indexOf("mesenteric")>=0;});
    var renalVascular = aorta.some(function(x){return x.indexOf("Resistant")>=0 || x.indexOf("worsening BP")>=0 || x.indexOf("kidney")>=0 || x.indexOf("flash")>=0 || x.indexOf("renal artery")>=0;});
    var highBleed = bleed.some(function(x){return x.indexOf("No major")<0;});

    var phenotype = "Stable confirmed PAD.";
    if(acute) phenotype = "Possible acute limb ischemia — emergency phenotype.";
    else if(infected) phenotype = "Infected ischemic foot concern.";
    else if(clti) phenotype = "CLTI/rest pain/wound-risk phenotype.";
    else if(lifestyleLimiting) phenotype = "Lifestyle-limiting claudication phenotype.";
    else if(post) phenotype = "Post-revascularization follow-up phenotype.";
    else if(pheno.some(function(x){return x.indexOf("Asymptomatic")>=0;})) phenotype = "Asymptomatic confirmed PAD / systemic ASCVD-risk phenotype.";

    var urgentTriggers = [];
    if(acute) urgentTriggers.push("possible acute limb ischemia");
    if(infected) urgentTriggers.push("infected ischemic foot");
    if(cardiacUrgent) urgentTriggers.push("chest pain at rest/unstable cardiac symptoms");
    if(neuroUrgent) urgentTriggers.push("possible TIA/stroke symptoms");
    if(aorticUrgent) urgentTriggers.push("possible urgent aortic symptom");

    var escalation = "Routine PAD follow-up.";
    if(acute) escalation = "Same-day ED/vascular surgery assessment. Do not delay for outpatient testing.";
    else if(infected) escalation = "Same-day or urgent infected ischemic foot pathway with vascular/wound/ID/ED coordination depending severity.";
    else if(clti) escalation = "Urgent vascular surgery/wound pathway; assess wound, infection, perfusion, offloading, and revascularization feasibility.";
    else if(lifestyleLimiting && val("cpad_exercise").indexOf("Inadequate")>=0) escalation = "Consider anatomic imaging and revascularization assessment because symptoms remain lifestyle-limiting despite GDMT/exercise.";
    else if(lifestyleLimiting) escalation = "Optimize GDMT and structured/supervised exercise; reassess response before revascularization unless anatomy/clinical context requires earlier review.";
    else if(post && (val("cpad_post_module").indexOf("Recurrent")>=0 || val("cpad_post_module").indexOf("Abnormal")>=0 || val("cpad_post_module").indexOf("not healing")>=0)) escalation = "Vascular lab/surgeon review for restenosis, graft failure, or progression concern.";
    else if(post) escalation = "Continue post-revascularization surveillance per vascular lab/surgeon protocol.";

    if(followed.indexOf("following")>=0){
      escalation += " Since patient is already followed by " + followed + ", coordinate/confirm follow-up rather than duplicating referral.";
    }

    var poly = [];
    if(quickPoly.length){
      poly.push("Quick negative screen selected: no active cardiac/neuro/aortic/mesenteric/renovascular symptoms today.");
    } else {
      if(cardiacUrgent) poly.push("Cardiac: chest pain at rest/unstable pattern selected — urgent cardiac assessment, not routine PAD-only follow-up.");
      else if(cardiacReview) poly.push("Cardiac: exertional chest pain/dyspnea/CAD signal — consider CAD review before intensifying walking therapy if symptoms are concerning.");
      else poly.push("Cardiac: no major cardiac symptom signal selected.");
      if(hfFlag) poly.push("HF/cardiopulmonary: HF/reduced EF selected — avoid/caution cilostazol and distinguish dyspnea from claudication limitation.");
      else if(hf.some(function(x){return x.indexOf("Shortness")>=0 || x.indexOf("Orthopnea")>=0 || x.indexOf("Edema")>=0 || x.indexOf("Syncope")>=0 || x.indexOf("Palpitations")>=0;})) poly.push("HF/cardiopulmonary: symptoms selected — evaluate cardiopulmonary limitation before attributing all walking limitation to PAD.");
      else poly.push("HF/cardiopulmonary: no major HF/cardiopulmonary signal selected.");
      if(neuroUrgent) poly.push("Neuro/carotid: possible TIA/stroke symptom selected — urgent stroke/TIA pathway if new/recent.");
      else if(neuroPoly) poly.push("Neuro/carotid: prior stroke/TIA or carotid disease selected — polyvascular disease; intensify ASCVD-risk management.");
      else poly.push("Neuro/carotid: no major neuro/carotid signal selected.");
      if(aorticUrgent) poly.push("Aortic: pulsatile mass or new severe abdominal/back/flank pain selected — urgent aortic evaluation if clinically compatible.");
      else if(aaa) poly.push("Aortic: AAA/aortic history or screening concern selected — ensure surveillance/screening is not missed.");
      else poly.push("Aortic: no major aortic signal selected.");
      if(mesenteric) poly.push("Mesenteric: post-prandial pain/food fear/weight loss or known mesenteric stenosis — consider chronic mesenteric ischemia evaluation.");
      if(renalVascular) poly.push("Renovascular: resistant HTN, renal decline, flash pulmonary edema, or known renal artery stenosis selected — consider renovascular evaluation in context.");
    }

    var antith = [];
    var ant = val("cpad_antith");
    if(ant.indexOf("Full-dose")>=0){
      antith.push("Full-dose anticoagulation for another indication: " + (val("cpad_fullac_reason") || "not entered") + ".");
      antith.push("Do not automatically add SAPT or dual-pathway inhibition on top of full-dose anticoagulation unless there is a clear indication and bleeding risk is acceptable.");
    } else if(ant.indexOf("COMPASS")>=0){
      antith.push("COMPASS regimen selected: rivaroxaban 2.5 mg BID + aspirin for stable symptomatic PAD/polyvascular risk if bleeding risk acceptable.");
      antith.push("COMPASS trial one-liner: reduced major cardiovascular and limb events compared with aspirin alone, with increased major bleeding risk.");
      if(val("cpad_riva25")!=="Available") antith.push("Formulary/access issue: rivaroxaban 2.5 mg is " + val("cpad_riva25") + "; document clinical consideration and consider formulary/access pathway or alternative strategy.");
      if(highBleed) antith.push("Bleeding shortcut flags present; dual-pathway inhibition requires careful individualized review.");
    } else if(ant.indexOf("VOYAGER")>=0){
      antith.push("VOYAGER-PAD regimen selected: rivaroxaban 2.5 mg BID + aspirin after lower-extremity revascularization if bleeding risk acceptable.");
      antith.push("VOYAGER-PAD trial one-liner: after revascularization, reduced acute limb ischemia, major amputation, MI, stroke, or cardiovascular death, with increased bleeding risk.");
      if(val("cpad_riva25")!=="Available") antith.push("Formulary/access issue: rivaroxaban 2.5 mg is " + val("cpad_riva25") + "; document clinical consideration and consider formulary/access pathway or alternative strategy.");
      if(highBleed) antith.push("Bleeding shortcut flags present; VOYAGER-style therapy requires careful individualized review.");
    } else if(ant.indexOf("Single")>=0){
      antith.push("Single antiplatelet therapy selected: " + val("cpad_sapt") + ".");
      antith.push("Reason for not using COMPASS/VOYAGER or stronger strategy: " + val("cpad_not_dual") + ".");
    } else {
      antith.push("Antithrombotic deferred/contraindicated/needs review. Details: " + (val("cpad_defer_reason") || "not entered") + ".");
      antith.push("Reason for not using COMPASS/VOYAGER: " + val("cpad_not_dual") + ".");
    }
    if(bleed.length) antith.push("Bleeding-risk shortcut: " + bleed.join("; ") + ".");

    var htn = [];
    htn.push(val("cpad_htn") + ". " + (val("cpad_bp") || "No BP details entered") + ".");
    if(val("cpad_htn").indexOf("Uncontrolled")>=0) htn.push("BP optimization is part of PAD ASCVD-risk reduction.");

    var dm = [];
    dm.push(val("cpad_dm") + ". " + (val("cpad_a1c") || "No A1c/DM details entered") + ".");
    if(val("cpad_dm").indexOf("Uncontrolled")>=0) dm.push("Uncontrolled diabetes increases foot and wound risk; coordinate glycemic management and foot protection.");

    var lipid = [];
    lipid.push(val("cpad_lipid") + ".");
    lipid.push("LDL-C " + (val("cpad_ldl") ? val("cpad_ldl")+" "+val("cpad_ldl_unit") : "NA") +
               "; Non-HDL-C " + (val("cpad_nonhdl") ? val("cpad_nonhdl")+" "+val("cpad_nonhdl_unit") : "NA") +
               "; Lp(a) " + (val("cpad_lpa") ? val("cpad_lpa")+" "+val("cpad_lpa_unit") : "NA") + ".");
    if(val("cpad_lipid").indexOf("Needs high")>=0) lipid.push("High-intensity statin is the default lipid backbone in PAD if tolerated.");
    if(val("cpad_lipid").indexOf("ezetimibe")>=0 || val("cpad_lipid").indexOf("PCSK9")>=0) lipid.push("Escalate non-statin lipid therapy when LDL-C remains above threshold despite maximally tolerated statin.");

    var lifestyle = [];
    lifestyle.push("Smoking: " + val("cpad_smoke") + ". " + (val("cpad_smoke_plan") || "No smoking plan details entered") + ".");
    lifestyle.push("Exercise: " + val("cpad_exercise") + ". " + (val("cpad_exercise_plan") || "No exercise plan details entered") + ".");
    if(val("cpad_exercise").indexOf("Start")>=0 || val("cpad_exercise").indexOf("Refer")>=0) lifestyle.push("For claudication, walking therapy is treatment: walk to moderate symptoms, rest, repeat, and track distance.");
    if(val("cpad_exercise").indexOf("limb threat")>=0) lifestyle.push("Exercise therapy should not delay urgent limb-threat evaluation.");
    if(whyNoExercise.length) lifestyle.push("Why not exercise / exercise caveat: " + whyNoExercise.join("; ") + ".");

    var revasc = [];
    if(whyNoRevasc.length) revasc.push("Why not revascularization / revascularization status: " + whyNoRevasc.join("; ") + ".");
    if(lifestyleLimiting && val("cpad_exercise").indexOf("Inadequate")>=0) revasc.push("Persistent lifestyle-limiting claudication despite GDMT/exercise supports anatomic imaging and revascularization assessment.");
    if(clti) revasc.push("CLTI/rest pain/wound phenotype: revascularization feasibility should be assessed urgently when limb salvage is relevant.");


    var preset = [];
    if(visit.indexOf("Medication optimization")>=0){
      preset.push("Preset focus: medication optimization — prioritize antithrombotic choice, BP, diabetes, lipid therapy, smoking/exercise, bleeding risk, and quick polyvascular screen.");
    } else if(visit.indexOf("CLTI")>=0){
      preset.push("Preset focus: CLTI/wound visit — prioritize limb threat, wound/infection status, perfusion data, offloading/wound care, and urgent vascular/wound coordination.");
    } else if(visit.indexOf("Post-revascularization")>=0){
      preset.push("Preset focus: post-revascularization follow-up — prioritize recurrent symptoms, wound healing, surveillance status, VOYAGER-PAD eligibility, bleeding risk, and vascular lab/surgeon coordination.");
    } else if(visit.indexOf("New/worsening claudication")>=0){
      preset.push("Preset focus: worsening claudication — confirm no limb threat, distinguish cardiac/pulmonary limitation, optimize GDMT/exercise, and decide whether imaging/revascularization assessment is needed.");
    } else if(visit.indexOf("Second opinion")>=0){
      preset.push("Preset focus: second opinion/unclear plan — explicitly document phenotype, limb safety, current GDMT gaps, reason for or against revascularization, and follow-up responsibility.");
    } else {
      preset.push("Preset focus: routine follow-up — confirm limb safety, systemic ASCVD-risk optimization, function/wound trajectory, and follow-up interval.");
    }

    var evidenceAnchor =
"Evidence anchors:\n" +
"- 2024 ACC/AHA PAD guideline: confirmed PAD care should address limb risk and systemic ASCVD risk using GDMT, including antithrombotic therapy, lipid lowering, BP/diabetes/smoking management, exercise therapy, and selective revascularization.\n" +
"- COMPASS: in stable CAD/PAD, rivaroxaban 2.5 mg BID plus aspirin reduced major cardiovascular and limb events compared with aspirin alone, but increased major bleeding.\n" +
"- VOYAGER-PAD: after lower-extremity revascularization, rivaroxaban 2.5 mg BID plus aspirin reduced acute limb ischemia/major adverse limb and cardiovascular events, with increased bleeding risk.\n" +
"- ESC peripheral arterial and aortic disease framing supports screening PAD patients for polyvascular/aortic disease when symptoms or history suggest it.";

    var teachingPearl =
"Teaching pearl:\n" +
"In confirmed PAD, every visit should answer three questions: 1) Is the limb safe? 2) Is systemic ASCVD risk optimized? 3) Is function, wound status, or post-revascularization trajectory improving?";

    var follow = "Routine follow-up based on local clinic standard.";
    var fp = val("cpad_follow_pref");
    if(fp.indexOf("Acute")>=0 || acute) follow = "Same-day ED/vascular surgery.";
    else if(cardiacUrgent || neuroUrgent || aorticUrgent) follow = "Separate same-day/urgent cardiovascular, stroke/TIA, or aortic pathway as clinically indicated.";
    else if(fp.indexOf("Infected")>=0 || infected) follow = "Same-day/urgent infected ischemic foot pathway.";
    else if(fp.indexOf("CLTI")>=0 || clti) follow = "Urgent vascular/wound follow-up; track wound and perfusion closely.";
    else if(fp.indexOf("Lifestyle")>=0 || val("cpad_exercise").indexOf("Inadequate")>=0) follow = "Vascular lab/anatomic imaging and clinic follow-up within weeks or per local pathway.";
    else if(fp.indexOf("Stable claudication")>=0) follow = "Reassess after GDMT/exercise trial, commonly around 3 months or per local clinic standard.";
    else if(fp.indexOf("Stable asymptomatic")>=0) follow = "Stable PAD follow-up 6–12 months or local standard.";
    else if(fp.indexOf("Post-revascularization")>=0 || post) follow = "Post-revascularization surveillance per vascular lab/surgeon protocol.";
    if(followed.indexOf("following")>=0) follow += " Coordinate with " + followed + ".";

    var completed = [];
    var missing = [];
    function scoreItem(name, ok){ if(ok) completed.push(name); else missing.push(name); }
    scoreItem("Antithrombotic addressed", ant.indexOf("needs review")<0 || val("cpad_defer_reason"));
    scoreItem("HTN addressed", yesAddress(val("cpad_htn")));
    scoreItem("DM addressed / not applicable", yesAddress(val("cpad_dm")));
    scoreItem("Lipids addressed", yesAddress(val("cpad_lipid")) && (val("cpad_ldl") || val("cpad_nonhdl")));
    scoreItem("Smoking addressed", yesAddress(val("cpad_smoke")));
    scoreItem("Exercise/claudication addressed", yesAddress(val("cpad_exercise")));
    scoreItem("Limb escalation addressed", limb.length>0 && (val("cpad_status") || val("cpad_follow_pref")));
    scoreItem("Polyvascular screen addressed", quickPoly.length>0 || (card.length>0 && hf.length>0 && neuro.length>0 && aorta.length>0));
    var scoreNum = completed.length;
    var score = scoreNum + "/8";
    var scoreLabel = scoreNum >= 7 ? "Complete" : (scoreNum >= 5 ? "Mostly complete" : "Gaps remain");

    var urgentBanner = urgentTriggers.length ? "URGENT ESCALATION TRIGGERED: " + urgentTriggers.join("; ") + ".\n\n" : "";

    var patientCounsel =
"PAD is a circulation problem in the legs and also a marker of heart attack and stroke risk. The plan is to protect the leg and lower cardiovascular risk. Seek urgent care for sudden cold, painful, numb, weak, pale limb; new rest pain; spreading foot infection; new black/blue toes; chest pain at rest; stroke-like symptoms; or severe new abdominal/back pain. For claudication, walking therapy is treatment when there is no limb threat. Smoking cessation, cholesterol control, BP control, diabetes/foot care, and the right antithrombotic plan are all part of PAD treatment.";

    var qi =
"PAD Care Standard Completion:\n" +
"- Visit type: " + visit + "\n" +
"- Visit-type preset: " + preset.join(" ") + "\n" +
"- Phenotype documented: " + (pheno.length ? "yes" : "no") + "\n" +
"- Limb-threat/escalation addressed: " + (completed.indexOf("Limb escalation addressed")>=0 ? "yes" : "no") + "\n" +
"- Polyvascular/cardiovascular screen addressed: " + (completed.indexOf("Polyvascular screen addressed")>=0 ? "yes" : "no") + "\n" +
"- Antithrombotic plan addressed: " + (completed.indexOf("Antithrombotic addressed")>=0 ? "yes" : "no") + "\n" +
"- HTN addressed: " + (completed.indexOf("HTN addressed")>=0 ? "yes" : "no") + "\n" +
"- DM addressed/not applicable: " + (completed.indexOf("DM addressed / not applicable")>=0 ? "yes" : "no") + "\n" +
"- Lipids addressed: " + (completed.indexOf("Lipids addressed")>=0 ? "yes" : "no") + "\n" +
"- Smoking addressed: " + (completed.indexOf("Smoking addressed")>=0 ? "yes" : "no") + "\n" +
"- Exercise addressed: " + (completed.indexOf("Exercise/claudication addressed")>=0 ? "yes" : "no") + "\n" +
"- Score: " + score + " — " + scoreLabel + (missing.length ? " | Missing: " + missing.join(", ") : " | Complete");

    var medOpt =
urgentBanner +
"Medication optimization note:\n" +
"- Antithrombotic: " + antith.join(" ") + "\n" +
"- HTN: " + htn.join(" ") + "\n" +
"- DM: " + dm.join(" ") + "\n" +
"- Lipids: " + lipid.join(" ") + "\n" +
"- Lifestyle: " + lifestyle.join(" ") + "\n" +
"- Rivaroxaban 2.5 mg availability: " + val("cpad_riva25") + "\n" +
"- Bleeding-risk shortcut: " + (bleed.length ? bleed.join("; ") : "none selected") + "\n" +
"- PAD Care Standard Completion: " + score + " — " + scoreLabel + (missing.length ? " | Missing: " + missing.join(", ") : " | Complete") + "\n\n" +
teachingPearl + "\n\n" +
evidenceAnchor;

    var referral =
urgentBanner +
"Referral / coordination letter:\n" +
"Confirmed PAD patient. Visit type: " + visit + ". Working phenotype: " + phenotype + ". Current status: " + val("cpad_status") + "; Rutherford: " + val("cpad_rutherford") + ". Limb escalation concern: " + escalation + ". Polyvascular screen: " + poly.join(" ") + " Current management plan: antithrombotic " + val("cpad_antith") + "; HTN " + val("cpad_htn") + "; DM " + val("cpad_dm") + "; lipids " + val("cpad_lipid") + "; smoking " + val("cpad_smoke") + "; exercise " + val("cpad_exercise") + ". Revascularization context: " + (revasc.length ? revasc.join(" ") : "no revascularization-specific issue documented") + ". Follow-up/coordination: " + follow + "\n\n" + teachingPearl + "\n\n" + evidenceAnchor;

    var concise =
urgentBanner +
"Phenotype:\n" +
"- " + phenotype + "\n" +
"- Visit: " + visit + "; followed by: " + followed + "\n" +
"- Rutherford: " + val("cpad_rutherford") + "; PFD/MWD: " + (val("cpad_pfd") || "NA") + " / " + (val("cpad_mwd") || "NA") + "\n" +
"- " + preset.join(" ") + "\n\n" +

"Limb safety:\n" +
"- " + escalation + "\n" +
"- Pulse/foot: " + val("cpad_pulse_status") + "\n" +
"- Perfusion: " + val("cpad_perf_status") + (val("cpad_perf_note") ? " — " + val("cpad_perf_note") : "") + "\n\n" +

"Polyvascular screen:\n" +
"- " + poly.join("\n- ") + "\n\n" +

"Management:\n" +
"- Antithrombotic: " + antith.join(" ") + "\n" +
"- HTN: " + htn.join(" ") + "\n" +
"- DM: " + dm.join(" ") + "\n" +
"- Lipids: " + lipid.join(" ") + "\n" +
"- Lifestyle: " + lifestyle.join(" ") + "\n" +
"- Revascularization/exercise context: " + (revasc.length ? revasc.join(" ") : "no specific revascularization caveat selected") + "\n\n" +

"Follow-up:\n" +
"- " + follow + "\n\n" +

"Missing items / care standard:\n" +
"- PAD Care Standard Completion: " + score + " — " + scoreLabel + (missing.length ? "\n- Missing: " + missing.join(", ") : "\n- Complete") + "\n\n" +

"Teaching pearl:\n" +
"- In confirmed PAD, every visit should answer: Is the limb safe? Is systemic ASCVD risk optimized? Is function/wound/post-revascularization trajectory improving?\n\n" +

"Evidence anchor:\n" +
"- COMPASS: stable CAD/PAD dual-pathway inhibition reduced major cardiovascular/limb events vs aspirin alone but increased major bleeding.\n" +
"- VOYAGER-PAD: after lower-extremity revascularization, rivaroxaban 2.5 mg BID + aspirin reduced limb/CV events with increased bleeding risk.\n\n" +

"Copy-ready note:\n" +
"Confirmed PAD reviewed. Visit type: " + visit + ". Phenotype: " + phenotype + ". Rutherford: " + val("cpad_rutherford") + ". Limb safety: " + escalation + ". Polyvascular screen: " + poly.join(" ") + " Management: antithrombotic = " + val("cpad_antith") + "; HTN = " + val("cpad_htn") + "; DM = " + val("cpad_dm") + "; lipid = " + val("cpad_lipid") + "; smoking = " + val("cpad_smoke") + "; exercise = " + val("cpad_exercise") + ". Follow-up: " + follow + ".";

    var full =
urgentBanner +
"Confirmed PAD pathway:\n\n" +
"0. Visit type\n" +
"- " + visit + "\n" +
"- Already followed by: " + followed + "\n" +
"- " + preset.join(" ") + "\n\n" +
"1. Phenotype\n" +
"- Selected phenotype(s): " + (pheno.length ? pheno.join("; ") : "none selected") + "\n" +
"- Working phenotype: " + phenotype + "\n" +
"- Status today: " + val("cpad_status") + "\n" +
"- Rutherford-style category: " + val("cpad_rutherford") + "\n" +
"- Pain-free / maximum walking distance: " + (val("cpad_pfd") || "NA") + " / " + (val("cpad_mwd") || "NA") + "\n\n" +
"2. Limb risk / escalation\n" +
"- Limb features: " + (limb.length ? limb.join("; ") : "none selected") + "\n" +
"- Pulse/foot status: " + val("cpad_pulse_status") + "\n" +
"- Perfusion data: " + val("cpad_perf_status") + "; " + (val("cpad_perf_note") || "no details") + "\n" +
"- Escalation: " + escalation + "\n\n" +
"3. Polyvascular / cardiovascular screen\n" +
poly.map(function(x){return "- "+x;}).join("\n") + "\n\n" +
"4. Management plan\n" +
"Antithrombotic:\n" + antith.map(function(x){return "- "+x;}).join("\n") + "\n\n" +
"HTN:\n" + htn.map(function(x){return "- "+x;}).join("\n") + "\n\n" +
"Diabetes:\n" + dm.map(function(x){return "- "+x;}).join("\n") + "\n\n" +
"Lipids:\n" + lipid.map(function(x){return "- "+x;}).join("\n") + "\n\n" +
"Lifestyle:\n" + lifestyle.map(function(x){return "- "+x;}).join("\n") + "\n\n" +
"Bleeding-risk shortcut:\n" + (bleed.length ? bleed.map(function(x){return "- "+x;}).join("\n") : "- none selected") + "\n\n" +
"Why not revascularization:\n" + (whyNoRevasc.length ? whyNoRevasc.map(function(x){return "- "+x;}).join("\n") : "- no reason selected") + "\n\n" +
"Why not exercise:\n" + (whyNoExercise.length ? whyNoExercise.map(function(x){return "- "+x;}).join("\n") : "- no reason selected") + "\n\n" +
"5. Conditional modules\n" +
"- CLTI/wound: " + val("cpad_clti_module") + ". " + (val("cpad_clti_detail") || "No details entered") + "\n" +
"- Post-revascularization: " + val("cpad_post_module") + ". " + (val("cpad_post_detail") || "No details entered") + "\n\n" +
"6. Follow-up\n" +
"- " + follow + "\n\n" +
"7. PAD Care Standard Completion\n" +
"- " + score + " — " + scoreLabel + (missing.length ? " | Missing: " + missing.join(", ") : " | Complete") + "\n\n" +
teachingPearl + "\n\n" +
evidenceAnchor + "\n\n" +
patientCounsel + "\n\n" +
"Copy-ready note:\n" +
"Confirmed PAD reviewed. Visit type: " + visit + ". Phenotype: " + phenotype + ". Status: " + val("cpad_status") + "; Rutherford: " + val("cpad_rutherford") + ". Limb-risk/escalation: " + escalation + ". Polyvascular screen: " + poly.join(" ") + " Antithrombotic: " + antith.join(" ") + " HTN: " + htn.join(" ") + " DM: " + dm.join(" ") + " Lipids: " + lipid.join(" ") + " Lifestyle: " + lifestyle.join(" ") + " Follow-up: " + follow + ".";

    var finalText = concise;
    if(outputMode === "Full detailed note") finalText = full;
    if(outputMode === "Patient counseling paragraph") finalText = patientCounsel + "\n\n" + teachingPearl;
    if(outputMode === "QI checklist only") finalText = urgentBanner + qi;
    if(outputMode === "Medication optimization note") finalText = medOpt;
    if(outputMode === "Referral letter") finalText = referral;

    var level = urgentTriggers.length ? "red" : (clti || lifestyleLimiting || missing.length ? "amber" : "green");
    var out = document.getElementById("cpad_out");
    out.className = "output " + level;
    out.textContent = finalText;
    out.classList.remove("hidden");
  }

  render();
})();
</script>
</body>
</html>
