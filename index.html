<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fahad Almalki, MD</title>
<style>
:root{--ink:#0b2230;--muted:#5b6b78;--line:#d9e5ea;--bg:#f8fbfc;--teal:#0b5964;--teal2:#0d7888;--red:#b42318;--amber:#a15c07;--green:#067647;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.nav{max-width:1240px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:850}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#073c47,#0b7888);display:grid;place-items:center;color:white;font-weight:900}
.navlinks{display:flex;gap:9px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:800;border:1px solid transparent;background:transparent;color:#203746;padding:9px 13px;border-radius:999px;cursor:pointer;text-decoration:none}
button:hover,.btn:hover{background:#edf6f8}
.contact{border-color:var(--line);background:#fff}
.hero{max-width:1240px;margin:auto;padding:0 18px 28px}
.heroPanel{min-height:180px;background:linear-gradient(130deg,#073642,#0a5662 70%,#0d7484);display:grid;place-items:center;text-align:center;color:white;padding:38px 18px;box-shadow:0 18px 45px rgba(6,45,55,.14)}
.heroLine{font-size:clamp(18px,2vw,26px);font-weight:850}
main{max-width:1240px;margin:auto;padding:28px 18px 70px}
h2{font-size:clamp(28px,3vw,40px);margin:0 0 12px}
h3{font-size:22px;margin:0 0 10px}
h4{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#086274;margin:22px 0 10px}
p{color:#425563}.lead{font-size:18px;max-width:900px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 16px 32px rgba(4,42,52,.06)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.unitrow{display:grid;grid-template-columns:1fr 120px;gap:8px}.section{margin:36px 0}
small,.eyebrow{display:block;color:#006778;text-transform:uppercase;font-weight:900;letter-spacing:.18em;font-size:12px;margin-bottom:10px}
.primary{background:var(--teal2)!important;color:white!important;border-color:var(--teal2)!important}
.toolList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.toolItem{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;cursor:pointer}
.toolItem:hover{box-shadow:0 16px 32px rgba(4,42,52,.08);border-color:#b8d4dc}
.toolItem b{display:block;font-size:18px;margin-bottom:6px}.toolItem span{display:block;color:var(--muted);font-size:14px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:white}
label{font-weight:800;font-size:14px;display:block;margin-bottom:6px}.field{margin-bottom:14px}
.hint{display:block;font-size:12px;color:#71808a;font-weight:500;margin-top:3px}
.checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.check{display:flex;gap:9px;align-items:flex-start;font-weight:650;color:#213746}.check input{width:auto;margin-top:5px}
.output{border-left:5px solid var(--teal2);background:#f2fbfd;padding:18px;border-radius:14px;margin-top:18px;white-space:pre-wrap}
.output.red{border-color:var(--red);background:#fff5f5}.output.amber{border-color:var(--amber);background:#fff8ed}.output.green{border-color:var(--green);background:#f0fff8}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.breadcrumb{font-size:14px;color:var(--muted);margin-bottom:18px}.lock{max-width:520px;margin:38px auto}
.subtlebox{background:#f6fafb;border:1px dashed var(--line);border-radius:14px;padding:14px;margin-top:10px}.hidden{display:none!important}footer{border-top:1px solid var(--line);padding:28px 18px;text-align:center;color:#657786}
@media(max-width:850px){.grid,.grid2,.toolList,.checkgrid{grid-template-columns:1fr}.heroPanel{min-height:140px}}

.followedbox{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff}
.followedbox label{font-weight:800;color:#042f3b;margin-bottom:8px;display:block}
.followedbox .hint{font-weight:500;color:#5f7480}
.followedchecks{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
.followedchecks .check{display:flex;align-items:flex-start;gap:10px;font-weight:700;color:#0b2f3a}
.followedchecks input{margin-top:3px}


.badgeNote{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:#0b5964;background:#eef8fa;font-weight:800}
.pathStep{border:1px solid var(--line);border-radius:16px;background:#fbfdfe;margin:16px 0;overflow:hidden}
.pathStep>summary{cursor:pointer;list-style:none;padding:18px 20px;font-weight:900;font-size:17px;color:#073f4a;display:flex;justify-content:space-between;gap:14px;align-items:center}
.pathStep>summary::-webkit-details-marker{display:none}
.pathStep>summary:after{content:"＋";font-size:20px;color:var(--teal2);line-height:1}
.pathStep[open]>summary{background:#eef8fa;border-bottom:1px solid var(--line)}
.pathStep[open]>summary:after{content:"−"}
.pathStepBody{padding:4px 20px 20px}
.miniStep{border:1px dashed var(--line);border-radius:12px;background:white;margin:14px 0;padding:0 14px}
.miniStep>summary{cursor:pointer;padding:13px 0;font-weight:800;color:#31535d}
.stepIntro{margin:12px 0 18px;color:#5b6b78}
.scenarioPanel{border:1px solid var(--line);border-radius:16px;background:#fbfdfe;padding:20px;margin:18px 0}
.scenarioPanel>h3{color:#073f4a;margin-bottom:4px}.scenarioPanel>.hint{margin-bottom:16px}

</style>
</head>
<body>
<header class="topbar">
  <div class="nav">
    <div class="brand"><div class="logo">FA</div><span>Fahad Almalki, MD</span></div>
    <nav class="navlinks">
      <button data-page="home">Home</button>
      <button data-page="pathways">Clinical Pathways</button>
      <button data-page="crft">CRFT</button>
      <button class="contact" data-page="contact">Contact</button>
    </nav>
  </div>
</header>

<div class="hero" id="hero">
  <div class="heroPanel">
    <div class="heroLine">General Internal Medicine · Vascular Medicine · Clinical Reasoning · Quality Improvement</div>
  </div>
</div>

<main id="app"></main>
<footer>Fahad Almalki, MD · General Internal Medicine · Vascular Medicine</footer>

<script>
(function(){
  var USERNAME = "fahad";
  var PASSWORD_HASH = "441a58b07454cb4475218ed81796578a53c6001b9d92f8419a821854e8c7eaea";
  var authed = sessionStorage.getItem("fa_auth") === "yes";

  var tools = [
    {id:"pad-suspected",cat:"Vascular Medicine Clinic",title:"Suspected PAD Clinic Pathway",desc:"Deep guided vascular clinic pathway: symptoms, pulse exam, limb exam, ABI/TBI logic, diabetes, smoking, Lp(a), mimics, GDMT, referral urgency."},
    {id:"pad-confirmed",cat:"Vascular Medicine Clinic",title:"Confirmed PAD Clinic Pathway",desc:"Phenotype, GDMT, exercise, foot care, antithrombotic decisions, and revascularization triggers."},
    {id:"thrombosis-clinic",cat:"Vascular Medicine Clinic",title:"Thrombosis Clinic Pathway",desc:"Core DVT/PE thrombosis clinic: new vs follow-up assessment, anticoagulant choice, duration, extended therapy, bleeding risk, thrombophilia/APS testing, and consultant notes."},{id:"af-anticoag",cat:"Vascular Medicine Clinic",title:"AF Anticoagulation Decision Aid",desc:"Version 2 AF long-term stroke-prevention aid: CHA₂DS₂-VASc with absolute benefit framing, HAS-BLED, DOAC eligibility/dose-safety, antiplatelet deprescribing, LAAO consideration, and natural consultant notes."},{id:"unusual-site-thrombosis",cat:"Vascular Medicine Clinic",title:"Unusual-Site Thrombosis Pathway",desc:"CVT, portal/splanchnic, upper-extremity/catheter-related DVT, SVT, renal/gonadal and other unusual venous thromboses; site-specific workup, anticoagulant choice, duration, and consultant notes."},
    {id:"unusual",cat:"Vascular Medicine Clinic",title:"Unusual-Site Thrombosis Workup Tool",desc:"Splanchnic, CVST, renal vein, upper-extremity, young arterial thrombosis; OCP, Lp(a), JAK2/MPN, PNH, APS, cancer, anatomy."},
    {id:"af",cat:"Thrombosis / Antithrombotic Safety",title:"AF Anticoagulation Decision Aid",desc:"CHA2DS2-VASc, bleeding-risk frame, 1/5/10-year risk, DOAC vs warfarin danger zones, and shared decision note."},
    {id:"antithrombotic",cat:"Thrombosis / Antithrombotic Safety",title:"Antithrombotic Safety Assistant",desc:"Bleeding and reversal, HIT/PF4, thrombosis despite treatment, DOAC danger zones, heparin/anti-Xa/antithrombin problems, and antiplatelet overlap."},
    {id:"postop-troponin",cat:"GIM Diagnostic Reasoning",title:"Perioperative Cardiac Risk & MINS Pathway",desc:"Preoperative cardiac-risk assessment, postoperative troponin surveillance, MINS/MI interpretation, bleeding-safe management, and copy-ready notes."},
    {id:"diarrhea",cat:"GIM Diagnostic Reasoning",title:"Adult Diarrhea Triage & Diagnostic Pathway",desc:"Focused triage, syndrome classification, selective stool testing, C. difficile safety, hydration, medication review, and escalation planning."},
    {id:"hyponatremia",cat:"GIM Diagnostic Reasoning",title:"Hyponatremia Diagnostic Engine",desc:"Danger-first treatment, tonicity and glucose correction, ADH/urine interpretation, phenotype, ODS risk, correction monitoring, and copy-ready notes."},
    {id:"hypokalemia",cat:"GIM Diagnostic Reasoning",title:"Hypokalemia + Acid–Base Engine",desc:"GI vs renal potassium loss, metabolic acidosis/alkalosis, urine potassium/chloride, RTA, diuretics, mineralocorticoid clues."},
    {id:"cirrhosis-coag",cat:"GIM Diagnostic Reasoning",title:"Coagulation in Cirrhosis",desc:"Rebalanced hemostasis, procedure risk, INR pitfalls, fibrinogen/platelets, TEG/ROTEM, vitamin K, and thrombosis despite high INR."},
    {id:"ctu-daily",cat:"CTU / Rounding Standard",title:"CTU Daily Review Checklist",desc:"Diagnostic clarity, danger overnight, VTE prophylaxis, meds, mobility, pending tests, discharge barriers, and communication."}
  ];

  function app(){ return document.getElementById("app"); }
  function showHero(x){ document.getElementById("hero").style.display = x ? "block" : "none"; }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]; }); }
  function val(id){ var el=document.getElementById(id); return el ? el.value.trim() : ""; }
  function checked(name){ return Array.prototype.slice.call(document.querySelectorAll('input[name="'+name+'"]:checked')).map(function(x){return x.value;}); }
  function checks(name, arr){
    return '<div class="checkgrid">' + arr.map(function(x){
      return '<label class="check"><input type="checkbox" name="'+name+'" value="'+esc(x)+'"><span>'+esc(x)+'</span></label>';
    }).join("") + '</div>';
  }
  function setHash(page,param){ location.hash = param ? page + ":" + param : page; render(); }
  window.setHash = setHash;

  async function sha256Text(value){
    var data = new TextEncoder().encode(value);
    var digest = await crypto.subtle.digest("SHA-256", data);
    return Array.prototype.map.call(new Uint8Array(digest), function(x){ return x.toString(16).padStart(2,"0"); }).join("");
  }

  document.addEventListener("click", function(e){
    var p = e.target.closest("[data-page]");
    if(p){ setHash(p.getAttribute("data-page")); }
    var t = e.target.closest("[data-tool]");
    if(t){ setHash("tool", t.getAttribute("data-tool")); }
  });
  window.addEventListener("hashchange", render);

  function render(){
    var raw = location.hash.replace("#","") || "home";
    var parts = raw.split(":");
    var page = parts[0], param = parts[1];
    if(page === "home") return renderHome();
    if(page === "contact") return renderContact();
    if(page === "crft") return renderCrft();
    if(page === "pathways") return authed ? renderPathways() : renderLogin("pathways");
    if(page === "tool") return authed ? renderTool(param) : renderLogin("tool:" + param);
    renderHome();
  }

  function renderHome(){
    showHero(true);
    app().innerHTML = '<section><h2>Clinical pathway system</h2><p class="lead">A structured bedside library designed to standardize safe clinical reasoning, vascular medicine assessment, antithrombotic decisions, and General Internal Medicine diagnostic pathways.</p><div class="grid section"><div class="card"><small>Protected library</small><h3>Clinical Pathways</h3><p>Guided bedside workflows: danger first, phenotype, minimum standard assessment, action plan, and copy-ready notes.</p><button class="primary" data-page="pathways">Open pathways</button></div><div class="card"><small>Education</small><h3>CRFT</h3><p>Clinical reasoning education focused on problem framing, hypothesis generation, data interpretation, management planning, anticipation, and metacognition.</p><button data-page="crft">View CRFT</button></div><div class="card"><small>Contact</small><h3>Professional inquiries</h3><p>For academic, educational, clinical pathway, and quality-improvement communication.</p><button data-page="contact">Contact</button></div></div></section>';
  }

  function renderContact(){
    showHero(false);
    app().innerHTML = '<div class="breadcrumb"><button data-page="home">← Home</button></div><section class="card"><small>Contact</small><h2>Professional inquiries</h2><p><b><a href="mailto:contact@fahadalmalkimd.com">contact@fahadalmalkimd.com</a></b></p><p>Direct professional correspondence: <b><a href="mailto:fahad@fahadalmalkimd.com">fahad@fahadalmalkimd.com</a></b></p></section>';
  }

  function renderCrft(){
    showHero(false);
    app().innerHTML = '<div class="breadcrumb"><button data-page="home">← Home</button></div><section class="card"><small>Clinical reasoning education</small><h2>CRFT</h2><p>Structured framework to make reasoning observable, teachable, and improvable across repeated cases.</p><div class="grid2"><div><h4>Core domains</h4><ul><li>Problem framing</li><li>Hypothesis generation</li><li>Data interpretation</li><li>Management planning</li><li>Anticipation</li><li>Metacognition</li></ul></div><div><h4>Purpose</h4><p>Move bedside teaching from informal impression to explicit reasoning behaviors that can be coached, scored, and improved.</p></div></div></section>';
  }

  function renderLogin(target){
    showHero(false);
    app().innerHTML = '<section class="lock card"><small>Protected library</small><h2>Clinical Pathways Login</h2><div class="field"><label>Username</label><input id="u"></div><div class="field"><label>Password</label><input id="p" type="password"></div><button class="primary" id="loginBtn">Enter</button><p class="hint">Soft access gate only. Real privacy later needs Cloudflare Access or similar.</p></section>';
    document.getElementById("loginBtn").addEventListener("click", async function(){
      var enteredHash = await sha256Text(val("p"));
      if(val("u") === USERNAME && enteredHash === PASSWORD_HASH){
        sessionStorage.setItem("fa_auth","yes");
        authed = true;
        var parts = target.split(":");
        setHash(parts[0], parts[1]);
      } else {
        alert("Incorrect username or password");
      }
    });
  }

  function renderPathways(){
    showHero(false);
    var cats = [];
    tools.forEach(function(t){ if(cats.indexOf(t.cat) < 0) cats.push(t.cat); });
    var html = '<div class="breadcrumb"><button data-page="home">← Home</button></div><section><h2>Clinical Pathway Library</h2><p class="lead">Choose a pathway. Each tool starts with safety, classifies the phenotype, defines minimum assessment, and produces a copy-ready note.</p>';
    cats.forEach(function(cat){
      html += '<div class="section"><h4>'+esc(cat)+'</h4><div class="toolList">';
      tools.filter(function(t){return t.cat===cat;}).forEach(function(t){
        html += '<button class="toolItem" data-tool="'+t.id+'"><b>'+esc(t.title)+'</b><span>'+esc(t.desc)+'</span></button>';
      });
      html += '</div></div>';
    });
    html += '</section>';
    app().innerHTML = html;
  }

  function shell(title, subtitle, body){
    showHero(false);
    app().innerHTML = '<div class="breadcrumb"><button data-page="pathways">← Back to Pathways</button> <button data-page="home">Home</button></div><section><small class="eyebrow">Guided pathway</small><h2>'+esc(title)+'</h2><p class="lead">'+esc(subtitle)+'</p></section>' + body;
  }

  function renderTool(id){
    var t = tools.find(function(x){return x.id===id;});
    if(!t) return renderPathways();
    if(id === "pad-suspected") return renderPAD();
    if(id === "pad-confirmed") return renderConfirmedPAD();
    if(id === "thrombosis-clinic") return renderCoreVTE();
    if(id === "af-anticoag" || id === "af-anticoagulation" || id === "af-decision") return renderAFDecisionAid();
    if(id === "unusual-site-thrombosis") return renderUnusualSiteThrombosis();
    if(id === "postop-troponin") return renderPostopMINS();
    if(id === "antithrombotic") return renderAntithromboticSafety();
    if(id === "hyponatremia") return renderHyponatremia();
    if(id === "diarrhea") return renderDiarrhea();
    return shell(t.title, t.desc, '<section class="card"><h3>Guided pathway scaffold</h3><ol><li>Choose clinical scenario</li><li>Danger-first screen</li><li>Classify phenotype</li><li>Minimum standard assessment</li><li>Action plan</li><li>Teaching pearl</li><li>Copy-ready note</li></ol><p class="hint">This pathway is visible and ready for deeper expansion while keeping the site stable.</p></section>');
  }

  function selectField(id,label,options,hint){
    return '<div class="field"><label>'+esc(label)+'</label><select id="'+id+'">'+options.map(function(x){return '<option>'+esc(x)+'</option>';}).join("")+'</select>'+(hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</div>';
  }
  function inputField(id,label,placeholder){
    return '<div class="field"><label>'+esc(label)+'</label><input id="'+id+'" placeholder="'+esc(placeholder||"")+'"></div>';
  }


  function renderPAD(){
    shell("Suspected PAD Clinic Pathway","Diagnosis and triage pathway for suspected PAD: visit type, symptom phenotype, limb danger screen, PAD vs mimic, ABI/TBI testing plan, polyvascular screen, initial management/referral plan, care-standard score, output modes, and reset.",
    '<section class="card">'+

    '<h4>0. Visit type</h4>'+
    '<div class="grid2">'+
    selectField("spad_visit","Visit type",["New consult / first assessment","Abnormal pulse or ABI/TBI found incidentally","New/worsening exertional leg symptoms","CLTI / wound concern","Acute limb concern","Diabetic foot risk / poor healing","Pre-op vascular assessment","Medication/risk optimization only","Second opinion / unclear diagnosis"],"Suspected PAD is mainly a diagnosis/triage pathway.")+
    '<div class="followedbox"><label>Already followed by <span class="hint">Select all that apply.</span></label>'+
    '<div class="followedchecks">'+
    '<label class="check"><input type="checkbox" name="spad_followed" value="No one / needs coordination">No one / needs coordination</label>'+
    '<label class="check"><input type="checkbox" name="spad_followed" value="Vascular surgery following">Vascular surgery following</label>'+
    '<label class="check"><input type="checkbox" name="spad_followed" value="Cardiology following">Cardiology following</label>'+
    '<label class="check"><input type="checkbox" name="spad_followed" value="Wound care/podiatry following">Wound care/podiatry following</label>'+
    '<label class="check"><input type="checkbox" name="spad_followed" value="PCP/endocrine following">PCP/endocrine following</label>'+
    '<label class="check"><input type="checkbox" name="spad_followed" value="Other specialty following">Other specialty following</label>'+
    '</div></div>'+
    '</div>'+

    '<h4>1. Symptom phenotype</h4>'+
    checks("spad_reason",[
      "Exertional calf pain",
      "Exertional thigh/buttock pain",
      "Reduced walking distance",
      "Atypical leg pain",
      "Rest pain / nocturnal forefoot pain",
      "Foot ulcer or non-healing wound",
      "Gangrene / tissue loss",
      "Abnormal or absent pulses",
      "Abnormal ABI/TBI/waveforms",
      "Diabetic foot risk / poor healing",
      "Pre-op vascular assessment",
      "Cardiovascular risk optimization",
      "Unclear diagnosis / second opinion"
    ])+
    '<div class="grid2">'+
    selectField("spad_pattern","Main symptom pattern",[
      "Classic claudication: reproducible exertional muscle pain relieved by rest",
      "Atypical exertional leg symptoms",
      "Rest pain: forefoot pain worse lying flat, improved by dependency",
      "Wound/tissue loss phenotype",
      "Sudden severe limb symptoms",
      "Neuropathic/burning symptoms",
      "Back/radicular or joint-type pain",
      "Asymptomatic abnormal test/pulses"
    ],"First split: claudication vs limb threat vs mimic.")+
    selectField("spad_sev","Functional severity",["Asymptomatic","Mild symptoms, not limiting","Lifestyle-limiting exertional symptoms","Limits work/exercise/basic activities","Rest pain or tissue loss","Unclear"],"")+
    inputField("spad_pfd","Pain-free walking distance","e.g. 100 m, 1 block, unknown")+
    inputField("spad_mwd","Maximum walking distance","e.g. 300 m, unknown")+
    selectField("spad_rest","Relieved by rest within ~10 minutes?",["Unknown","Yes","No"],"")+
    selectField("spad_incline","Worse with stairs/incline?",["Unknown","Yes","No"],"")+
    '</div>'+

    '<h4>2. Limb danger / escalation</h4>'+
    checks("spad_limb",[
      "Acute limb ischemia concern: sudden pain/cold/numb/weak/pale limb",
      "New motor or sensory deficit",
      "Rest pain worse lying flat, improved by dependency",
      "Non-healing wound / ulcer",
      "Gangrene / tissue loss",
      "Infection: cellulitis/purulence/wet gangrene/systemic signs",
      "Blue toe / embolic lesion",
      "Rapidly worsening symptoms",
      "Absent Doppler signals if checked",
      "No limb-threat features today"
    ])+
    '<div class="grid2">'+
    selectField("spad_pulse","Pulse/foot status",["Not assessed","Normal/equal pulses","Reduced/absent pedal pulses","Doppler-only pedal signals","New asymmetry","Femoral pulse abnormality","Unclear"],"Collapsed to what changes triage.")+
    selectField("spad_foot","Foot/wound status",["No wound","Stable superficial wound","New/worsening wound","Gangrene/tissue loss","Infected foot concern","Diabetic foot risk without wound","Not assessed"],"")+
    selectField("spad_temp_color","Temperature/color",["Not assessed","Warm/normal","Cool limb","Cold limb","Dependent rubor","Pale/cyanotic/mottled"],"")+
    inputField("spad_limb_note","Optional focused limb exam note","side, pulse, wound, Doppler, sensory/motor")+
    '</div>'+

    '<h4>3. PAD vs mimic</h4>'+
    checks("spad_pad_support",[
      "Reproducible exertional muscle pain relieved by rest",
      "Abnormal/absent pulses",
      "ABI ≤0.90",
      "Borderline ABI with exertional symptoms",
      "Noncompressible ABI or diabetes/CKD requiring TBI",
      "Monophasic/absent Doppler waveforms",
      "Ulcer/tissue loss with perfusion concern",
      "Polyvascular disease or high ASCVD risk",
      "Smoking history",
      "Diabetes/CKD"
    ])+
    checks("spad_mimic",[
      "Spinal stenosis: better leaning forward/sitting, worse standing",
      "Radiculopathy: back pain, dermatomal radiation, neurologic signs",
      "Hip/knee osteoarthritis: joint-localized mechanical pain",
      "Venous claudication/severe venous disease: swelling, bursting pain",
      "Peripheral neuropathy: burning, stocking distribution, not exertional",
      "Chronic exertional compartment syndrome: younger patient, tightness with exercise",
      "Anemia/HF/lung disease/deconditioning: global exercise intolerance",
      "No clear mimic selected"
    ])+

    '<h4>4. ABI / TBI / vascular testing</h4>'+
    '<div class="grid2">'+
    selectField("spad_test_status","Testing status",["No vascular testing yet","ABI/TBI/waveforms already available","Testing ordered/pending","Prior test outdated or inconsistent with symptoms","Imaging already available","Urgent vascular lab needed"],"")+
    '<div class="field"><label>Right ABI</label><input id="spad_rabi" type="number" step="0.01" placeholder="number only"></div>'+
    '<div class="field"><label>Left ABI</label><input id="spad_labi" type="number" step="0.01" placeholder="number only"></div>'+
    '<div class="field"><label>Right TBI</label><input id="spad_rtbi" type="number" step="0.01" placeholder="optional"></div>'+

  function resetSuspectedPAD(){
    var out = document.getElementById("pad_out");
    var card = out ? out.closest("section.card") : document;
    if(!card) card = document;
    card.querySelectorAll("input").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio") el.checked = false;
      else el.value = "";
    });
    card.querySelectorAll("select").forEach(function(el){ el.selectedIndex = 0; });
    if(out){ out.textContent = ""; out.className = "output hidden"; }
    updateVTEElapsedHint();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function spadAbi(raw){
    if(!raw) return "not entered";
    var n = Number(raw);
    if(isNaN(n)) return "not interpretable";
    if(n <= 0.90) return n.toFixed(2) + " abnormal, supports PAD";
    if(n <= 0.99) return n.toFixed(2) + " borderline";
    if(n <= 1.40) return n.toFixed(2) + " normal range";
    return n.toFixed(2) + " noncompressible";
  }

  function calcPAD(){
    var visit = val("spad_visit");

    var support = checked("spad_pad_support");

    var vascular = checked("spad_vascular");
    var mode = val("spad_output_mode");

    var pattern = val("spad_pattern");

    var rabi = spadAbi(val("spad_rabi"));

    var acute = limb.some(function(x){return x.indexOf("Acute limb")>=0 || x.indexOf("motor")>=0 || x.indexOf("Absent Doppler")>=0;}) || pattern.indexOf("Sudden")>=0 || visit.indexOf("Acute")>=0;
    var infected = limb.some(function(x){return x.indexOf("Infection")>=0;}) || val("spad_foot").indexOf("Infected")>=0;
    var clti = limb.some(function(x){return x.indexOf("Rest pain")>=0 || x.indexOf("wound")>=0 || x.indexOf("Gangrene")>=0 || x.indexOf("tissue")>=0;}) ||

    var abnormal = rabi.indexOf("abnormal")>=0 || labi.indexOf("abnormal")>=0 || val("spad_exabi").indexOf("Abnormal")>=0 || val("spad_wave").indexOf("Monophasic")>=0 || val("spad_wave").indexOf("Absent")>=0;
    var noncompress = rabi.indexOf("noncompressible")>=0 || labi.indexOf("noncompressible")>=0 || val("spad_calc").indexOf("Yes")>=0;
    var classic = pattern.indexOf("Classic")>=0;

    else if(classic && abnormal) phenotype = "Likely symptomatic PAD with claudication.";

    else if(abnormal) phenotype = "Objective PAD likely; correlate test with symptoms and limb exam.";

  function resetCoreVTE(){
    var out = document.getElementById("vte_out");
    var card = out ? out.closest("section.card") : document;
    if(!card) card = document;
    card.querySelectorAll("input").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio") el.checked = false;
      else el.value = "";
    });
    card.querySelectorAll("select").forEach(function(el){ el.selectedIndex = 0; });
    if(out){ out.textContent = ""; out.className = "output hidden"; }
    updateVTEElapsedHint();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function vteHas(arr, text){
    return arr.some(function(x){return x.indexOf(text)>=0;});
  }


  function vteElapsedFromDate(dateStr){
    if(!dateStr) return "not entered";
    var d = new Date(dateStr + "T00:00:00");
    if(isNaN(d.getTime())) return "not interpretable";
    var diffDays = Math.floor((new Date() - d) / 86400000);
    if(diffDays < 0) return "future date entered";
    if(diffDays < 7) return diffDays + " days";
    if(diffDays < 31) return Math.floor(diffDays/7) + " weeks";
    if(diffDays < 183) return Math.max(1, Math.floor(diffDays/30)) + " months";
    if(diffDays < 365) return "6-12 months";
    return (diffDays/365.25).toFixed(1) + " years";
  }

  function vtePhaseFromDate(dateStr){
    if(!dateStr) return "Unclear";
    var d = new Date(dateStr + "T00:00:00");
    if(isNaN(d.getTime())) return "Unclear";
    var diffDays = Math.floor((new Date() - d) / 86400000);
    if(diffDays < 0) return "Unclear";
    if(diffDays < 7) return "<7 days";
    if(diffDays < 31) return "1-4 weeks";
    if(diffDays < 92) return "1-3 months";
    if(diffDays < 183) return "3-6 months";
    return ">6 months";
  }


  function updateVTEElapsedHint(){
    var el = document.getElementById("vte_elapsed_hint");
    var dateEl = document.getElementById("vte_date");
    if(!el || !dateEl) return;
    var dateStr = dateEl.value;
    var elapsed = vteElapsedFromDate(dateStr);
    var phase = vtePhaseFromDate(dateStr);
    if(!dateStr){
      el.textContent = "Select the VTE event date to calculate time since event.";
    } else {
      el.textContent = elapsed + " since event; treatment phase: " + phase + ".";
    }
  }


  function vteRenalSummary(){
    var raw = val("vte_egfr");
    var n = parseFloat(raw);
    if(!isNaN(n)){
      if(n >= 50) return "eGFR/CrCl " + n + ": ≥50, standard DOAC use usually acceptable if no other issue.";
      if(n >= 30) return "eGFR/CrCl " + n + ": 30-49, use caution and verify agent/dose/bleeding risk.";
      if(n >= 15) return "eGFR/CrCl " + n + ": 15-29, severe renal impairment; specialist review advised.";
      if(n >= 0) return "eGFR/CrCl " + n + ": <15/dialysis range; specialist pathway.";
    }
    return val("vte_renal");
  }

  function calcCoreVTE(){
    var visit = val("vte_visit");
    var eventDate = val("vte_date");
    var eventElapsed = vteElapsedFromDate(eventDate);
    var eventPhase = vtePhaseFromDate(eventDate);
    updateVTEElapsedHint();
    var pheno = checked("vte_pheno");
    var red = [];
    var risks = checked("vte_risk");
    var bleedShort = [];
    [val("vte_bleed_status"), val("vte_platelets"), val("vte_procedure"), val("vte_antiplatelet"), val("vte_bleed_summary")].forEach(function(x){
      if(x && x !== "None" && x.indexOf("No active/recent")<0 && x.indexOf("Platelets ≥100")<0 && x.indexOf("No procedure")<0 && x.indexOf("No major safety")<0) bleedShort.push(x);
    });
    var workup = checked("vte_workup");
    var workupQuestion = val("vte_workup_question");
    var ageTrigger = val("vte_age_trigger");
    var followup = checked("vte_followup");
    var mode = val("vte_output_mode");
    var renalSummary = vteRenalSummary();
    var liverSummary = val("vte_liver");

    var emergency = false;
    var routeUnusual = vteHas(pheno,"Splanchnic") || vteHas(pheno,"Superficial") || vteHas(workup,"Route out: unusual-site");
    var cancer = vteHas(risks,"Active cancer") || vteHas(workup,"Cancer-associated");
    var pregnancy = vteHas(risks,"Pregnancy");
    var recurrent = vteHas(pheno,"Recurrent") || val("vte_event_count").indexOf("Recurrent")>=0 || val("vte_event_count").indexOf("Multiple")>=0;
    var onACClot = vteHas(pheno,"Thrombosis on anticoagulation");
    var unprovoked = vteHas(risks,"Unprovoked");
    var majorTransient = vteHas(risks,"Major transient");
    var minorTransient = vteHas(risks,"Minor transient");
    var persistent = vteHas(risks,"Persistent");
    var aps = val("vte_aps").indexOf("Known")>=0 || val("vte_aps").indexOf("Triple")>=0 || vteHas(risks,"APS") || vteHas(workup,"APS");
    var highBleed = val("vte_bleed_risk").indexOf("High")>=0 || val("vte_bleed_risk").indexOf("Active")>=0 || val("vte_bleed_status").indexOf("Active bleeding")>=0 || val("vte_bleed_status").indexOf("within 30")>=0 || val("vte_bleed_status").indexOf("intracranial")>=0 || val("vte_platelets").indexOf("<50")>=0 || val("vte_procedure").indexOf("High-bleeding-risk")>=0 || val("vte_bleed_summary").indexOf("High bleeding")>=0 || val("vte_bleed_summary").indexOf("Temporarily unsafe")>=0;

    var phenotype = "Core VTE clinic assessment.";
    if(routeUnusual) phenotype = "Possible unusual-site or non-core thrombosis — route to Unusual-Site Thrombosis Pathway.";
    else if(cancer) phenotype = "Cancer-associated VTE screen — consider Cancer-Associated Thrombosis module if active cancer drives management.";
    else if(pregnancy) phenotype = "Pregnancy/postpartum-associated VTE screen — route to pregnancy-specific anticoagulation pathway.";
    else if(onACClot) phenotype = "Possible thrombosis while on anticoagulation.";
    else if(recurrent) phenotype = "Recurrent VTE.";
    else if(vteHas(pheno,"Pulmonary embolism")) phenotype = "Pulmonary embolism follow-up.";
    else if(vteHas(pheno,"Proximal")) phenotype = "Proximal lower-extremity DVT follow-up.";
    else if(vteHas(pheno,"distal")) phenotype = "Isolated distal DVT follow-up.";
    else if(vteHas(pheno,"Subsegmental")) phenotype = "Subsegmental PE / limited PE pathway.";
    else if(vteHas(pheno,"No objectively")) phenotype = "VTE not objectively confirmed yet.";
    else if(pheno.length) phenotype = pheno.join("; ");

    var eventClass = "Unclear / mixed provoking-factor classification.";
    if(majorTransient) eventClass = "Major transient provoked VTE.";
    else if(minorTransient) eventClass = "Minor transient / weakly provoked VTE.";
    else if(unprovoked) eventClass = "Unprovoked VTE.";
    else if(persistent) eventClass = "Persistent-risk-factor VTE.";
    else if(cancer) eventClass = "Cancer-associated VTE.";
    else if(aps) eventClass = "APS-suspected or APS-associated thrombosis.";
    else if(risks.length) eventClass = risks.join("; ");

    var escalation = "No same-day escalation screen included; this pathway assumes the patient is suitable for outpatient thrombosis clinic assessment.";
    var urgentTriggers = [];
    if(routeUnusual){
      escalation = "Use the separate Unusual-Site Thrombosis Pathway for site-specific imaging, workup, anticoagulant, and duration logic.";
    }

    var acPlan = [];
    var current = val("vte_current_ac");
    if(current === "Apixaban" || current === "Rivaroxaban"){
      acPlan.push(current + " selected/current. Check VTE-specific loading/initial dosing, renal/hepatic function, adherence, interactions, and bleeding risk.");
      if(val("vte_dose_ok").indexOf("No")>=0 || val("vte_dose_ok").indexOf("Loading")>=0) acPlan.push("Dose/loading concern selected: verify acute VTE regimen before labeling treatment failure.");
    } else if(current === "Dabigatran" || current === "Edoxaban"){
      acPlan.push(current + " selected/current. Confirm initial 5-10 day parenteral anticoagulant lead-in was completed.");
    } else if(current === "LMWH"){
      acPlan.push("LMWH selected/current. Useful in pregnancy, selected cancer-associated thrombosis, absorption concerns, or complex interactions.");
    } else if(current === "Warfarin"){
      acPlan.push("Warfarin selected/current. Confirm INR target, time in therapeutic range, interactions, and APS indication if relevant.");
    } else if(current === "None"){
      acPlan.push("No anticoagulant selected/current. Confirm whether anticoagulation is indicated, contraindicated, completed, or pending objective confirmation.");
    } else {
      acPlan.push("Current anticoagulant: " + current + ". Verify indication, dose, interactions, renal/liver function, and adherence.");
    }
    if(aps && (current === "Apixaban" || current === "Rivaroxaban" || current === "Dabigatran" || current === "Edoxaban")) acPlan.push("APS concern selected: high-risk APS generally favors warfarin over DOAC; avoid DOAC in triple-positive/arterial APS unless specialist rationale.");
    if(onACClot) acPlan.push("Possible recurrence on anticoagulation: first confirm new clot vs residual, then verify adherence, dose/loading, renal/liver function, interactions, absorption, cancer, APS, and HIT before declaring anticoagulant failure.");
    acPlan.push("Renal safety: " + renalSummary);
    acPlan.push("Hepatic safety: " + liverSummary + ".");
    acPlan.push("Bleeding/safety modifiers: " + (bleedShort.length ? bleedShort.join("; ") : "none major selected") + ".");
    if(highBleed) acPlan.push("High bleeding-risk features present: anticoagulant intensity, agent, monitoring, interruption planning, and duration must be individualized.");

    var durationAuto = "Specialist individualized decision.";
    if(val("vte_duration_intent") !== "Auto-suggest from risk"){
      durationAuto = val("vte_duration_intent");
    } else if(emergency || routeUnusual || cancer || pregnancy || aps || onACClot){
      durationAuto = "Specialist individualized decision";
    } else if(majorTransient && val("vte_resolved").indexOf("Yes")>=0 && !recurrent){
      durationAuto = "Stop after 3 months is usually reasonable if treatment completed and bleeding/recurrence context fits.";
    } else if(unprovoked || persistent || recurrent){
      durationAuto = highBleed ? "Extended/indefinite anticoagulation would usually be considered, but bleeding risk may dominate." : "Extended anticoagulation preferred; indefinite anticoagulation often favored if bleeding risk acceptable.";
    } else if(minorTransient){
      durationAuto = "Continue 3-6 months then reassess recurrence risk, bleeding risk, and patient preference.";
    } else {
      durationAuto = "At least 3 months for objectively confirmed DVT/PE; then reassess recurrence risk, bleeding risk, and preference.";
    }

    var extended = [];
    extended.push("Duration recommendation: " + durationAuto + (val("vte_duration_note") ? " Rationale note: " + val("vte_duration_note") + "." : ""));
    extended.push("Extended-phase option: " + val("vte_extended_agent") + ".");
    if(val("vte_extended_agent").indexOf("Reduced-dose apixaban")>=0) extended.push("Reference anchor: AMPLIFY-EXT supports apixaban 2.5 mg BID or 5 mg BID vs placebo for extended prevention.");
    if(val("vte_extended_agent").indexOf("Reduced-dose rivaroxaban")>=0) extended.push("Reference anchor: EINSTEIN-CHOICE supports rivaroxaban 10 mg or 20 mg vs aspirin for extended prevention.");
    extended.push("Patient preference: " + val("vte_patient_pref") + ".");

    var workupPlan = [];
    if(vteHas(workup,"No additional workup")) workupPlan.push("No additional APS/inherited thrombophilia/cancer workup needed today beyond clinical follow-up.");
    workupPlan.push("Workup question: " + workupQuestion + ". Age trigger: " + ageTrigger + ".");
    if(ageTrigger.indexOf("<50")>=0) workupPlan.push("VTE at age <50 is a selective-workup context, not an automatic indication. Testing should be pursued only if it changes anticoagulant choice, duration, APS management, pregnancy/estrogen counseling, or family counseling.");
    if(aps || val("vte_aps").indexOf("Consider")>=0 || val("vte_aps").indexOf("planned")>=0 || vteHas(workup,"APS phenotype")) workupPlan.push("APS: consider lupus anticoagulant, anticardiolipin, and anti-beta-2 glycoprotein I testing when timing/anticoagulant interference allows; confirm persistence with repeat testing ≥12 weeks if positive.");
    if(val("vte_thrombo_test").indexOf("Consider")>=0 || val("vte_thrombo_test").indexOf("Selective")>=0 || vteHas(workup,"Inherited thrombophilia context") || vteHas(workup,"Recurrent VTE") || vteHas(workup,"Hormone- or pregnancy")) workupPlan.push("Inherited thrombophilia: consider selective testing such as antithrombin, protein C/S, factor V Leiden, and prothrombin G20210A only when management-changing; avoid reflex broad panels.");
    if(vteHas(workup,"Testing timing problem")) workupPlan.push("Testing timing problem: defer or interpret carefully during acute thrombosis or while on anticoagulation, especially for protein C/S, antithrombin, and lupus anticoagulant interpretation.");
    if(vteHas(workup,"Do not test")) workupPlan.push("Do-not-test flag selected: avoid thrombophilia testing if the result will not change management.");
    if(vteHas(workup,"Occult cancer screen")) workupPlan.push("Occult cancer screen: history, exam, basic labs, and age-appropriate screening unless symptoms/signs suggest a targeted evaluation.");
    if(vteHas(workup,"Route out")) workupPlan.push("Route-out flag selected: use the more specific pathway for unusual-site or active cancer-associated thrombosis.");
    if(!workupPlan.length) workupPlan.push("Workup should be selective; avoid APS/inherited thrombophilia testing that will not change management.");

    var followPlan = [];
    if(vteHas(followup,"Persistent dyspnea")) followPlan.push("Persistent dyspnea/exercise limitation after PE: consider post-PE syndrome / CTEPD evaluation if persistent beyond ~3 months or clinically concerning; CTEPH is the pulmonary-hypertension subtype.");
    if(vteHas(followup,"Persistent leg")) followPlan.push("Persistent leg symptoms: assess post-thrombotic syndrome, compression for symptoms, mobility, and recurrence clues.");
    if(vteHas(followup,"Bleeding safety")) followPlan.push("Bleeding safety counseling required.");
    if(vteHas(followup,"Medication adherence")) followPlan.push("Adherence counseling required: missed doses can rapidly reduce protection with DOACs.");
    if(vteHas(followup,"Peri-procedural")) followPlan.push("Peri-procedural interruption question: use a procedure/renal-function/bleeding-risk specific plan.");
    if(vteHas(followup,"Estrogen")) followPlan.push("Estrogen/pregnancy counseling: avoid estrogen when appropriate and plan pregnancy anticoagulation separately.");
    if(!followPlan.length) followPlan.push("Routine follow-up: confirm symptom trajectory, bleeding, adherence, duration plan, and patient understanding.");

    var completed = [];
    var missing = [];
    function scoreItem(name, ok){ if(ok) completed.push(name); else missing.push(name); }
    scoreItem("VTE phenotype documented", pheno.length>0 && !vteHas(pheno,"No objectively"));    scoreItem("Provoking factor classified", risks.length>0);
    scoreItem("Anticoagulant safety reviewed", val("vte_current_ac") && val("vte_dose_ok") && val("vte_adherence") && (val("vte_egfr") || val("vte_renal")) && val("vte_liver"));
    scoreItem("Duration decision addressed", durationAuto.length>0);
    scoreItem("Bleeding risk addressed", val("vte_bleed_risk") && val("vte_bleed_status") && val("vte_platelets") && val("vte_procedure") && val("vte_bleed_summary"));
    scoreItem("Workup decision addressed", workup.length>0 && val("vte_workup_question") && val("vte_age_trigger") && val("vte_aps") && val("vte_thrombo_test"));
    scoreItem("Follow-up/counseling addressed", followup.length>0);
    var scoreNum = completed.length;
    var score = scoreNum + "/7";
    var scoreLabel = scoreNum >= 6 ? "Complete" : (scoreNum >= 4 ? "Mostly complete" : "Gaps remain");

    var evidenceAnchor =
"Evidence anchors: Thrombosis Canada DVT/PE treatment and duration guides; ASH 2020 VTE treatment guideline; CHEST VTE antithrombotic guideline update; acute VTE trials AMPLIFY, EINSTEIN-DVT, EINSTEIN-PE, Hokusai-VTE, RE-COVER; extended-therapy trials AMPLIFY-EXT and EINSTEIN-CHOICE; APS anchor TRAPS/EULAR when APS suspected.";

    var teaching =
"Teaching: classify the clot first. A surgery-provoked DVT, unprovoked PE, recurrent VTE, cancer-associated clot, APS-associated clot, and thrombosis while on anticoagulation have different recurrence risk, anticoagulant choice, and duration. The blood thinner does not dissolve the clot directly; it prevents extension and recurrence while the body breaks it down.";

    var safetyNet =
"Safety-net: seek urgent care for worsening shortness of breath, chest pain, fainting, coughing blood, new severe limb swelling/pain/color change, severe headache or neurologic symptoms, black stools, vomiting blood, major bleeding, or trauma while anticoagulated.";

    var urgentBanner = urgentTriggers.length ? "ROUTE/ESCALATION: " + urgentTriggers.join("; ") + ".\n\n" : "";

    var formalConsultantLetter =
urgentBanner +
"Dear Colleague,\n\n" +
"Thank you for asking me to assess this patient in thrombosis clinic. This is a " + visit + " visit. I reviewed the index event, objective confirmation, VTE phenotype, provoking-factor classification, recurrence-risk features, bleeding-risk features, anticoagulant safety, duration question, and need for selective APS/thrombophilia or cancer-related workup.\n\n" +
"My impression is that this is best classified as: " + phenotype + " The event classification is: " + eventClass + ". The event summary is: " + (val("vte_summary") || "not provided") + ". Objective confirmation status is " + val("vte_obj") + ". The VTE event date is " + (eventDate || "not entered") + " (" + eventElapsed + "), corresponding to the " + eventPhase + " phase. Clinical severity is " + val("vte_clotburden") + ".\n\n" +
"Pathway routing: " + escalation + " Current anticoagulant context: " + acPlan.join(" ") + "\n\n" +
"For duration, my current recommendation is: " + durationAuto + " Extended-phase option selected/reviewed: " + val("vte_extended_agent") + ". The decision is based on recurrence risk, bleeding risk, whether the provoking factor has resolved, patient values, and whether this is routine DVT/PE versus a special scenario requiring a separate pathway.\n\n" +
"Workup plan: " + workupPlan.join(" ") + " Follow-up plan: " + followPlan.join(" ") + "\n\n" +
"The VTE Care Standard Completion score is " + score + " — " + scoreLabel + (missing.length ? ", with remaining gaps: " + missing.join(", ") + "." : ", with no major remaining gaps in the selected care-standard items.") + "\n\n" +
"I reviewed counseling and safety-net advice with the patient. " + teaching + " " + safetyNet + "\n\n" +
evidenceAnchor + "\n\n" +
"Sincerely,\nThrombosis / Vascular Medicine";

    var conciseClinicNote =
urgentBanner +
"Impression:\n" +
"- " + phenotype + "\n" +
"- Event class: " + eventClass + "\n" +
"- Pathway routing: " + escalation + "\n\n" +
"Important positives:\n" +
"- Event: " + (val("vte_summary") || "not provided") + "; date: " + (eventDate || "NA") + " (" + eventElapsed + "); phase: " + eventPhase + "; objective status: " + val("vte_obj") + "\n" +
"- Current anticoagulant: " + val("vte_current_ac") + "; phase: " + val("vte_phase") + "; dose/adherence: " + val("vte_dose_ok") + " / " + val("vte_adherence") + "\n" +
"- Bleeding risk: " + val("vte_bleed_risk") + "; safety modifiers: " + (bleedShort.length ? bleedShort.join("; ") : "none major selected") + "\n" +
"- Renal/liver: " + renalSummary + " / " + liverSummary + "\n" +
"- Workup: " + workupQuestion + "; age trigger: " + ageTrigger + "; APS " + val("vte_aps") + "; inherited thrombophilia " + val("vte_thrombo_test") + "\n\n" +
"Plan:\n" +
"- Anticoagulant: " + acPlan.join(" ") + "\n" +
"- Duration: " + extended.join(" ") + "\n" +
"- Workup: " + workupPlan.join(" ") + "\n" +
"- Follow-up/counseling: " + followPlan.join(" ") + "\n" +
"- Missing items: " + (missing.length ? missing.join(", ") : "none");

    var counselingTeachingNote =
urgentBanner +
"Teaching for clinician/non-thrombosis attending:\n" +
"- " + teaching + "\n" +
"- Current patient classification: " + phenotype + " / " + eventClass + ".\n" +
"- Duration logic: major transient resolved events often stop after the acute treatment course, while unprovoked, persistent-risk, recurrent, APS, cancer-associated, or anticoagulation-failure scenarios often require extended or individualized therapy if bleeding risk allows.\n" +
"- Selective testing principle: VTE age <50 is a trigger for selective consideration, not automatic testing. Do not order APS/inherited thrombophilia testing unless the result could change anticoagulant choice, duration, family counseling, pregnancy/estrogen counseling, or APS management.\n\n" +
"Patient explanation:\n" +
"- A blood thinner mainly prevents the clot from growing or coming back while the body gradually breaks it down.\n" +
"- The treatment length depends on why the clot happened, whether the trigger is gone, whether there were previous clots, and bleeding risk.\n" +
"- If long-term prevention is needed, lower-dose DOAC options may be used for selected patients after the initial treatment period.\n\n" +
"Safety-net:\n" +
"- " + safetyNet + "\n\n" +
"Evidence/trial names to remember:\n" +
"- Acute VTE: AMPLIFY, EINSTEIN-DVT, EINSTEIN-PE, Hokusai-VTE, RE-COVER.\n" +
"- Extended VTE prevention: AMPLIFY-EXT, EINSTEIN-CHOICE.\n" +
"- Guideline anchors: Thrombosis Canada DVT/PE treatment and duration guides, ASH VTE treatment guideline, CHEST VTE antithrombotic guideline.";

    var finalText = formalConsultantLetter;
    if(mode === "Concise clinic note") finalText = conciseClinicNote;
    if(mode === "Counseling / teaching note") finalText = counselingTeachingNote;

    var level = urgentTriggers.length ? "red" : (routeUnusual || cancer || pregnancy || onACClot || recurrent || highBleed || missing.length ? "amber" : "green");
    var out = document.getElementById("vte_out");
    out.className = "output " + level;
    out.textContent = finalText;
    out.classList.remove("hidden");
  }

  function resetUnusualSiteThrombosis(){
    var out = document.getElementById("ust_out");
    var card = out ? out.closest("section.card") : document;
    if(!card) card = document;
    card.querySelectorAll("input").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio") el.checked = false;
      else el.value = "";
    });
    card.querySelectorAll("select").forEach(function(el){ el.selectedIndex = 0; });
    if(out){ out.textContent = ""; out.className = "output hidden"; }
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function ustHas(arr, text){
    return arr.some(function(x){ return x.indexOf(text)>=0; });
  }

  function calcUnusualSiteThrombosis(){
    var visit = val("ust_visit");
    var site = val("ust_site");
    var timing = val("ust_timing");
    var confirm = val("ust_confirm");
    var context = checked("ust_context");
    var work = checked("ust_workup");
    var follow = checked("ust_followup");
    var mode = val("ust_output_mode");

    var cvt = site.indexOf("Cerebral")>=0;
    var pvt = site.indexOf("Portal")>=0 || site.indexOf("Splanchnic")>=0 || site.indexOf("Budd")>=0;
    var uedvt = site.indexOf("Upper")>=0 || site.indexOf("Catheter")>=0;
    var svt = site.indexOf("Superficial")>=0;
    var renalGonadal = site.indexOf("Renal")>=0 || site.indexOf("Gonadal")>=0;
    var ocular = site.indexOf("Retinal")>=0;

    var phenotype = site + " — " + timing + "; confirmation: " + confirm + ".";
    var siteLogic = [];
    if(cvt) siteLogic.push("CVT logic: anticoagulation is generally standard even when venous-congestion-related intracranial blood is present, unless a rare safety exception dominates; coordinate with neurology/stroke for seizures, intracranial hypertension, or neurologic deficits.");
    if(pvt) siteLogic.push("Portal/splanchnic logic: assess cirrhosis/portal hypertension, varices/bleeding risk, SMV extension or bowel ischemia concern, malignancy, intra-abdominal inflammation, and MPN/PNH context.");
    if(uedvt) siteLogic.push("Upper-extremity/catheter logic: define catheter/device need, function, infection, cancer/device status, and thoracic outlet/effort thrombosis phenotype.");
    if(svt) siteLogic.push("SVT logic: management depends on length, proximity to SFJ/SPJ, deep extension, symptoms, and VTE risk factors; high-risk SVT often uses a 45-day anticoagulant strategy.");
    if(renalGonadal) siteLogic.push("Renal/gonadal logic: assess pregnancy/postpartum, malignancy, nephrotic syndrome, local compression/inflammation, and need for follow-up imaging.");
    if(ocular) siteLogic.push("Ocular venous thrombosis logic: prioritize standard vascular risk factors and ophthalmology context; systemic thrombophilia testing should be selective and phenotype-driven.");
    if(!siteLogic.length) siteLogic.push("Other unusual-site thrombosis: use site-specific imaging, local provoking-factor assessment, anticoagulant safety review, and management-changing workup.");

    var safety = [];
    safety.push("Current anticoagulant: " + val("ust_current_ac") + "; phase: " + val("ust_phase") + ".");
    safety.push("Renal safety: " + (val("ust_crcl") || val("ust_renal")) + " / " + val("ust_renal") + ".");
    safety.push("Liver/varices safety: " + val("ust_liver") + ".");
    safety.push("Bleeding/platelets/procedure: " + val("ust_bleed") + "; " + val("ust_platelets") + "; " + val("ust_procedure") + ".");
    var highSafety = val("ust_bleed").indexOf("Active")>=0 || val("ust_bleed").indexOf("within 30")>=0 || val("ust_bleed").indexOf("intracranial")>=0 || val("ust_platelets").indexOf("<50")>=0 || val("ust_procedure").indexOf("High")>=0 || val("ust_liver").indexOf("Varices")>=0 || val("ust_liver").indexOf("Decompensated")>=0;

    var workupPlan = [];
    workupPlan.push("Workup question: " + val("ust_workup_question") + ". Age context: " + val("ust_age_trigger") + ".");
    if(val("ust_age_trigger").indexOf("<50")>=0) workupPlan.push("VTE age <50 is a selective-workup context, not automatic testing.");
    if(ustHas(work,"MPN/JAK2")) workupPlan.push("Consider MPN/JAK2 evaluation, especially for splanchnic/Budd-Chiari or unexplained unusual-site thrombosis.");
    if(ustHas(work,"PNH")) workupPlan.push("Consider PNH flow cytometry if Budd-Chiari/splanchnic thrombosis is accompanied by cytopenias or hemolysis clues.");
    if(ustHas(work,"APS context")) workupPlan.push("Consider APS testing if result would change anticoagulant choice/duration; high-risk APS generally favors warfarin over DOAC.");
    if(ustHas(work,"Inherited thrombophilia context") || ustHas(work,"Strong first-degree")) workupPlan.push("Consider inherited thrombophilia testing only if management-changing: duration, family counseling, pregnancy/estrogen counseling, or unusual/recurrent phenotype management.");
    if(ustHas(work,"Testing timing problem")) workupPlan.push("Testing timing problem: acute thrombosis or anticoagulant exposure may distort protein C/S, antithrombin, and lupus anticoagulant interpretation.");
    if(ustHas(work,"Do not test")) workupPlan.push("Do-not-test flag selected: avoid testing if a clear local major provoking factor explains the event and results will not change management.");
    if(ustHas(work,"Occult cancer")) workupPlan.push("Occult cancer screen: history, exam, basic labs, and age-appropriate screening unless red flags.");
    if(ustHas(work,"No additional")) workupPlan.push("No additional workup needed today.");

    var management = [];
    management.push("Anticoagulant plan: " + val("ust_agent_plan") + ".");
    management.push("Duration plan: " + val("ust_duration_intent") + ".");
    management.push("Imaging plan: " + val("ust_imaging_plan") + ".");
    if(val("ust_plan_note")) management.push("Rationale note: " + val("ust_plan_note") + ".");
    if(highSafety) management.push("Safety caveat: high bleeding/procedure/platelet/liver-risk modifier selected; anticoagulant agent, intensity, interruption plan, and duration require individualized review.");

    var followPlan = [];
    if(ustHas(follow,"Bleeding safety")) followPlan.push("Bleeding safety counseling.");
    if(ustHas(follow,"Adherence")) followPlan.push("Adherence counseling.");
    if(ustHas(follow,"Procedure")) followPlan.push("Procedure/interruption planning.");
    if(ustHas(follow,"Pregnancy")) followPlan.push("Pregnancy/estrogen counseling.");
    if(ustHas(follow,"neurologic")) followPlan.push("Neurology/CVT follow-up for persistent neurologic symptoms.");
    if(ustHas(follow,"Portal")) followPlan.push("Hepatology coordination for portal hypertension/varices.");
    if(ustHas(follow,"Catheter")) followPlan.push("Catheter/device decision: keep vs remove depending need, function, infection, and symptoms.");
    if(ustHas(follow,"SVT")) followPlan.push("SVT extension/recurrence counseling.");
    if(ustHas(follow,"Post-thrombotic")) followPlan.push("Post-thrombotic symptoms counseling.");
    if(!followPlan.length) followPlan.push("Routine counseling: bleeding, adherence, recurrence symptoms, and follow-up plan.");

    var completed = [];
    var missing = [];
    function scoreItem(name, ok){ if(ok) completed.push(name); else missing.push(name); }
    scoreItem("Site/phenotype documented", site && timing && confirm);
    scoreItem("Site-specific context addressed", context.length>0);
    scoreItem("Anticoagulant/safety reviewed", val("ust_current_ac") && val("ust_renal") && val("ust_liver") && val("ust_bleed") && val("ust_platelets"));
    scoreItem("Etiology/workup addressed", val("ust_workup_question") && work.length>0);
    scoreItem("Management/duration addressed", val("ust_duration_intent") && val("ust_agent_plan") && val("ust_imaging_plan"));
    scoreItem("Follow-up/counseling addressed", follow.length>0);
    var score = completed.length + "/6";
    var scoreLabel = completed.length >= 5 ? "Complete" : (completed.length >= 4 ? "Mostly complete" : "Gaps remain");

    var evidence = "Evidence anchors: Thrombosis Canada CVT guide and Canadian Stroke Best Practices CVT module; Thrombosis Canada portal vein thrombosis guide; ISTH splanchnic vein thrombosis guidance; Thrombosis Canada SVT guide; CALISTO and SURPRISE for SVT anticoagulation strategy; site-specific expert review for catheter-related UEDVT, Budd-Chiari, renal/gonadal, and ocular venous thrombosis.";
    var teaching = "Teaching: unusual-site thrombosis is not managed by routine DVT/PE duration logic alone. First classify the site, then identify local provoking factors, site-specific complications, anticoagulant safety, and management-changing workup.";

    var formal =
"Dear Colleague,\n\n" +
"Thank you for asking me to assess this patient with unusual-site thrombosis. This is a " + visit + " visit. The working phenotype is: " + phenotype + " Case summary: " + (val("ust_summary") || "not provided") + ".\n\n" +
"Site-specific interpretation: " + siteLogic.join(" ") + " Current clinical context includes: " + (context.length ? context.join("; ") : "not specified") + ". Main specialty coordination: " + val("ust_consult") + ". Current symptom status: " + val("ust_symptoms") + ".\n\n" +
"Anticoagulation and safety: " + safety.join(" ") + "\n\n" +
"Etiology/workup plan: " + workupPlan.join(" ") + "\n\n" +
"Management plan: " + management.join(" ") + "\n\n" +
"Follow-up/counseling: " + followPlan.join(" ") + "\n\n" +
"Care standard completion: " + score + " — " + scoreLabel + (missing.length ? ". Remaining gaps: " + missing.join(", ") + "." : ".") + "\n\n" +
evidence + "\n\n" +
"Sincerely,\nThrombosis / Vascular Medicine";

    var concise =
"Impression:\n" +
"- " + phenotype + "\n" +
"- Site-specific logic: " + siteLogic.join(" ") + "\n\n" +
"Important positives:\n" +
"- Summary: " + (val("ust_summary") || "not provided") + "\n" +
"- Context: " + (context.length ? context.join("; ") : "not specified") + "\n" +
"- Safety: " + safety.join(" ") + "\n\n" +
"Plan:\n" +
"- Workup: " + workupPlan.join(" ") + "\n" +
"- Management: " + management.join(" ") + "\n" +
"- Follow-up: " + followPlan.join(" ") + "\n" +
"- Missing items: " + (missing.length ? missing.join(", ") : "none");

    var counseling =
"Teaching for clinician/non-thrombosis attending:\n" +
"- " + teaching + "\n" +
"- Current site: " + site + ". This site requires site-specific workup and follow-up rather than routine DVT/PE logic alone.\n\n" +
"Patient explanation:\n" +
"- This clot is in a less common location. Treatment decisions depend on the exact site, whether there is a local cause, whether it is acute or chronic, and bleeding risk.\n" +
"- A blood thinner mainly prevents the clot from extending or recurring while the body gradually breaks clot down.\n\n" +
"Safety-net:\n" +
"- Seek urgent care for major bleeding, black stools, vomiting blood, severe headache or neurologic symptoms, worsening abdominal pain, worsening shortness of breath/chest pain, or rapidly worsening limb swelling/pain.\n\n" +
"References/trials to remember:\n" +
"- CVT: Thrombosis Canada CVT guide; Canadian Stroke Best Practices CVT module.\n" +
"- Portal/splanchnic: Thrombosis Canada PVT guide; ISTH splanchnic guidance.\n" +
"- SVT: CALISTO and SURPRISE.\n";

    var finalText = formal;
    if(mode === "Concise clinic note") finalText = concise;
    if(mode === "Counseling / teaching note") finalText = counseling;

    var out = document.getElementById("ust_out");
    out.className = "output " + (highSafety || missing.length ? "amber" : "green");
    out.textContent = finalText;
    out.classList.remove("hidden");
  }

  function resetAFDecisionAid(){
    var out = document.getElementById("af_out");
    var card = out ? out.closest("section.card") : document;
    if(!card) card = document;
    card.querySelectorAll("input").forEach(function(el){
      if(el.type === "checkbox" || el.type === "radio") el.checked = false;
      else el.value = "";
    });
    card.querySelectorAll("select").forEach(function(el){ el.selectedIndex = 0; });
    if(out){ out.textContent = ""; out.className = "output hidden"; }
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function afHas(arr, text){
    return arr.some(function(x){ return x.indexOf(text)>=0; });
  }

  function afStrokeRiskPct(score){
    var table = {0:0.2,1:1.0,2:2.2,3:3.2,4:4.8,5:7.2,6:9.7,7:11.2,8:10.8,9:12.2};
    return table[Math.min(score,9)];
  }

  function afStrokeRiskEstimate(score){
    var pct = afStrokeRiskPct(score);
    if(score === 0) return "very low, approximately " + pct.toFixed(1) + "% per year";
    if(score === 1) return "low-intermediate, approximately " + pct.toFixed(1) + "% per year";
    if(score >= 7) return "very high, approximately " + pct.toFixed(1) + "% per year or higher";
    return "approximately " + pct.toFixed(1) + "% per year";
  }

  function afBenefitEstimate(score){
    var baseline = afStrokeRiskPct(score);
    var treated = baseline * 0.35;
    var arr = baseline - treated;
    var nnt = arr > 0 ? Math.round(100 / arr) : null;
    if(score === 0) return "absolute benefit is very small at this risk level";
    return "if anticoagulation reduces relative stroke/systemic embolism risk by about two-thirds, risk may fall from about " + baseline.toFixed(1) + "%/year to about " + treated.toFixed(1) + "%/year; absolute reduction about " + arr.toFixed(1) + "%/year; rough NNT about " + nnt + " patient-years";
  }

  function afBleedingRiskEstimate(status, platelets, renal, liver, antiplatelet, procedure, impact, hasbledScore){
    var high = status.indexOf("Active")>=0 || status.indexOf("within 30")>=0 || status.indexOf("intracranial")>=0 || platelets.indexOf("<50")>=0 || renal.indexOf("15-29")>=0 || renal.indexOf("<15")>=0 || renal.indexOf("AKI")>=0 || liver.indexOf("Varices")>=0 || liver.indexOf("Decompensated")>=0 || antiplatelet.indexOf("Dual")>=0 || antiplatelet.indexOf("Recent ACS")>=0 || procedure.indexOf("High")>=0 || impact.indexOf("High bleeding")>=0 || impact.indexOf("Temporarily unsafe")>=0 || hasbledScore >= 3;
    var moderate = status.indexOf("within 3 months")>=0 || status.indexOf("GI or GU")>=0 || status.indexOf("Hemoglobin falling")>=0 || platelets.indexOf("50-100")>=0 || renal.indexOf("30-49")>=0 || liver.indexOf("Cirrhosis")>=0 || antiplatelet.indexOf("Aspirin")>=0 || antiplatelet.indexOf("NSAID")>=0 || procedure.indexOf("Low")>=0 || impact.indexOf("Caution")>=0 || hasbledScore === 2;
    if(high) return "high or potentially prohibitive until corrected/clarified";
    if(moderate) return "moderate, with modifiable safety issues to address";
    if(impact.indexOf("Unclear")>=0 || status.indexOf("Unclear")>=0 || platelets.indexOf("unknown")>=0 || renal.indexOf("Unknown")>=0 || liver.indexOf("Unknown")>=0) return "uncertain; missing safety data should be clarified";
    return "low by the selected clinical modifiers";
  }

  function calcAFDecisionAid(){
    var visit = val("af_visit");
    var afType = val("af_type");
    var gate = checked("af_gate");
    var chads = checked("af_chads");
    var hasbled = checked("af_hasbled");
    var special = checked("af_special");
    var mode = val("af_output_mode");

    var score = 0;
    if(afHas(chads,"Congestive")) score += 1;
    if(afHas(chads,"Hypertension")) score += 1;
    if(afHas(chads,"Age ≥75")) score += 2;
    if(afHas(chads,"Diabetes")) score += 1;
    if(afHas(chads,"Prior stroke")) score += 2;
    if(afHas(chads,"Vascular")) score += 1;
    if(afHas(chads,"Age 65-74")) score += 1;
    if(afHas(chads,"female")) score += 1;

    var hasbledScore = 0;
    if(afHas(hasbled,"Uncontrolled")) hasbledScore += 1;
    if(afHas(hasbled,"Abnormal renal")) hasbledScore += 1;
    if(afHas(hasbled,"Abnormal liver")) hasbledScore += 1;
    if(afHas(hasbled,"Prior stroke")) hasbledScore += 1;
    if(afHas(hasbled,"Bleeding history")) hasbledScore += 1;
    if(afHas(hasbled,"Labile INR")) hasbledScore += 1;
    if(afHas(hasbled,"Elderly")) hasbledScore += 1;
    if(afHas(hasbled,"Drugs")) hasbledScore += 1;
    if(afHas(hasbled,"Alcohol")) hasbledScore += 1;

    var sex = val("af_sex");
    var doacExcluded = afHas(gate,"Mechanical") || afHas(gate,"Moderate-to-severe") || afHas(gate,"Rheumatic") || afHas(gate,"High-risk APS") || val("af_doac_elig").indexOf("Warfarin")>=0;
    var specialist = afHas(gate,"Pregnancy") || afHas(gate,"Severe renal") || afHas(gate,"Significant liver") || afHas(gate,"Strong CYP") || val("af_doac_elig").indexOf("Specialist")>=0;
    var lowRisk = (sex === "Male" && score === 0) || (sex === "Female" && score === 1 && afHas(chads,"female") && chads.length === 1);
    var intermediate = (sex === "Male" && score === 1) || (sex === "Female" && score === 2);
    var highRisk = (sex === "Male" && score >= 2) || (sex === "Female" && score >= 3);

    var strokeCategory = "Risk category unclear — verify sex and CHA₂DS₂-VASc items.";
    if(lowRisk) strokeCategory = "Low risk: anticoagulation usually not indicated.";
    else if(intermediate) strokeCategory = "Intermediate risk: anticoagulation is reasonable and should be individualized with shared decision-making.";
    else if(highRisk) strokeCategory = "High risk: oral anticoagulation is recommended unless contraindicated.";
    else if(score > 0) strokeCategory = "Risk may be intermediate depending sex/risk modifiers; use shared decision-making.";

    var annualStrokeRisk = afStrokeRiskEstimate(score);
    var benefitEstimate = afBenefitEstimate(score);

    var safetyMods = [];
    [val("af_bleed_status"), val("af_platelets"), val("af_renal"), val("af_liver"), val("af_antiplatelet"), val("af_procedure"), val("af_safety_impact")].forEach(function(x){
      if(x && x !== "None" && x.indexOf("No active/recent")<0 && x.indexOf("Platelets ≥100")<0 && x.indexOf("CrCl ≥50")<0 && x.indexOf("No significant")<0 && x.indexOf("No procedure")<0 && x.indexOf("No major safety")<0) safetyMods.push(x);
    });

    var highSafety = val("af_bleed_status").indexOf("Active")>=0 || val("af_bleed_status").indexOf("within 30")>=0 || val("af_bleed_status").indexOf("intracranial")>=0 || val("af_platelets").indexOf("<50")>=0 || val("af_liver").indexOf("Varices")>=0 || val("af_liver").indexOf("Decompensated")>=0 || val("af_procedure").indexOf("High")>=0 || val("af_safety_impact").indexOf("High bleeding")>=0 || val("af_safety_impact").indexOf("Temporarily unsafe")>=0 || hasbledScore >= 3;

"Sincerely,\nVascular Medicine / General Internal Medicine";

    var concise =

"AF stroke-prevention anticoagulation assessment. CHA₂DS₂-VASc is " + score + ", with approximate untreated annual stroke/systemic embolism risk of " + annualStrokeRisk + ". " + strokeCategory + "\n\n" +
"Benefit/risk:\n" +
"- Expected benefit: " + benefitEstimate + "\n" +
"- HAS-BLED: " + hasbledScore + " — use to correct modifiable risk, not to deny OAC by itself\n" +
"- Bleeding risk: " + bleedingRisk + "\n\n" +
"Key positives:\n" +
"- AF context: " + afType + "; documentation: " + val("af_documented") + "\n" +
"- DOAC eligibility: " + val("af_doac_elig") + "; valve/rheumatic context: " + val("af_valve_note") + "\n" +
"- Renal/liver: " + (val("af_crcl") || val("af_renal")) + " / " + val("af_liver") + "\n" +
"- Antiplatelet/NSAID: " + val("af_antiplatelet") + "\n" +
